<!DOCTYPE html>
<html class="light" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Claridad"/>
  <meta name="theme-color" content="#3525cd"/>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg"/>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png"/>
  <link rel="manifest" href="manifest.json"/>
  <title>Claridad Financiera — Control Mensual &amp; Deudas</title>

  <!-- Google Fonts: Plus Jakarta Sans & Material Symbols Outlined (Stitch Design System) -->
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

  <!-- Supabase JS v2 & Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Tailwind CSS with Stitch "Claridad Financiera" Tokens -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-error": "#ffffff",
            "surface-container-highest": "var(--surface-container-highest)",
            "secondary": "var(--secondary)",
            "surface-container-lowest": "var(--surface-container-lowest)",
            "primary-fixed-dim": "#c3c0ff",
            "on-secondary-container": "#00714e",
            "inverse-surface": "#283044",
            "secondary-container": "#82f5c1",
            "error-container": "#ffdad6",
            "on-tertiary-fixed": "#40000c",
            "tertiary-fixed": "#ffdada",
            "surface": "var(--surface)",
            "inverse-primary": "#c3c0ff",
            "background": "var(--background)",
            "on-error-container": "#93000a",
            "on-surface": "var(--on-surface)",
            "inverse-on-surface": "#eef0ff",
            "outline-variant": "var(--outline-variant)",
            "surface-tint": "#4d44e3",
            "on-primary": "#ffffff",
            "secondary-fixed": "#85f8c4",
            "surface-dim": "#d2d9f4",
            "on-surface-variant": "var(--on-surface-variant)",
            "tertiary": "var(--tertiary)",
            "on-primary-fixed": "#0f0069",
            "tertiary-fixed-dim": "#ffb3b6",
            "outline": "var(--outline)",
            "on-secondary-fixed": "#002114",
            "on-tertiary-fixed-variant": "#920028",
            "surface-container-low": "var(--surface-container-low)",
            "primary-fixed": "#e2dfff",
            "primary": "var(--primary)",
            "primary-container": "var(--primary-container)",
            "on-tertiary-container": "#ffd0d2",
            "on-primary-fixed-variant": "#3323cc",
            "tertiary-container": "#c20038",
            "secondary-fixed-dim": "#68dba9",
            "surface-bright": "var(--surface-bright)",
            "on-secondary": "#ffffff",
            "surface-container": "var(--surface-container)",
            "on-tertiary": "#ffffff",
            "on-background": "var(--on-background)",
            "on-secondary-fixed-variant": "#005137",
            "surface-variant": "#dae2fd",
            "surface-container-high": "var(--surface-container-high)",
            "error": "#ba1a1a",
            "on-primary-container": "#dad7ff"
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "md": "0.75rem",
            "lg": "1rem",
            "xl": "1.25rem",
            "2xl": "1.5rem",
            "full": "9999px"
          },
          spacing: {
            "space-md": "1rem",
            "margin": "1rem",
            "space-xs": "0.25rem",
            "gutter": "1rem",
            "space-sm": "0.5rem",
            "space-lg": "1.5rem",
            "space-xl": "2rem",
            "margin-tablet": "1.5rem",
            "margin-desktop": "2rem"
          },
          fontFamily: {
            "sans": ["Plus Jakarta Sans", "-apple-system", "BlinkMacSystemFont", "sans-serif"],
            "headline-sm": ["Plus Jakarta Sans", "sans-serif"],
            "body-md": ["Plus Jakarta Sans", "sans-serif"],
            "display-currency": ["Plus Jakarta Sans", "sans-serif"],
            "body-sm": ["Plus Jakarta Sans", "sans-serif"],
            "label-lg": ["Plus Jakarta Sans", "sans-serif"],
            "headline-lg": ["Plus Jakarta Sans", "sans-serif"],
            "label-md": ["Plus Jakarta Sans", "sans-serif"],
            "display-currency-mobile": ["Plus Jakarta Sans", "sans-serif"],
            "headline-md": ["Plus Jakarta Sans", "sans-serif"],
            "body-lg": ["Plus Jakarta Sans", "sans-serif"],
            "label-sm": ["Plus Jakarta Sans", "sans-serif"]
          },
          fontSize: {
            "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
            "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
            "display-currency": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.03em", "fontWeight": "800" }],
            "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
            "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
            "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
            "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }],
            "display-currency-mobile": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
            "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
            "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "500" }],
            "label-sm": ["10px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "700" }]
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --surface: #faf8ff;
      --surface-bright: #faf8ff;
      --surface-container-lowest: #ffffff;
      --surface-container-low: #f2f3ff;
      --surface-container: #eaedff;
      --surface-container-high: #e2e7ff;
      --surface-container-highest: #dae2fd;
      --on-surface: #131b2e;
      --on-surface-variant: #464555;
      --outline: #777587;
      --outline-variant: #c7c4d8;
      --primary: #3525cd;
      --primary-container: #4f46e5;
      --secondary: #006c4a;
      --tertiary: #950029;
      --background: #faf8ff;
      --on-background: #131b2e;
    }
    html.dark {
      --surface: #0b0f19;
      --surface-bright: #111827;
      --surface-container-lowest: #131b2e;
      --surface-container-low: #19223a;
      --surface-container: #1f2a47;
      --surface-container-high: #263354;
      --surface-container-highest: #2e3d63;
      --on-surface: #eef0ff;
      --on-surface-variant: #a6adce;
      --outline: #777e9e;
      --outline-variant: #2c3654;
      --primary: #6366f1;
      --primary-container: #4f46e5;
      --secondary: #10b981;
      --tertiary: #fb7185;
      --background: #0b0f19;
      --on-background: #eef0ff;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--background);
      color: var(--on-surface);
      min-height: 100dvh;
      -webkit-tap-highlight-color: transparent;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 550, 'GRAD' 0, 'opsz' 24;
      user-select: none;
    }
    .material-symbols-outlined.filled {
      font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
    .custom-scroll::-webkit-scrollbar {
      display: none;
    }
    .custom-scroll {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up {
      animation: slideUp 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-in {
      animation: fadeIn 0.18s ease-out forwards;
    }
    .bento-card {
      background-color: var(--surface-container-lowest);
      border: 1px solid color-mix(in srgb, var(--outline-variant) 45%, transparent);
      box-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.04), 0 4px 12px -2px rgba(79, 70, 229, 0.03);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .bento-card:hover {
      border-color: color-mix(in srgb, var(--primary) 35%, var(--outline-variant));
    }
    .hero-indigo {
      background: linear-gradient(135deg, #4f46e5 0%, #3525cd 60%, #2618a8 100%);
      box-shadow: 0 10px 28px -6px rgba(79, 70, 229, 0.38), 0 4px 10px -2px rgba(15, 23, 42, 0.08);
    }
    .active-scale:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col font-body-md pb-24 selection:bg-primary/20">

  <!-- TOP APP BAR (Stitch Shared Component Anchor) -->
  <header class="sticky top-0 z-40 bg-surface/90 backdrop-blur-md border-b border-outline-variant/40 shadow-xs transition-all duration-150">
    <div class="max-w-5xl mx-auto px-4 h-16 flex justify-between items-center gap-2">
      <!-- Left: Brand Logo, User Profile & Greeting -->
      <div class="flex items-center gap-2.5 min-w-0">
        <img src="assets/logo.svg" alt="Claridad Financiera Logo" onclick="switchMainView('inicio')" class="w-10 h-10 rounded-xl shadow-xs cursor-pointer flex-shrink-0 hover:scale-105 transition-transform"/>
        <button onclick="openProfileOrLogin()" class="relative cursor-pointer group focus:outline-none flex-shrink-0" title="Cambiar de usuario o gestionar cuenta">
          <div id="header-avatar" class="w-9 h-9 rounded-full bg-surface-container-high text-primary font-extrabold text-xs flex items-center justify-center ring-2 ring-primary/20 group-hover:ring-primary/50 transition-all">
            H
          </div>
          <span id="cloud-status-dot" class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-secondary rounded-full ring-2 ring-surface" title="Sincronizado con Supabase"></span>
        </button>
        <div class="flex flex-col min-w-0 cursor-pointer" onclick="openProfileOrLogin()">
          <div class="flex items-center gap-1.5">
            <span id="header-section-title" class="font-headline-sm text-[16px] sm:text-[17px] font-extrabold text-on-surface leading-tight tracking-tight truncate">Control Mensual</span>
            <span id="header-role-badge" class="hidden text-[10px] font-extrabold uppercase px-1.5 py-0.5 rounded-full bg-primary/10 text-primary">Admin</span>
          </div>
          <span id="header-greeting" class="font-label-sm text-[11px] text-on-surface-variant font-semibold truncate">Hola, Hugo 👋 • Cambiar usuario</span>
        </div>
      </div>

      <!-- Center: Quick Mode Switcher Pill (Control Mensual vs Deudas P2P) -->
      <div class="hidden sm:flex items-center bg-surface-container p-1 rounded-xl border border-outline-variant/30 gap-1">
        <button onclick="switchMainView('inicio')" id="top-pill-mensual" class="px-3 py-1 rounded-lg text-xs font-extrabold bg-surface-container-lowest text-primary shadow-xs transition-all flex items-center gap-1">
          <span class="material-symbols-outlined text-[16px]">account_balance_wallet</span>
          Control Mensual
        </button>
        <button onclick="switchMainView('cuentas')" id="top-pill-deudas" class="px-3 py-1 rounded-lg text-xs font-semibold text-on-surface-variant hover:text-on-surface transition-all flex items-center gap-1">
          <span class="material-symbols-outlined text-[16px]">swap_horiz</span>
          Deudas &amp; Grupos
        </button>
      </div>

      <!-- Right: iOS .IPA Download, User Switcher, Theme, Notifications & Quick New Action -->
      <div class="flex items-center gap-1.5 flex-shrink-0">
        <button onclick="openIOSDownloadModal()" class="flex items-center gap-1 px-2.5 py-1.5 rounded-xl bg-primary/10 hover:bg-primary/20 text-primary text-xs font-extrabold transition active-scale" title="Descargar aplicación en iPhone (.IPA / iOS)">
          <span class="material-symbols-outlined text-[17px]">phone_iphone</span>
          <span class="hidden lg:inline">iPhone .IPA</span>
        </button>

        <button onclick="openProfileOrLogin()" class="hidden md:flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-surface-container-low hover:bg-surface-container border border-outline-variant/30 text-xs font-bold text-on-surface transition active-scale" title="Cambiar de usuario o crear cuenta">
          <span class="material-symbols-outlined text-[17px] text-primary">switch_account</span>
          <span id="header-user-pill">Hugo</span>
        </button>

        <button onclick="toggleTheme()" aria-label="Alternar tema claro/oscuro" class="p-2 rounded-xl text-on-surface-variant hover:bg-surface-container transition-all active-scale" title="Modo oscuro / claro">
          <span id="theme-icon" class="material-symbols-outlined text-[21px]">dark_mode</span>
        </button>

        <button onclick="toggleNotificationsDrawer()" aria-label="Notificaciones y alertas" class="relative p-2 rounded-xl text-on-surface-variant hover:bg-surface-container transition-all active-scale" title="Pagos pendientes y alertas">
          <span class="material-symbols-outlined text-[22px]">notifications</span>
          <span id="notif-badge" class="hidden absolute top-1.5 right-1.5 min-w-[16px] h-4 px-1 bg-error text-on-error text-[10px] font-extrabold rounded-full flex items-center justify-center ring-2 ring-surface">0</span>
        </button>

        <button onclick="openQuickActionSheet()" id="btn-quick-new" class="flex items-center gap-1.5 bg-primary-container text-on-primary px-3.5 py-2 rounded-xl font-label-lg text-label-lg shadow-sm hover:bg-primary transition-all active-scale">
          <span class="material-symbols-outlined text-[19px]">add_circle</span>
          <span class="hidden sm:inline font-bold">Nuevo</span>
        </button>
      </div>
    </div>
  </header>

  <!-- NOTIFICATIONS & PENDING APPROVALS DRAWER -->
  <div id="notifications-drawer" class="hidden fixed inset-0 z-50 bg-slate-950/40 backdrop-blur-xs flex justify-end">
    <div class="bg-surface-container-lowest w-full max-w-md h-full shadow-2xl border-l border-outline-variant/30 flex flex-col justify-between p-5 overflow-y-auto animate-fade-in">
      <div class="flex flex-col gap-4">
        <div class="flex items-center justify-between pb-3 border-b border-outline-variant/30">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary">notifications_active</span>
            <h3 class="font-headline-sm text-headline-sm font-bold text-on-surface">Centro de Avisos</h3>
          </div>
          <button onclick="toggleNotificationsDrawer()" class="p-1.5 rounded-full text-on-surface-variant hover:bg-surface-container">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <div id="notifications-content" class="flex flex-col gap-3"></div>
      </div>
      <button onclick="toggleNotificationsDrawer()" class="mt-4 w-full py-2.5 rounded-xl bg-surface-container text-on-surface font-bold text-sm hover:bg-surface-container-high transition">
        Cerrar panel
      </button>
    </div>
  </div>

  <!-- QUICK ACTION BOTTOM SHEET MODAL (Stitch Contextual Task Layer) -->
  <div id="quick-action-sheet" class="hidden fixed inset-0 z-50 bg-slate-950/45 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-surface-container-lowest w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl border border-outline-variant/30 flex flex-col gap-3.5 animate-slide-up">
      <div class="flex justify-between items-center pb-2 border-b border-outline-variant/25">
        <div>
          <h3 class="font-headline-sm text-headline-sm text-on-surface font-bold">Registrar nueva operación</h3>
          <p class="font-body-sm text-xs text-on-surface-variant">En tu cuenta personal o en el apartado de deudas</p>
        </div>
        <button onclick="closeQuickActionSheet()" class="p-1.5 rounded-full text-on-surface-variant hover:bg-surface-container">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <div class="grid grid-cols-1 gap-2.5">
        <div class="text-[10px] font-extrabold uppercase tracking-wider text-primary px-1">Control Mensual (Mi Bolsillo)</div>
        <!-- 1. Gasto personal -->
        <button onclick="closeQuickActionSheet(); openTxModal('exp')" class="flex items-center justify-between p-3.5 rounded-xl border border-outline-variant/50 bg-surface-container-low hover:bg-surface-container transition-all text-left active-scale">
          <div class="flex items-center gap-3">
            <span class="w-10 h-10 rounded-xl bg-primary-fixed text-on-primary-fixed flex items-center justify-center">
              <span class="material-symbols-outlined">receipt_long</span>
            </span>
            <div>
              <p class="font-label-lg text-label-lg text-on-surface font-bold">Gasto personal mensual</p>
              <p class="font-body-sm text-xs text-on-surface-variant">Supermercado, restaurante, factura, voz o #tag</p>
            </div>
          </div>
          <span class="material-symbols-outlined text-outline">chevron_right</span>
        </button>

        <!-- 2. Ingreso personal -->
        <button onclick="closeQuickActionSheet(); openTxModal('inc')" class="flex items-center justify-between p-3.5 rounded-xl border border-secondary/25 bg-secondary/5 hover:bg-secondary/10 transition-all text-left active-scale">
          <div class="flex items-center gap-3">
            <span class="w-10 h-10 rounded-xl bg-secondary-fixed text-on-secondary-fixed flex items-center justify-center">
              <span class="material-symbols-outlined">account_balance_wallet</span>
            </span>
            <div>
              <p class="font-label-lg text-label-lg text-on-surface font-bold">Ingreso extra o Nómina</p>
              <p class="font-body-sm text-xs text-on-surface-variant">Freelance, Bizum recibido, ventas o regalo</p>
            </div>
          </div>
          <span class="material-symbols-outlined text-outline">chevron_right</span>
        </button>

        <div class="text-[10px] font-extrabold uppercase tracking-wider text-on-surface-variant px-1 pt-1">Apartado Deudas (Me deben / Debo / Grupos)</div>
        <!-- 3. Me deben (P2P) -->
        <button onclick="closeQuickActionSheet(); openP2PDebtModal('owed')" class="flex items-center justify-between p-3.5 rounded-xl border border-secondary/25 bg-secondary/5 hover:bg-secondary/10 transition-all text-left active-scale">
          <div class="flex items-center gap-3">
            <span class="w-10 h-10 rounded-xl bg-secondary-fixed text-on-secondary-fixed flex items-center justify-center">
              <span class="material-symbols-outlined">arrow_downward</span>
            </span>
            <div>
              <p class="font-label-lg text-label-lg text-on-surface font-bold">Me deben (Cobro pendiente)</p>
              <p class="font-body-sm text-xs text-on-surface-variant">Préstamo o gasto anticipado a otra persona</p>
            </div>
          </div>
          <span class="material-symbols-outlined text-outline">chevron_right</span>
        </button>

        <!-- 4. Debo (P2P) -->
        <button onclick="closeQuickActionSheet(); openP2PDebtModal('owe')" class="flex items-center justify-between p-3.5 rounded-xl border border-tertiary/25 bg-tertiary/5 hover:bg-tertiary/10 transition-all text-left active-scale">
          <div class="flex items-center gap-3">
            <span class="w-10 h-10 rounded-xl bg-tertiary-fixed text-on-tertiary-fixed flex items-center justify-center">
              <span class="material-symbols-outlined">arrow_upward</span>
            </span>
            <div>
              <p class="font-label-lg text-label-lg text-on-surface font-bold">Debo (Pago pendiente)</p>
              <p class="font-body-sm text-xs text-on-surface-variant">Deuda que tengo que saldar con alguien</p>
            </div>
          </div>
          <span class="material-symbols-outlined text-outline">chevron_right</span>
        </button>

        <!-- 5. Cargo en Grupo Cloud (Supabase) -->
        <button onclick="closeQuickActionSheet(); openGlobalChargeModal()" class="flex items-center justify-between p-3.5 rounded-xl border border-primary/25 bg-primary/5 hover:bg-primary/10 transition-all text-left active-scale">
          <div class="flex items-center gap-3">
            <span class="w-10 h-10 rounded-xl bg-primary-container text-on-primary flex items-center justify-center">
              <span class="material-symbols-outlined">groups</span>
            </span>
            <div>
              <p class="font-label-lg text-label-lg text-on-surface font-bold">Repartir cargo en Grupo Cloud</p>
              <p class="font-body-sm text-xs text-on-surface-variant">Dividir Spotify, Fantasy o gasto común en Supabase</p>
            </div>
          </div>
          <span class="material-symbols-outlined text-outline">chevron_right</span>
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN CANVAS CONTAINER -->
  <main class="w-full max-w-5xl mx-auto px-4 pt-4 flex flex-col gap-5">

    <!-- DATE & PERIOD FILTER BAR (Shown on Monthly Control views: Mensual, Gastos, Analítica) -->
    <section id="period-filter-bar" class="flex flex-wrap items-center justify-between gap-2 bento-card px-4 py-2.5 rounded-2xl">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-primary">calendar_month</span>
        <span id="period-label" class="font-headline-sm text-[16px] leading-[22px] font-extrabold text-on-surface capitalize">Noviembre 2026</span>
        <span id="streak-pill" class="inline-flex items-center gap-1 text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-amber-500/15 text-amber-700 dark:text-amber-300" title="Racha de días sin gastar">
          🔥 0 días sin gastar
        </span>
      </div>
      <div class="flex items-center gap-1.5">
        <div class="flex items-center gap-1 bg-surface-container-low p-1 rounded-xl border border-outline-variant/30">
          <button onclick="shiftMonth(-1)" aria-label="Mes anterior" class="p-1 rounded-lg text-on-surface-variant hover:bg-surface-container hover:text-on-surface transition-colors">
            <span class="material-symbols-outlined text-[18px]">chevron_left</span>
          </button>
          <button onclick="resetToCurrentMonth()" id="btn-period-today" class="font-label-md text-xs text-primary px-2 py-0.5 rounded-md font-bold hover:bg-surface-container transition-colors">

    // ============================================================================

    const $ = (sel) => document.querySelector(sel);

    const dstr = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const todayStr = () => dstr(new Date());
    const monthKey = (ds) => String(ds || todayStr()).slice(0, 7);

    function fmt(n) {
      const val = Number(n) || 0;
      return val.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
    }
    function fmt0(n) {
      const val = Number(n) || 0;
      return Math.round(val).toLocaleString('es-ES') + ' €';
    }
    function fmtSigned(n) {
      const val = Number(n) || 0;
      return (val > 0 ? '+' : val < 0 ? '−' : '') + fmt(Math.abs(val));
    }
    function fmtDay(ds) {
      const d = new Date(ds + 'T12:00:00');
      return isNaN(d) ? ds : d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
    }
    function monthLabel(mk) {
      const p = String(mk || monthKey(todayStr())).split('-');
      return new Date(+p[0], +p[1] - 1, 1).toLocaleString('es-ES', { month: 'long', year: 'numeric' });
    }
    function parseAmount(str) {
      if (str === null || str === undefined) return 0;
      let s = String(str).toLowerCase().replace(/€|euros?/g, '').trim().replace(',', '.');
      const m = s.match(/(\d+(?:\.\d+)?)/);
      return m ? parseFloat(m[1]) : 0;
    }
    function initials(name) {
      const parts = String(name || 'U').trim().split(/\s+/);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return String(name || 'U').slice(0, 2).toUpperCase();
    }
    function currentLoggedUserName() {
      const u = sbGlobalUsers.find(x => Number(x.id) === Number(loggedUserId));
      return u ? u.nombre : (loggedUserId === 2 ? "Hugo" : "Invitado");
    }
    function allCats() {
      return CATS.concat((S && Array.isArray(S.customCats)) ? S.customCats.map(c => ({
        ...c,
        icon: ICONPICK.includes(c.icon) ? c.icon : "category"

    }

    function tagsOf(note) {

    }
    function cleanNoteText(note, fallback = "") {
      return String(note || '').replace(/#[\p{L}\d_]+/gu, '').trim() || fallback;
    }

    // ============================================================================
    // 4. PERSONAL FINANCE CALCULATIONS (Control Mensual Engine)
    // ============================================================================
    function sumExp(list) {
      return (list || []).reduce((a, e) => a + (Number(e.amount) || 0), 0);
    }
    function byCat(list) {
      const m = {};
      (list || []).forEach(e => { m[e.cat] = (m[e.cat] || 0) + (Number(e.amount) || 0); });
      return Object.entries(m).map(([cat, total]) => ({ cat, total })).sort((a, b) => b.total - a.total);
    }
    function monthExpenses(mk) {
      return (S.expenses || []).filter(e => monthKey(e.date) === mk);
    }
    function monthIncomes(mk) {
      return (S.incomes || []).filter(i => monthKey(i.date) === mk);
    }
    function salaryFor(mk) {
      if (!S.settings.salaryAuto || !(S.settings.salary > 0)) return null;
      if (S.startMk && mk < S.startMk) return null;
      return {
        id: 'salary-auto',
        amount: Number(S.settings.salary),
        cat: 'nomina',
        source: 'Nómina mensual',
        date: mk + '-' + String(Math.min(S.settings.salaryDay || 1, 28)).padStart(2, '0'),
        auto: true
      };
    }
    function incomeRows(mk) {
      const rows = monthIncomes(mk).map(i => ({ ...i, auto: false }));
      const sal = salaryFor(mk);
      if (sal && sal.amount > 0) rows.push(sal);
      return rows.sort((a, b) => b.date.localeCompare(a.date));
    }
    function monthIncomeTotal(mk) {
      return incomeRows(mk).reduce((a, i) => a + (Number(i.amount) || 0), 0);
    }
    function monthBalance(mk) {
      return monthIncomeTotal(mk) - sumExp(monthExpenses(mk));
    }
    function recPaidThisMonth(r, mk) {
      const nm = String(r.name || '').toLowerCase();
      return monthExpenses(mk).some(e => String(e.note || '').toLowerCase().includes(nm));
    }
    function upcomingRecurring(mk) {
      const isCur = mk === monthKey(todayStr());
      const today = new Date().getDate();
      return (S.recurring || []).filter(r => !recPaidThisMonth(r, mk) && (!isCur || r.day == null || r.day >= today));
    }
    function upcomingRecurringTotal(mk) {
      return upcomingRecurring(mk).reduce((a, r) => a + (Number(r.amount) || 0), 0);
    }
    function goalsReserve() {
      return (S.goals || []).reduce((a, g) => a + Math.max(0, (g.target - g.saved)) / 6, 0);
    }
    function safeToSpend(mk) {
      return monthIncomeTotal(mk) - sumExp(monthExpenses(mk)) - upcomingRecurringTotal(mk) - goalsReserve();
    }
    function currentStreak() {
      let d = new Date(), n = 0, guard = 0;
      const hasExp = ds => (S.expenses || []).some(e => e.date === ds);
      while (!hasExp(dstr(d)) && guard < 365) {
        n++;
        d = new Date(d.getTime() - 864e5);
        guard++;
      }
      return n;
    }
    function ensureCarried() {
      const cur = monthKey(todayStr());
      if (S.carriedMk === cur) return;
      const pd = new Date();
      pd.setMonth(pd.getMonth() - 1);
      const pmk = pd.getFullYear() + "-" + String(pd.getMonth() + 1).padStart(2, "0");
      const spent = {};
      monthExpenses(pmk).forEach(e => spent[e.cat] = (spent[e.cat] || 0) + e.amount);
      S.carried = {};
      Object.keys(S.rollover || {}).forEach(cat => {
        if (S.rollover[cat]) S.carried[cat] = Math.round(((S.budgets[cat] || 0) - (spent[cat] || 0)) * 100) / 100;
      });
      S.carriedMk = cur;
      saveLocalState(false);
    }
    function effBudget(cat) {
      return (S.budgets[cat] || 0) + (S.carried[cat] || 0);
    }
    function totalMonthlyBudget() {
      const sumB = Object.keys(S.budgets || {}).reduce((acc, k) => acc + Math.max(0, effBudget(k)), 0);
      return sumB > 0 ? sumB : (S.settings.salary || 0);
    }
    function applyRule(note) {
      const n = String(note || '').toLowerCase();
      const r = (S.rules || []).find(r => n.includes(String(r.match || '').toLowerCase()));
      return r ? r.cat : null;
    }
    function finScore(mk) {
      const exps = monthExpenses(mk), total = sumExp(exps), inc = monthIncomeTotal(mk);
      const sr = inc > 0 ? (inc - total) / inc : 0;
      let sc = 0;
      const tips = [];
      const sPts = sr >= 0.2 ? 40 : sr >= 0.1 ? 25 : sr >= 0 ? 12 : 0;
      sc += sPts;
      if (sPts < 40) tips.push(sr < 0 ? "Gastas más de lo que ingresas este mes." : "Sube tu ahorro al 20% para sumar hasta 40 pts.");
      const bcats = Object.keys(S.budgets || {}).filter(c => (S.budgets[c] || 0) > 0);
      let bPts = 15;
      if (bcats.length) {
        const ok = bcats.filter(c => (byCat(exps).find(d => d.cat === c) || { total: 0 }).total <= effBudget(c)).length;
        bPts = Math.round(25 * ok / bcats.length);
        if (ok < bcats.length) tips.push(`Mantén todas las categorías dentro de su límite (+${25 - bPts} pts).`);
      }
      sc += bPts;
      const st = currentStreak(), stPts = Math.min(10, st);
      sc += stPts;
      if (stPts < 10) tips.push("Encadena días sin gastar (+1 pt por día).");
      const emg = (S.goals || []).find(g => /emergencia|colch[oó]n|fondo/i.test(g.name));
      let ePts = 0;
      if (emg && emg.target > 0) {
        ePts = Math.round(15 * Math.min(1, emg.saved / emg.target));
        if (ePts < 15) tips.push("Sigue aportando a tu fondo de emergencia (+15 pts).");
      } else {
        tips.push("Crea un objetivo 'Fondo de emergencia' (+15 pts).");
      }
      sc += ePts;
      const p2p = computeP2PMetrics();
      const dPts = p2p.totalQueDebo > 0 ? 0 : 10;
      sc += dPts;
      if (!dPts) tips.push("Salda tus deudas pendientes en el apartado Deudas (+10 pts).");
      return { score: Math.min(100, Math.round(sc)), tips: tips.slice(0, 3) };
    }
    function forecast(mk) {
      const [Y, M] = mk.split("-").map(Number);
      const isCur = mk === monthKey(todayStr());
      const dim = new Date(Y, M, 0).getDate();
      const startDay = isCur ? new Date().getDate() : dim;
      const inc = monthIncomeTotal(mk), spent = sumExp(monthExpenses(mk));
      const daysElapsed = isCur ? Math.max(1, new Date().getDate()) : dim;
      const avg = spent / daysElapsed;
      const up = upcomingRecurring(mk);
      const vals = [];
      let v = inc - spent;
      for (let d = startDay; d <= dim; d++) {
        v -= avg;
        up.forEach(r => { if (r.day === d) v -= r.amount; });
        vals.push(Math.round(v * 100) / 100);
      }
      return { vals: vals.length ? vals : [inc - spent], end: vals.length ? vals[vals.length - 1] : inc - spent, avg };
    }

    // ============================================================================
    // 5. MULTI-USER DEBT ENGINE (Personalized per loggedUserId)
    // ============================================================================
    function computeP2PMetrics() {
      // 1. Personal P2P debts saved in this user's personal profile
      const activeLocal = (S.debts || []).filter(d => !d.settled && d.amount > 0);
      const localOwed = activeLocal.filter(d => d.type === 'owed');
      const localOwe = activeLocal.filter(d => d.type === 'owe');
      const localOwedSum = localOwed.reduce((a, d) => a + Number(d.amount || 0), 0);
      const localOweSum = localOwe.reduce((a, d) => a + Number(d.amount || 0), 0);

      // 2. Supabase Cloud group debts FROM THE PERSPECTIVE OF THE LOGGED-IN USER
      // - If loggedUserId is the Admin of a group (or Hugo on General/Deudas/Fantasy), members with deuda > 0 OWE THIS USER (cloudOwedItems).
      // - If loggedUserId is a member with deuda > 0 in a group, THIS USER OWES that group's admin/pot (cloudOweItems).
      const cloudOwedItems = [];
      const cloudOweItems = [];
      const activeUid = Number(loggedUserId || 0);

      sbAllGroupRelations.forEach(rel => {
        const d = parseFloat(rel.deuda || 0);
        if (d <= 0.005) return;
        const grp = sbAllGrupos.find(g => Number(g.id) === Number(rel.grupo_id));
        if (!grp) return;
        const memberUser = sbGlobalUsers.find(u => Number(u.id) === Number(rel.usuario_id));
        const memberName = memberUser ? memberUser.nombre : `Usuario #${rel.usuario_id}`;
        const groupAdminId = grp.admin_id ? Number(grp.admin_id) : 2; // General defaults to Hugo (ID 2)
        const adminUser = sbGlobalUsers.find(u => Number(u.id) === groupAdminId);
        const adminName = adminUser ? adminUser.nombre : "Hugo";
        const isFantasy = grp.nombre.toLowerCase().includes('fantasy');

        if (Number(rel.usuario_id) === activeUid) {
          // It's the logged-in user's own debt row in a group!
          cloudOweItems.push({
            relacion_id: rel.id,
            grupo_id: grp.id,
            grupo_nombre: grp.nombre,
            usuario_id: activeUid,
            usuario_nombre: memberName,
            acreedor_nombre: isFantasy ? `Bote ${grp.nombre}` : adminName,
            deuda: d
          });
        } else if (groupAdminId === activeUid || (isAdmin && activeUid === 2)) {
          // Another member owes money in a group managed by the logged-in user!
          cloudOwedItems.push({
            relacion_id: rel.id,
            grupo_id: grp.id,
            grupo_nombre: grp.nombre,
            usuario_id: rel.usuario_id,
            usuario_nombre: memberName,
            deuda: d
          });
        }
      });

      const cloudOwedSum = cloudOwedItems.reduce((a, x) => a + x.deuda, 0);
      const cloudOweSum = cloudOweItems.reduce((a, x) => a + x.deuda, 0);

      const totalMeDeben = cloudOwedSum + localOwedSum;
      const countMeDeben = cloudOwedItems.length + localOwed.length;
      const totalQueDebo = cloudOweSum + localOweSum;
      const countQueDebo = cloudOweItems.length + localOwe.length;
      const balanceNeto = totalMeDeben - totalQueDebo;

      return {
        totalMeDeben,
        countMeDeben,
        cloudOwedSum,
        cloudOwedCount: cloudOwedItems.length,
        cloudOwedItems,
        localOwedSum,
        localOwedCount: localOwed.length,
        localOwed,
        totalQueDebo,
        countQueDebo,
        cloudOweSum,
        cloudOweCount: cloudOweItems.length,
        cloudOweItems,
        localOweSum,
        localOweCount: localOwe.length,
        localOwe,
        balanceNeto
      };
    }

    // ============================================================================
    // 6. PER-USER STATE MANAGEMENT & SUPABASE CLOUD SYNC
    // ============================================================================
    function blankState(defaultSalary = 0) {
      return {
        expenses: [],
        incomes: [],
        budgets: { hogar: 450, comida: 300, ocio: 180, transporte: 150, compras: 150, susc: 50, salud: 80, otros: 80 },

    function normalizeStateObject(obj) {
      if (!obj || typeof obj !== 'object') obj = blankState(0);
      if (!Array.isArray(obj.expenses)) obj.expenses = [];
      if (!Array.isArray(obj.incomes)) obj.incomes = [];
      if (!Array.isArray(obj.goals)) obj.goals = [];
      if (!Array.isArray(obj.groups)) obj.groups = [];
      if (!Array.isArray(obj.rules)) obj.rules = [];
      if (!Array.isArray(obj.customCats)) obj.customCats = [];
      if (!Array.isArray(obj.debts)) obj.debts = [];
      if (!Array.isArray(obj.recurring)) obj.recurring = [];
      if (!Array.isArray(obj.trips)) obj.trips = [];
      if (!obj.budgets) obj.budgets = { hogar: 450, comida: 300, ocio: 180, transporte: 150, compras: 150, otros: 80 };
      if (!obj.rollover) obj.rollover = {};
      if (!obj.carried) obj.carried = {};
      if (!obj.streak || typeof obj.streak !== "object") obj.streak = { best: 0 };
      if (!obj.settings || typeof obj.settings !== "object") obj.settings = { salary: 0, salaryDay: 1, salaryAuto: false, dark: false };
      if (typeof obj.settings.salary !== "number") obj.settings.salary = 0;
      if (typeof obj.settings.salaryDay !== "number") obj.settings.salaryDay = 1;
      if (typeof obj.settings.salaryAuto !== "boolean") obj.settings.salaryAuto = obj.settings.salary > 0;
      obj.debts.forEach(d => {
        if (!Array.isArray(d.log)) d.log = [];
        if (typeof d.settled !== "boolean") d.settled = false;
      });
      obj.expenses.forEach(e => {
        if (!e.method) e.method = "tarjeta";
        if (typeof e.refund !== "boolean") e.refund = false;
      });
      return obj;
    }

    function saveLocalState(syncCloud = true) {
      if (!S) return;
      S.updatedAt = Date.now();
      const key = userStorageKey(loggedUserId);
      localStorage.setItem(key, JSON.stringify(S));
      if (Number(loggedUserId) === 2) {
        localStorage.setItem(LEGACY_LSKEY, JSON.stringify(S));
      }
      if (syncCloud && loggedUserId) {
        clearTimeout(cloudSyncTimer);
        cloudSyncTimer = setTimeout(() => {
          syncUserPersonalDataToCloud();
        }, 450);
      }
    }

    function loadLocalStateForCurrentUser() {
      const key = userStorageKey(loggedUserId);
      let loaded = null;
      try {
        loaded = JSON.parse(localStorage.getItem(key));
      } catch (e) {
        loaded = null;
      }

      // If Hugo (ID 2) doesn't have `claridad_user_2` yet, check legacy `bolsillo_v1` or seed Hugo's data
      if (!loaded && Number(loggedUserId) === 2) {
        try {
          loaded = JSON.parse(localStorage.getItem(LEGACY_LSKEY));
        } catch (e) {
          loaded = null;
        }
        if (!loaded || !loaded.seeded) {
          loaded = blankState(1800);
          S = loaded;
          seedInitialData();
        }
      }

      // For any other user (e.g. Ivan, Lucia, Ximo, new user), start with a clean personal profile
      if (!loaded) {
        loaded = blankState(0);
      }

      S = normalizeStateObject(loaded);
      localStorage.setItem(key, JSON.stringify(S));
    }

    // Cloud Sync of per-user personal state (`Control Mensual` + personal `Deudas`) in Supabase
    async function loadUserPersonalDataFromCloud(uidNum) {
      if (!supabaseClient || !uidNum) return;
      try {
        // 1. Check if `datos_personales` column exists on `usuarios`
        const userRow = sbGlobalUsers.find(u => Number(u.id) === Number(uidNum));
        if (userRow && userRow.datos_personales && typeof userRow.datos_personales === 'object' && Object.keys(userRow.datos_personales).length > 0) {
          hasDatosPersonalesColumn = true;
          const cloudState = userRow.datos_personales;
          if (!S || (cloudState.updatedAt || 0) >= (S.updatedAt || 0) || (S.expenses.length === 0 && (cloudState.expenses || []).length > 0)) {
            S = normalizeStateObject(cloudState);
            localStorage.setItem(userStorageKey(uidNum), JSON.stringify(S));
          }
          return;
        }

        // 2. Fallback / Zero-Config table storage in `movimientos` (tipo = 'sync_bolsillo', grupo_id = null)
        const { data: syncRows, error } = await supabaseClient
          .from('movimientos')
          .select('id, concepto, created_at')
          .eq('usuario_id', uidNum)
          .eq('tipo', 'sync_bolsillo')
          .is('grupo_id', null)
          .order('id', { ascending: false })
          .limit(1);

        if (!error && syncRows && syncRows.length > 0) {
          const parsed = JSON.parse(syncRows[0].concepto || '{}');
          if (parsed && typeof parsed === 'object') {
            const localEmpty = (S.expenses || []).length === 0 && (S.debts || []).length === 0 && (S.incomes || []).length === 0;
            if (localEmpty || (parsed.updatedAt || 0) >= (S.updatedAt || 0)) {
              S = normalizeStateObject(parsed);
              localStorage.setItem(userStorageKey(uidNum), JSON.stringify(S));
            }
          }
        } else if ((S.expenses || []).length > 0 || (S.debts || []).length > 0) {
          // First time syncing this user's local data up to Supabase
          await syncUserPersonalDataToCloud();
        }
      } catch (e) {
        console.warn("Cloud user state load warning:", e);
      }
    }

    async function syncUserPersonalDataToCloud() {
      if (!supabaseClient || !loggedUserId || !S) return;
      try {
        const serialized = JSON.stringify(S);

        // If `datos_personales` column exists on `usuarios`, update it directly
        if (hasDatosPersonalesColumn) {
          await supabaseClient.from('usuarios').update({ datos_personales: S }).eq('id', loggedUserId);
        }

        // Also persist in `movimientos` (tipo = 'sync_bolsillo', grupo_id = null) so it works immediately even without DDL
        const { data: existing } = await supabaseClient
          .from('movimientos')
          .select('id')
          .eq('usuario_id', loggedUserId)
          .eq('tipo', 'sync_bolsillo')
          .is('grupo_id', null)
          .order('id', { ascending: false });

        if (existing && existing.length > 0) {
          await supabaseClient
            .from('movimientos')
            .update({ concepto: serialized, monto: S.settings?.salary || 0, estado: 'sync' })
            .eq('id', existing[0].id);
          // Clean up any older duplicate sync rows
          if (existing.length > 1) {
            const oldIds = existing.slice(1).map(r => r.id);
            await supabaseClient.from('movimientos').delete().in('id', oldIds);
          }
        } else {
          await supabaseClient.from('movimientos').insert([{
            usuario_id: loggedUserId,
            tipo: 'sync_bolsillo',
            monto: S.settings?.salary || 0,
            concepto: serialized,
            estado: 'sync',
            categoria: 'Sistema',
            grupo_id: null
          }]);
        }
      } catch (e) {
        console.warn("Cloud sync warning:", e);
      }
    }

    async function ingestPendingApplePayQueueFromCloud(uidNum) {
      if (!supabaseClient || !uidNum || !S) return;
      try {
        const { data: queueRows, error } = await supabaseClient
          .from('movimientos')
          .select('id, monto, concepto, categoria, created_at')
          .eq('usuario_id', uidNum)
          .eq('tipo', 'applepay_queue')
          .is('grupo_id', null)
          .order('id', { ascending: true });

        if (!error && queueRows && queueRows.length > 0) {
          let addedCount = 0;
          queueRows.forEach(row => {
            const amt = parseAmount(row.monto);
            if (!(amt > 0)) return;
            const note = String(row.concepto || 'Apple Pay').trim().slice(0, 80);
            const dt = row.created_at ? row.created_at.slice(0, 10) : todayStr();
            let cat = applyRule(note) || String(row.categoria || '').toLowerCase();
            if (!allCats().some(c => c.id === cat)) {
              cat = (typeof guessCatFromMerchant === 'function') ? guessCatFromMerchant(note) : 'otros';
            }
            S.expenses.push({
              id: uid(),
              amount: Math.round(amt * 100) / 100,
              cat,
              method: 'applepay',
              note,
              date: dt,
              tripId: '',
              refund: false,
              ts: Date.now()
            });
            addedCount++;
          });

          const qIds = queueRows.map(r => r.id);
          await supabaseClient.from('movimientos').delete().in('id', qIds);
          if (addedCount > 0) {
            saveLocalState(false);
            await syncUserPersonalDataToCloud();
            showToast(` Pay: ${addedCount} pago(s) sumado(s) automáticamente ✓`);
          }
        }
      } catch (e) {
        console.warn("Apple Pay queue ingest warning:", e);
      }
    }

    // 7. SUPABASE CLOUD SYNC & OPERATIONS

    async function cargarDatosSupabase(showToastOnSuccess = false) {
      if (!supabaseClient) return;
      const syncIcon = $('#sync-icon');
      if (syncIcon) syncIcon.classList.add('animate-spin');

      try {
        const resGrupos = await supabaseClient.from('grupos').select('*').order('id', { ascending: true });
        if (resGrupos.error) throw resGrupos.error;
        sbAllGrupos = resGrupos.data || [];
        if (sbAllGrupos.length > 0) window.generalGroupId = sbAllGrupos[0].id;

        const resUsers = await supabaseClient.from('usuarios').select('*').order('id', { ascending: true });
        if (resUsers.error) throw resUsers.error;
        sbGlobalUsers = resUsers.data || [];
        if (sbGlobalUsers.length > 0 && 'datos_personales' in sbGlobalUsers[0]) {
          hasDatosPersonalesColumn = true;
        }

        const resAllRels = await supabaseClient.from('grupo_usuarios').select('*');
        sbAllGroupRelations = resAllRels.data || [];

        // Load or sync the currently logged-in user's personal profile from Supabase
        if (loggedUserId) {
          await loadUserPersonalDataFromCloud(loggedUserId);
          await ingestPendingApplePayQueueFromCloud(loggedUserId);
        }
        if (typeof applyPendingApplePayShortcutIfAny === 'function') {
          await applyPendingApplePayShortcutIfAny();
        }

        // Filter visible groups for this user
        if (isAdmin) {
          sbGrupos = sbAllGrupos;
        } else if (loggedUserId) {
          const misGruposIds = sbAllGroupRelations.filter(r => Number(r.usuario_id) === Number(loggedUserId)).map(r => r.grupo_id);
          sbGrupos = sbAllGrupos.filter(g => Number(g.admin_id) === Number(loggedUserId) || misGruposIds.includes(g.id));
          if (sbGrupos.length === 0 && sbAllGrupos.length > 0) sbGrupos = [sbAllGrupos[0]];
        } else {
          sbGrupos = sbAllGrupos.length > 0 ? [sbAllGrupos[0]] : [];
        }

        if (sbGrupos.length > 0) {
          if (!currentGroupId || !sbGrupos.some(g => String(g.id) === String(currentGroupId))) {
            currentGroupId = sbGrupos[0].id;
          }
          localStorage.setItem('last_group_id', currentGroupId);

          const relsGrupo = sbAllGroupRelations.filter(r => String(r.grupo_id) === String(currentGroupId));
          sbUsuariosGrupo = relsGrupo.map(rel => {
            const gu = sbGlobalUsers.find(u => Number(u.id) === Number(rel.usuario_id));
            return gu ? { ...gu, relacion_id: rel.id, deuda: parseFloat(rel.deuda || 0) } : null;
          }).filter(Boolean);

          const resMovs = await supabaseClient
            .from('movimientos')
            .select('*')
            .eq('grupo_id', currentGroupId)
            .order('created_at', { ascending: false });
          if (resMovs.error) throw resMovs.error;
          sbMovimientos = (resMovs.data || []).filter(m => m.tipo !== 'sync_bolsillo');
        }

        sbConnected = true;
        updateCloudHeaderUI();
        renderAllViews();
        if (sbUsuariosGrupo.length > 0) {
          checkAutoCobroSpotify();
        }
        if (showToastOnSuccess) showToast(`Cuenta de ${currentLoggedUserName()} sincronizada ✓`);
      } catch (err) {
        console.error("Supabase sync error:", err);
        sbConnected = false;
        updateCloudHeaderUI();
        renderAllViews();
      } finally {
        if (syncIcon) syncIcon.classList.remove('animate-spin');
      }
    }

    async function checkAutoCobroSpotify() {
      const today = new Date();
      if (today.getDate() < 30 || !supabaseClient || !currentGroupId) return;
      if (Number(currentGroupId) !== 1 && Number(currentGroupId) !== Number(window.generalGroupId)) return;

      const currentMonthYear = `${today.getMonth() + 1}-${today.getFullYear()}`;
      const concept = `Spotify ${currentMonthYear}`;
      const { data } = await supabaseClient.from('movimientos').select('id').eq('concepto', concept).eq('grupo_id', currentGroupId).limit(1);
      if (data && data.length === 0) {
        const totalSpotify = 21.00;
        const rels = sbAllGroupRelations.filter(r => String(r.grupo_id) === String(currentGroupId));
        if (rels.length === 0) return;
        const porCabeza = totalSpotify / rels.length;
        const nuevos = [];
        for (const rel of rels) {
          const nuevaDeuda = parseFloat(rel.deuda || 0) + porCabeza;
          await supabaseClient.from('grupo_usuarios').update({ deuda: nuevaDeuda }).eq('id', rel.id);
          nuevos.push({
            usuario_id: rel.usuario_id,
            tipo: 'cargo',
            monto: porCabeza,
            concepto: concept,
            estado: 'completado',
            categoria: 'Suscripción',
            grupo_id: currentGroupId
          });
        }
        await supabaseClient.from('movimientos').insert(nuevos);
        await cargarDatosSupabase();
      }
    }

    function shiftMonth(delta) {
      const p = viewMk.split('-');

        saveLocalState(false);

      const sp = $('#streak-pill');
      if (sp) sp.textContent = `🔥 ${streak} día${streak === 1 ? '' : 's'} sin gastar`;

        const isCurrent = viewMk === monthKey(todayStr());
        btnToday.textContent = isCurrent ? "Actual" : "Ir a Hoy";
        btnToday.className = isCurrent

      const totalPending = pagosPendientes.reduce((acc, curr) => acc + parseFloat(curr.monto || 0), 0);

      const lastMov = sbMovimientos.find(m => Number(m.usuario_id) === Number(user.id));
      const lastConcept = lastMov ? `${lastMov.tipo === 'cargo' ? 'Cargo' : 'Pago'}: ${lastMov.concepto || 'Movimiento'}` : 'Sin cargos recientes en este grupo';
      const lastDate = lastMov && lastMov.created_at ? fmtDay(lastMov.created_at.slice(0, 10)) : 'Al día';

      const currGroup = sbGrupos.find(g => String(g.id) === String(currentGroupId));
      const canManageGroup = isAdmin || (currGroup && Number(currGroup.admin_id) === Number(loggedUserId));
      const isMe = Number(user.id) === Number(loggedUserId);

      const avatarBg = isClear
        ? "bg-secondary-fixed text-on-secondary-fixed"
        : esMayorMoroso
          ? "bg-tertiary-fixed text-on-tertiary-fixed ring-2 ring-tertiary/40"
          : "bg-primary-fixed text-on-primary-fixed";

      return `

    // Helper: Render a Personal P2P Debt Card ("Me deben" / "Debo") in Stitch Style
    function renderPersonalDebtCard(d) {
      const isOwed = d.type === 'owed';
      const isOverdue = d.due && d.due < todayStr();
      const paidSoFar = (d.log || []).filter(l => l.k === 'pay').reduce((a, l) => a + Number(l.a || 0), 0);
      const isPartial = paidSoFar > 0 && d.amount > 0;
      const lastDate = (d.log && d.log.length > 0) ? fmtDay(d.log[d.log.length - 1].d) : fmtDay(todayStr());

      let badgeHtml = `<span class="inline-block text-[11px] font-bold px-2 py-0.5 rounded-full bg-surface-container text-on-surface-variant">Pendiente</span>`;
      if (isOverdue) {
        badgeHtml = `<span class="inline-block text-[11px] font-bold px-2 py-0.5 rounded-full bg-error-container text-on-error-container">Vencido</span>`;
      } else if (isPartial) {
        badgeHtml = `<span class="inline-block text-[11px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800">Pago parcial (abonó ${fmt0(paidSoFar)})</span>`;
      }

      const avatarStyle = isOwed
        ? (isOverdue ? "bg-tertiary-fixed text-on-tertiary-fixed" : "bg-secondary-fixed text-on-secondary-fixed")
        : "bg-tertiary-fixed text-on-tertiary-fixed";

      return `
        <div class="bento-card p-3.5 rounded-2xl flex flex-col gap-3">
          <div class="flex items-start justify-between gap-2">
            <div onclick="openP2PDebtHistoryModal('${d.id}')" class="flex items-center gap-3 cursor-pointer min-w-0">
              <div class="w-10 h-10 rounded-full ${avatarStyle} flex items-center justify-center font-extrabold text-sm flex-shrink-0">
                ${initials(d.person)}
              </div>
              <div class="min-w-0">
                <div class="flex items-center gap-1.5">
                  <h4 class="font-label-lg text-sm font-bold text-on-surface truncate">${esc(d.person)}</h4>
                  <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-surface-container text-on-surface-variant">Directo P2P</span>
                </div>
                <p class="font-body-sm text-xs text-on-surface-variant truncate">${esc(d.note || (isOwed ? 'Préstamo personal' : 'Deuda pendiente'))}</p>
                <span class="font-body-sm text-[11px] ${isOverdue ? 'text-error font-semibold' : 'text-outline'}">
                  ${lastDate}${d.due ? ` • Vence ${fmtDay(d.due)}` : ''}
                </span>
              </div>
            </div>
            <div class="text-right flex-shrink-0">
              <span class="font-headline-sm text-[17px] font-extrabold tabular-nums ${isOwed ? 'text-secondary' : 'text-tertiary'}">
                ${isOwed ? '+' : '−'}${fmt(d.amount)}
              </span>
              <div class="mt-1">${badgeHtml}</div>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-2 pt-2 border-t border-outline-variant/20">
            <button onclick="openP2PPartialModal('${d.id}')" class="flex items-center justify-center gap-1 py-1.5 px-2 rounded-xl bg-surface-container-low text-on-surface font-label-md text-xs font-semibold hover:bg-surface-container transition active-scale">
              <span class="material-symbols-outlined text-[15px]">edit_note</span>
              Registrar abono
            </button>
            ${isOwed ? `
              <button onclick="sendIndividualWhatsAppClaim('${esc(d.person)}', ${d.amount}, '${esc(d.note || '')}')" class="flex items-center justify-center gap-1 py-1.5 px-2 rounded-xl bg-tertiary/10 text-tertiary font-label-md text-xs font-bold hover:bg-tertiary/20 transition active-scale">
                <span class="material-symbols-outlined text-[15px]">send</span>
                Reclamar Bizum
              </button>
            ` : `
              <button onclick="openP2PDebtHistoryModal('${d.id}')" class="flex items-center justify-center gap-1 py-1.5 px-2 rounded-xl bg-surface-container-low text-on-surface-variant font-label-md text-xs font-semibold hover:bg-surface-container transition active-scale">
                <span class="material-symbols-outlined text-[15px]">history</span>
                Historial
              </button>
            `}
            <button onclick="settleFullP2PDebt('${d.id}')" class="flex items-center justify-center gap-1 py-1.5 px-2 rounded-xl ${isOwed ? 'bg-secondary/10 text-secondary hover:bg-secondary/20' : 'bg-primary/10 text-primary hover:bg-primary/20'} font-label-md text-xs font-bold transition active-scale">
              <span class="material-symbols-outlined text-[15px]">check_circle</span>
              ${isOwed ? 'Marcar cobrado' : 'Saldar deuda'}
            </button>
          </div>
        </div>

    function computeLocalGroupBalances(g) {
      const bal = {};
      (g.members || []).forEach(m => bal[m] = 0);
      (g.items || []).forEach(it => {
        const who = (it.for || []).filter(m => g.members.includes(m));
        if (!who.length) return;
        const share = it.amount / who.length;
        bal[it.payer] = (bal[it.payer] || 0) + it.amount;
        who.forEach(m => bal[m] = (bal[m] || 0) - share);
      });
      return bal;
    }

    function computeMinimumSettlementPlan(bal) {
      const cred = Object.entries(bal).filter(([_, v]) => v > 0.005).map(([n, v]) => ({ n, v })).sort((a, b) => b.v - a.v);
      const debt = Object.entries(bal).filter(([_, v]) => v < -0.005).map(([n, v]) => ({ n, v: -v })).sort((a, b) => b.v - a.v);
      const out = [];
      let i = 0, j = 0, guard = 0;
      while (i < cred.length && j < debt.length && guard < 50) {
        guard++;
        const a = Math.min(cred[i].v, debt[j].v);
        out.push({ from: debt[j].n, to: cred[i].n, amount: Math.round(a * 100) / 100 });
        cred[i].v -= a;
        debt[j].v -= a;
        if (cred[i].v < 0.005) i++;
        if (debt[j].v < 0.005) j++;
      }
      return out;
    }

    function renderGastosView() {

      const incs = incomeRows(viewMk).map(i => ({ ...i, _k: "inc" }));
      let all = [...exps, ...incs].sort((a, b) => b.date.localeCompare(a.date));

      if (movFilter.type === "exp") all = all.filter(x => x._k === "exp");
      if (movFilter.type === "inc") all = all.filter(x => x._k === "inc");
      if (movFilter.type === "refund") all = all.filter(x => x._k === "exp" && x.refund);

    function runAffordabilitySimulator() {
      const price = parseAmount($('#sim-input-price')?.value);
      const out = $('#sim-output-box');

      const safe = safeToSpend(viewMk);
      const rest = safe - price;
      out.innerHTML = rest >= 0
        ? `<div class="p-3 rounded-xl bg-secondary/10 text-secondary flex items-center gap-2">
             <span class="material-symbols-outlined text-[18px]">check_circle</span>
             <span>¡Sí puedes! Te quedarían <strong>${fmt(rest)}</strong> de margen seguro este mes.</span>
           </div>`
        : `<div class="p-3 rounded-xl bg-tertiary/10 text-tertiary flex items-center gap-2">
             <span class="material-symbols-outlined text-[18px]">warning</span>
             <span>Mejor esperar: superarías tu margen seguro por <strong>${fmt(-rest)}</strong>.</span>
           </div>`;
    }

    function renderScoreRingSVG(score) {
      const R = 34, C = 2 * Math.PI * R;
      const col = score >= 70 ? "#006c4a" : score >= 45 ? "#d97706" : "#e11d48";
      return `
        <svg width="88" height="88" viewBox="0 0 92 92">
          <circle cx="46" cy="46" r="${R}" fill="none" stroke="currentColor" class="text-surface-container-high" stroke-width="9"/>
          <circle cx="46" cy="46" r="${R}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(score / 100 * C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 46 46)"/>
          <text x="46" y="52" text-anchor="middle" font-size="21" font-weight="800" fill="currentColor" class="text-on-surface">${score}</text>
        </svg>`;
    }

    function renderDualBarsSVG(labels, vInc, vExp) {
      const max = Math.max(...vInc, ...vExp, 1), W = 320, H = 135, bw = W / labels.length, w = (bw - 14) / 2;
      let s = "";
      labels.forEach((lb, i) => {
        const h1 = Math.max(4, (vInc[i] / max) * (H - 28));
        const h2 = Math.max(4, (vExp[i] / max) * (H - 28));
        const x = i * bw + 7;
        s += `<rect x="${x.toFixed(1)}" y="${(H - 18 - h1).toFixed(1)}" width="${w.toFixed(1)}" height="${h1.toFixed(1)}" rx="3" fill="#006c4a"/>
              <rect x="${(x + w + 2).toFixed(1)}" y="${(H - 18 - h2).toFixed(1)}" width="${w.toFixed(1)}" height="${h2.toFixed(1)}" rx="3" fill="#e11d48"/>
              <text x="${(x + bw / 2 - 6).toFixed(1)}" y="${H - 3}" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor" class="text-outline">${lb}</text>`;
      });
      return `
        <svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${s}</svg>
        <div class="flex justify-between text-xs font-bold text-on-surface-variant pt-1">
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-xs bg-secondary"></span>Ingresos</span>
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-xs bg-tertiary"></span>Gastos</span>
        </div>`;
    }

    function renderSparklineSVG(values, color) {
      const W = 280, H = 70, max = Math.max(...values, 1), min = Math.min(...values, 0);
      const rng = (max - min) || 1, n = values.length;
      const pts = values.map((v, i) => `${(i / (n - 1 || 1) * W).toFixed(1)},${(H - 8 - ((v - min) / rng) * (H - 16)).toFixed(1)}`).join(" ");
      return `
        <svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="h-16">
          <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round"/>
          <polygon points="0,${H} ${pts} ${W},${H}" fill="${color}" opacity="0.14"/>
        </svg>`;
    }

    function renderRule503020Row(label, pct, target, color, isSavings = false) {
      const good = isSavings ? pct >= target : pct <= target;
      return `
        <div class="flex flex-col gap-1">
          <div class="flex justify-between text-xs font-bold">
            <span class="text-on-surface">${esc(label)}</span>
            <span class="tabular-nums">${pct.toFixed(0)}% <span class="text-outline font-normal">/ ideal ${target}%</span></span>
          </div>
          <div class="w-full bg-surface-container h-2 rounded-full overflow-hidden">
            <div class="h-full rounded-full" style="width:${Math.min(100, pct)}%;background:${color}"></div>
          </div>
          <span class="text-[11px] font-semibold ${good ? 'text-secondary' : 'text-amber-600'}">
            ${good ? '✓ En objetivo' : isSavings ? `Te faltan ${(target - pct).toFixed(0)} pts para el 20%` : `Superas el objetivo por ${(pct - target).toFixed(0)} pts`}
          </span>
        </div>`;
    }

    function generateSmartAdvisorTipsHtml() {
      const mk = viewMk;
      const list = monthExpenses(mk), total = sumExp(list), inc = monthIncomeTotal(mk);
      const tips = [];
      const p2p = computeP2PMetrics();

      if (p2p.totalMeDeben > 0) {
        tips.push({
          type: "good",
          icon: "payments",
          text: `En el apartado <strong>Deudas</strong> te deben un total de <strong>${fmt(p2p.totalMeDeben)}</strong>. Reclamarlo por Bizum es tu liquidez más rápida.`
        });
      }

      (S.recurring || []).forEach(r => {
        const cands = list.filter(e => String(e.note || "").toLowerCase().includes(r.name.toLowerCase()) && Math.abs(e.amount - r.amount) > 0.01);
        if (cands.length) {
          tips.push({
            type: "warn",
            icon: "trending_up",
            text: `<strong>${esc(r.name)}</strong> ha cambiado de importe: tenías ${fmt(r.amount)} y este mes aparece por ${fmt(cands[0].amount)}.`
          });
        }
      });

      Object.entries(S.budgets || {}).forEach(([c, b]) => {
        const spent = sumExp(list.filter(e => e.cat === c));
        const eb = effBudget(c);
        if (b > 0 && spent > eb) {
          tips.push({
            type: "warn",
            icon: "warning",
            text: `Has superado el presupuesto de <strong>${esc(catById(c).name)}</strong> (${fmt0(spent)} de ${fmt0(eb)}).`
          });
        }
      });

      const refunds = (S.expenses || []).filter(e => e.refund);
      if (refunds.length > 0) {
        tips.push({
          type: "info",
          icon: "assignment_return",
          text: `Tienes <strong>${fmt(sumExp(refunds))}</strong> en ${refunds.length} compra(s) pendiente(s) de devolución.`
        });
      }

      const recTotal = (S.recurring || []).reduce((a, r) => a + Number(r.amount || 0), 0);
      if (recTotal > 0) {
        tips.push({
          type: "info",
          icon: "autorenew",
          text: `Tus suscripciones fijas suman <strong>${fmt(recTotal)}/mes</strong> (${fmt0(recTotal * 12)} al año).`
        });
      }

      if (inc > 0 && (inc - total) / inc >= 0.2) {
        tips.push({
          type: "good",
          icon: "verified",
          text: `Tu tasa de ahorro este mes es del <strong>${Math.round(((inc - total) / inc) * 100)}%</strong> (${fmt(inc - total)} ahorrados).`
        });
      }

      if (tips.length === 0) {
        tips.push({
          type: "good",
          icon: "check_circle",
          text: `Todo tu control mensual está en orden y sin alertas.`
        });
      }

      return tips.map(t => `
        <div class="p-3 rounded-xl border flex items-start gap-2.5 text-xs ${t.type === 'warn' ? 'bg-amber-500/10 border-amber-500/25 text-on-surface' : t.type === 'good' ? 'bg-secondary/10 border-secondary/25 text-on-surface' : 'bg-surface-container-low border-outline-variant/40 text-on-surface'}">
          <span class="material-symbols-outlined text-[18px] ${t.type === 'warn' ? 'text-amber-600' : t.type === 'good' ? 'text-secondary' : 'text-primary'}">${t.icon}</span>
          <div class="leading-relaxed">${t.text}</div>
        </div>
      `).join('');
    }

    function openUniversalModal(html) {

      box.innerHTML = html;
      modal.classList.remove('hidden');
    }

    function closeUniversalModal() {
      const modal = $('#universal-modal');
      if (modal) modal.classList.add('hidden');
      stopVoiceRecognition();
    }

    function openQuickActionSheet() {
      $('#quick-action-sheet')?.classList.remove('hidden');

    function closeQuickActionSheet() {
      $('#quick-action-sheet')?.classList.add('hidden');

    function showToast(msg) {
      let t = $('#claridad-toast');
      if (!t) {
        t = document.createElement('div');
        t.id = 'claridad-toast';
        t.className = 'fixed left-1/2 -translate-x-1/2 bottom-20 z-50 bg-inverse-surface text-inverse-on-surface px-4 py-2.5 rounded-2xl font-label-md text-xs font-bold shadow-2xl border border-white/10 transition-all duration-200 opacity-0 pointer-events-none';
        document.body.appendChild(t);
      }
      t.textContent = msg;
      t.classList.remove('opacity-0');
      t.classList.add('opacity-100');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => {
        t.classList.remove('opacity-100');
        t.classList.add('opacity-0');
      }, 2800);
    }

    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.toggle('dark');
      html.classList.toggle('light', !isDark);
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      if (S && S.settings) {
        S.settings.dark = isDark;
        saveLocalState();
      }
      const ic = $('#theme-icon');
      if (ic) ic.textContent = isDark ? 'light_mode' : 'dark_mode';
    }

    function initTheme() {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = saved ? saved === 'dark' : (S?.settings?.dark || prefersDark);
      const html = document.documentElement;
      html.classList.toggle('dark', isDark);
      html.classList.toggle('light', !isDark);
      const ic = $('#theme-icon');
      if (ic) ic.textContent = isDark ? 'light_mode' : 'dark_mode';
    }

      const pin = ($('#modal-login-pin')?.value || '').trim();
      if (!userId) return;

      const user = sbGlobalUsers.find(u => String(u.id) === String(userId));
      if (!user) return;
      const isHugo = user.nombre.toLowerCase().trim() === 'hugo';
      const userPass = (user.password || '0000').trim();
      const valid = (pin === userPass) || (isHugo && (pin === 'hugo123' || pin === '0000' || pin === ''));

      if (!valid) {
        alert(`PIN incorrecto para ${user.nombre}. (Por defecto los miembros tienen 0000)`);
        return;
      }

      await switchToUserSession(Number(user.id), isHugo);
      closeUniversalModal();
    }

      isAdmin = !!adminFlag;
      localStorage.setItem('logged_user_id', String(loggedUserId));

    async function registerNewSupabaseAccount() {
      const name = ($('#modal-reg-name')?.value || '').trim();
      const pin = ($('#modal-reg-pin')?.value || '').trim() || '0000';
      const salary = parseAmount($('#modal-reg-salary')?.value);
      const joinGen = !!$('#modal-reg-join-general')?.checked;

      if (!name) {
        alert("Escribe tu nombre para crear la cuenta.");
        return;
      }
      if (!supabaseClient) return;

      // Check if name already exists
      const existing = sbGlobalUsers.find(u => u.nombre.toLowerCase() === name.toLowerCase());
      if (existing) {
        alert(`El usuario «${existing.nombre}» ya existe. Selecciona la pestaña «Entrar con mi usuario».`);
        switchAuthModalTab('login');
        return;
      }

      closeUniversalModal();
      const { data: created, error } = await supabaseClient
        .from('usuarios')
        .insert([{ nombre: name, deuda: 0, password: pin }])
        .select();

      if (error || !created || created.length === 0) {
        alert("Error creando usuario en Supabase: " + (error?.message || "Desconocido"));
        return;
      }

      const newUser = created[0];
      const genGroupId = window.generalGroupId || 1;
      if (joinGen && genGroupId) {
        await supabaseClient.from('grupo_usuarios').insert([{
          grupo_id: genGroupId,
          usuario_id: newUser.id,
          deuda: 0
        }]);
      }

      // Initialize personal profile for this new user
      loggedUserId = Number(newUser.id);
      isAdmin = name.toLowerCase() === 'hugo';
      localStorage.setItem('logged_user_id', String(loggedUserId));
      localStorage.setItem('is_admin', isAdmin ? 'true' : 'false');

      S = blankState(salary);
      saveLocalState(true);
      showToast(`¡Cuenta de ${name} creada en Supabase! 🎉`);
      await cargarDatosSupabase(false);
    }

    async function submitGlobalCloudCharge() {
      const total = parseAmount($('#global-split-amount')?.value);
      const concept = ($('#global-split-concept')?.value || '').trim() || 'Cargo Compartido';
      const categoria = $('#global-split-cat')?.value || 'General';
      const checkedIds = [...$$('[data-split-member]:checked')].map(el => Number(el.dataset.splitMember));

      if (!(total > 0) || checkedIds.length === 0 || !supabaseClient) return;
      closeUniversalModal();

      const porCabeza = Math.round((total / checkedIds.length) * 100) / 100;
      const nuevosMovs = [];

      for (const uidNum of checkedIds) {
        const u = sbUsuariosGrupo.find(x => Number(x.id) === uidNum);
        if (!u) continue;
        const nuevaDeuda = parseFloat(u.deuda || 0) + porCabeza;
        if (u.relacion_id) {
          await supabaseClient.from('grupo_usuarios').update({ deuda: nuevaDeuda }).eq('id', u.relacion_id);
        } else {
          await supabaseClient.from('usuarios').update({ deuda: nuevaDeuda }).eq('id', u.id);
        }
        nuevosMovs.push({
          usuario_id: u.id,
          tipo: 'cargo',
          monto: porCabeza,
          concepto: concept,
          estado: 'completado',
          categoria: categoria,
          grupo_id: currentGroupId
        });
      }

      await supabaseClient.from('movimientos').insert(nuevosMovs);
      showToast(`Cargo repartido (${fmt(porCabeza)} c/u) ✓`);
      await cargarDatosSupabase();
    }

    async function submitCloudPayment(userId) {
      const amount = parseAmount($('#cloud-pay-amount')?.value);
      if (!(amount > 0) || !supabaseClient) return;
      closeUniversalModal();

      const currGroup = sbGrupos.find(g => String(g.id) === String(currentGroupId));
      const canApproveDirectly = isAdmin || (currGroup && Number(currGroup.admin_id) === Number(loggedUserId));
      const estado = canApproveDirectly ? 'completado' : 'pendiente';

      await supabaseClient.from('movimientos').insert([{
        usuario_id: userId,
        tipo: 'pago',
        monto: amount,
        concepto: 'Pago',
        estado: estado,
        grupo_id: currentGroupId
      }]);

      if (canApproveDirectly) {
        const rel = sbAllGroupRelations.find(r => String(r.grupo_id) === String(currentGroupId) && Number(r.usuario_id) === Number(userId));
        if (rel) {
          const nuevaDeuda = Math.max(0, parseFloat(rel.deuda || 0) - amount);
          await supabaseClient.from('grupo_usuarios').update({ deuda: nuevaDeuda }).eq('id', rel.id);
          if (nuevaDeuda === 0 && typeof confetti === 'function') {
            confetti({ particleCount: 130, spread: 70, origin: { y: 0.6 } });
          }
        }
      }
      showToast(canApproveDirectly ? "Pago confirmado ✓" : "Pago enviado a revisión ✓");
      await cargarDatosSupabase();
    }

    async function aprobarPagoSupabase(movId, userId, monto) {
      if (!supabaseClient) return;
      await supabaseClient.from('movimientos').update({ estado: 'completado' }).eq('id', movId);
      const u = sbUsuariosGrupo.find(x => Number(x.id) === Number(userId));
      if (u) {
        const nuevaDeuda = Math.max(0, parseFloat(u.deuda || 0) - parseFloat(monto));
        if (u.relacion_id) {
          await supabaseClient.from('grupo_usuarios').update({ deuda: nuevaDeuda }).eq('id', u.relacion_id);
        } else {
          await supabaseClient.from('usuarios').update({ deuda: nuevaDeuda }).eq('id', userId);
        }
        if (nuevaDeuda === 0 && typeof confetti === 'function') {

    async function undoLastCloudAction(userId, userName) {
      if (!supabaseClient) return;
      const lastMov = sbMovimientos.find(m => Number(m.usuario_id) === Number(userId));
      if (!lastMov) {
        alert(`No hay movimientos en este grupo para ${userName}.`);
        return;
      }
      if (!confirm(`¿Deshacer el último movimiento de ${userName}?\n\nSe revertirá: ${lastMov.tipo.toUpperCase()} de ${fmt(lastMov.monto)} (${lastMov.concepto || 'Sin concepto'})`)) return;

      const u = sbUsuariosGrupo.find(x => Number(x.id) === Number(userId));
      if (u) {
        let nuevaDeuda = parseFloat(u.deuda || 0);
        if (lastMov.tipo === 'cargo') nuevaDeuda = Math.max(0, nuevaDeuda - parseFloat(lastMov.monto));
        else if (lastMov.tipo === 'pago') nuevaDeuda = nuevaDeuda + parseFloat(lastMov.monto);

        if (u.relacion_id) {
          await supabaseClient.from('grupo_usuarios').update({ deuda: nuevaDeuda }).eq('id', u.relacion_id);
        } else {
          await supabaseClient.from('usuarios').update({ deuda: nuevaDeuda }).eq('id', u.id);
        }
      }
      await supabaseClient.from('movimientos').delete().eq('id', lastMov.id);
      showToast("Último movimiento revertido ✓");
      await cargarDatosSupabase();
    }

    async function resetAllCloudGroupDebts() {
      if (!supabaseClient) return;
      if (!confirm("⚠️ ¿Poner la deuda de TODOS los miembros de este grupo a 0,00 €?")) return;
      for (const u of sbUsuariosGrupo) {
        if (parseFloat(u.deuda) > 0) {
          await supabaseClient.from('movimientos').insert([{
            usuario_id: u.id,
            tipo: 'pago',
            monto: parseFloat(u.deuda),
            concepto: 'Liquidación Total (Admin)',
            estado: 'completado',
            grupo_id: currentGroupId

          if (u.relacion_id) {

          } else {
            await supabaseClient.from('usuarios').update({ deuda: 0 }).eq('id', u.id);
          }
        }
      }
      await supabaseClient.from('movimientos').update({ estado: 'completado' }).eq('tipo', 'pago').eq('estado', 'pendiente').eq('grupo_id', currentGroupId);

    function autoCategorizeOnType(noteText) {
      if (txModalState.type !== 'exp' || txModalState.editId) return;
      const ruled = applyRule(noteText);
      if (ruled) {

      if (guessed && guessed !== 'otros') selectTxCategory(guessed);

    function saveTxModal() {
      const amount = parseAmount($('#tx-amount')?.value);
      if (!(amount > 0)) {
        $('#tx-amount')?.focus();
        return;
      }
      const date = $('#tx-date')?.value || todayStr();
      const note = ($('#tx-note')?.value || '').trim();

      if (txModalState.type === "exp") {
        const payload = {
          amount: Math.round(amount * 100) / 100,
          cat: txModalState.cat,
          method: txModalState.method,
          note,
          date,
          tripId: $('#tx-trip')?.value || "",
          refund: !!$('#tx-refund')?.checked,
          ts: Date.now()
        };
        if (txModalState.editId) {
          const target = S.expenses.find(e => e.id === txModalState.editId);
          if (target) Object.assign(target, payload);
        } else {
          S.expenses.push({ id: uid(), ...payload });
        }
      } else {
        const source = ($('#tx-source')?.value || '').trim() || incById(txModalState.incCat).name;
        const payload = {
          amount: Math.round(amount * 100) / 100,
          cat: txModalState.incCat,
          source,
          note,
          date
        };
        if (txModalState.editId) {
          const target = S.incomes.find(i => i.id === txModalState.editId);
          if (target) Object.assign(target, payload);
        } else {
          S.incomes.push({ id: uid(), ...payload });
        }

      saveLocalState();
      closeUniversalModal();
      viewMk = monthKey(date);
      renderAllViews();
      showToast(txModalState.type === "exp" ? "Gasto guardado ✓" : "Ingreso guardado ✓");
