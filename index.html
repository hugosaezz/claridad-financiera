    function renderSmartSplitModal() {
      const st = smartSplitState;
      if (!st) return;
      const calc = computeSmartSplitBreakdown(st);
      const modeTabs = [
        { id: 'equal',   label: 'Iguales' },
        { id: 'items',   label: 'Por ítems' },
        { id: 'exact',   label: 'Exactos' },
        { id: 'percent', label: '%' },
        { id: 'shares',  label: 'Partes' }
      ];

      let modeBodyHtml = '';
      if (st.mode === 'items') {
        modeBodyHtml = `
          <div class="flex flex-col gap-2.5">
            ${st.items.map((it, idx) => `
              <div class="p-3 rounded-2xl bg-surface-container-low border border-outline-variant/35 flex flex-col gap-2">
                <div class="flex items-center gap-2">
                  <input type="text" value="${esc(it.name)}" placeholder="Artículo ${idx + 1} (ej. Pizza)" onchange="pushSmartSplitUndo(); smartSplitState.items[${idx}].name=this.value" class="flex-1 px-2.5 py-1.5 rounded-xl bg-surface-container-lowest border border-outline-variant/40 text-xs font-bold text-on-surface"/>
                  <input type="number" step="0.01" value="${it.cents ? Money.fromCents(it.cents).toFixed(2) : ''}" placeholder="0.00" onchange="pushSmartSplitUndo(); smartSplitState.items[${idx}].cents=Money.toCents(this.value); renderSmartSplitModal()" class="w-24 px-2.5 py-1.5 rounded-xl bg-surface-container-lowest border border-outline-variant/40 text-xs font-extrabold text-right text-on-surface"/>
                  ${st.items.length > 1 ? `<button onclick="pushSmartSplitUndo(); smartSplitState.items.splice(${idx},1); renderSmartSplitModal()" class="text-outline hover:text-tertiary">${ico('delete', 'text-[16px]')}</button>` : ''}
                </div>
                <div class="flex flex-wrap items-center gap-1.5">
                  ${st.participants.map((p, pIdx) => {
                    const active = it.assigned.includes(p);
                    const col = SPLIT_AVATAR_COLORS[pIdx % SPLIT_AVATAR_COLORS.length];
                    return `
                      <button type="button" onclick="haptic('selection'); toggleSmartSplitItemPerson('${it.id}','${esc(p)}')" style="${active ? `background:${col};color:#fff;border-color:${col}` : ''}" class="px-2.5 py-1 rounded-full border text-[11px] font-bold transition ${active ? '' : 'border-outline-variant/50 text-on-surface-variant bg-surface-container-lowest'}">
                        ${esc(p)}
                      </button>`;
                  }).join('')}
                </div>
              </div>
            `).join('')}
            <button onclick="addSmartSplitItem()" class="w-full py-2 rounded-xl border border-dashed border-primary/50 text-primary text-xs font-extrabold hover:bg-primary/5 transition">+ Añadir línea del ticket</button>
            <div class="grid grid-cols-2 gap-2 pt-1">
              <div>
                <label class="text-[10px] font-bold text-on-surface-variant block mb-0.5">Propina / Impuesto (+)</label>
                <input type="number" step="0.50" value="${st.tipCents ? Money.fromCents(st.tipCents).toFixed(2) : ''}" placeholder="0.00" onchange="pushSmartSplitUndo(); smartSplitState.tipCents=Money.toCents(this.value); renderSmartSplitModal()" class="w-full px-2.5 py-1.5 rounded-xl bg-surface-container-low border border-outline-variant/40 text-xs font-bold text-on-surface"/>
              </div>
              <div>
                <label class="text-[10px] font-bold text-on-surface-variant block mb-0.5">Descuento / Cupón (−)</label>
                <input type="number" step="0.50" value="${st.discountCents ? Money.fromCents(st.discountCents).toFixed(2) : ''}" placeholder="0.00" onchange="pushSmartSplitUndo(); smartSplitState.discountCents=Money.toCents(this.value); renderSmartSplitModal()" class="w-full px-2.5 py-1.5 rounded-xl bg-surface-container-low border border-outline-variant/40 text-xs font-bold text-on-surface"/>
              </div>
            </div>
            <label class="flex items-center gap-2 text-[11px] font-bold text-on-surface-variant cursor-pointer">
              <input type="checkbox" ${st.tipProportional ? 'checked' : ''} onchange="smartSplitState.tipProportional=this.checked; renderSmartSplitModal()" class="w-4 h-4 rounded text-primary"/>
              Repartir propina y descuento proporcional al consumo
            </label>
          </div>`;
      } else if (st.mode === 'exact') {
        modeBodyHtml = `
          <div class="flex flex-col gap-2">
            ${st.participants.map(p => `
              <div class="flex items-center justify-between gap-2 p-2.5 rounded-xl bg-surface-container-low">
                <span class="text-xs font-bold text-on-surface">${esc(p)} ${p === st.payer ? '<span class="text-[10px] text-primary">(Pagó)</span>' : ''}</span>
                <input type="number" step="0.01" value="${esc(st.exactInputs[p] || '')}" placeholder="0.00" onchange="pushSmartSplitUndo(); smartSplitState.exactInputs['${esc(p)}']=this.value; renderSmartSplitModal()" class="w-28 px-2.5 py-1.5 rounded-lg bg-surface-container-lowest border border-outline-variant/40 text-right text-xs font-extrabold text-on-surface"/>
              </div>
            `).join('')}
            <div class="flex items-center justify-between text-xs pt-1">
              <span class="font-bold ${calc.valid ? 'text-secondary' : 'text-tertiary'}">${esc(calc.message)}</span>
              ${!calc.valid ? `<button onclick="autoSquareExactSplit()" class="px-2.5 py-1 rounded-lg bg-primary/12 text-primary font-extrabold text-[11px]">Auto-cuadrar</button>` : ''}
            </div>
          </div>`;
      } else if (st.mode === 'percent') {
        modeBodyHtml = `
          <div class="flex flex-col gap-2">
            ${st.participants.map(p => `
              <div class="flex items-center justify-between gap-2 p-2.5 rounded-xl bg-surface-container-low">
                <span class="text-xs font-bold text-on-surface">${esc(p)}</span>
                <div class="flex items-center gap-1.5">
                  <input type="number" step="1" min="0" max="100" value="${Number(st.percentInputs[p] || 0)}" onchange="pushSmartSplitUndo(); smartSplitState.percentInputs['${esc(p)}']=Number(this.value); renderSmartSplitModal()" class="w-20 px-2.5 py-1.5 rounded-lg bg-surface-container-lowest border border-outline-variant/40 text-right text-xs font-extrabold text-on-surface"/>
                  <span class="text-xs font-bold text-outline">%</span>
                </div>
              </div>
            `).join('')}
            <p class="text-xs font-bold ${calc.valid ? 'text-secondary' : 'text-tertiary'}">${esc(calc.message)}</p>
          </div>`;
      } else if (st.mode === 'shares') {
        modeBodyHtml = `
          <div class="flex flex-col gap-2">
            ${st.participants.map(p => `
              <div class="flex items-center justify-between gap-2 p-2.5 rounded-xl bg-surface-container-low">
                <span class="text-xs font-bold text-on-surface">${esc(p)}</span>
                <div class="flex items-center gap-1.5">
                  <button onclick="pushSmartSplitUndo(); smartSplitState.sharesInputs['${esc(p)}']=Math.max(0,(Number(smartSplitState.sharesInputs['${esc(p)}']||1)-0.5)); renderSmartSplitModal()" class="w-7 h-7 rounded-lg bg-surface-container font-extrabold">−</button>
                  <span class="w-10 text-center text-xs font-extrabold tabular-nums">${Number(st.sharesInputs[p] || 0)}×</span>
                  <button onclick="pushSmartSplitUndo(); smartSplitState.sharesInputs['${esc(p)}']=(Number(smartSplitState.sharesInputs['${esc(p)}']||1)+0.5); renderSmartSplitModal()" class="w-7 h-7 rounded-lg bg-surface-container font-extrabold">+</button>
                </div>
              </div>
            `).join('')}
          </div>`;
      } else {
        modeBodyHtml = `<p class="text-xs text-on-surface-variant bg-surface-container-low p-3 rounded-xl">El total se reparte en partes iguales exactas (si sobra 1 céntimo, se asigna al pagador).</p>`;
      }

      openUniversalModal(`
        <div class="flex flex-col gap-3.5">
          <div class="flex items-center justify-between border-b border-outline-variant/25 pb-2.5">
            <div>
              <h3 class="font-headline-sm text-base font-extrabold text-on-surface">Reparto inteligente de gasto</h3>
              <p class="text-[11px] text-on-surface-variant">Sin cuenta requerida · Céntimos exactos</p>
            </div>
            <div class="flex items-center gap-1">
              ${smartSplitHistory.length > 0 ? `<button onclick="undoSmartSplit()" class="p-2 rounded-full text-primary hover:bg-primary/10" title="Deshacer">${ico('undo', 'text-[17px]')}</button>` : ''}
              <button onclick="closeUniversalModal()" class="w-9 h-9 rounded-full text-on-surface-variant hover:bg-surface-container flex items-center justify-center">${ico('close', 'text-[18px]')}</button>
            </div>
          </div>

          <div class="grid grid-cols-5 bg-surface-container p-1 rounded-2xl gap-1">
            ${modeTabs.map(t => `
              <button onclick="haptic('selection'); pushSmartSplitUndo(); smartSplitState.mode='${t.id}'; renderSmartSplitModal()" class="py-1.5 rounded-xl text-[11px] font-extrabold transition ${st.mode === t.id ? 'bg-surface-container-lowest text-primary shadow-xs' : 'text-on-surface-variant'}">${t.label}</button>
            `).join('')}
          </div>

          <div class="grid grid-cols-12 gap-2">
            <input type="text" value="${esc(st.concept)}" placeholder="Concepto (ej. Cena italiana)" oninput="smartSplitState.concept=this.value" class="col-span-7 px-3 py-2 rounded-xl bg-surface-container-low border border-outline-variant/40 text-xs font-bold text-on-surface"/>
            ${st.mode !== 'items' ? `
              <input type="number" step="0.01" value="${esc(st.totalInput)}" placeholder="Total" oninput="smartSplitState.totalInput=this.value; renderSmartSplitModal()" class="col-span-5 px-3 py-2 rounded-xl bg-surface-container-low border border-outline-variant/40 text-sm font-extrabold text-right text-on-surface"/>
            ` : `
              <div class="col-span-5 px-3 py-2 rounded-xl bg-primary/10 text-primary text-sm font-extrabold text-right tabular-nums">${fmt(Money.fromCents(calc.totalCents))}</div>
            `}
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[10px] font-extrabold uppercase text-on-surface-variant block mb-1">Pagó</label>
              <select onchange="smartSplitState.payer=this.value; renderSmartSplitModal()" class="w-full px-2.5 py-2 rounded-xl bg-surface-container-low border border-outline-variant/40 text-xs font-bold text-on-surface">
                ${st.participants.map(p => `<option value="${esc(p)}" ${st.payer === p ? 'selected' : ''}>${esc(p)}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="text-[10px] font-extrabold uppercase text-on-surface-variant block mb-1">Guardar en</label>
              <select onchange="smartSplitState.groupId=this.value" class="w-full px-2.5 py-2 rounded-xl bg-surface-container-low border border-outline-variant/40 text-xs font-bold text-on-surface">
                <option value="" ${!st.groupId ? 'selected' : ''}>Deudas directas P2P</option>
                ${(S.groups || []).filter(g => !g.archived).map(g => `<option value="${g.id}" ${st.groupId === g.id ? 'selected' : ''}>Grupo: ${esc(g.name)}</option>`).join('')}
              </select>
            </div>
          </div>

          <!-- Participants Chips + Quick Add Guest -->
          <div class="flex flex-col gap-1.5">
            <div class="flex flex-wrap gap-1.5">
              ${st.participants.map((p, idx) => `
                <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-bold bg-surface-container text-on-surface">
                  <span class="w-2 h-2 rounded-full" style="background:${SPLIT_AVATAR_COLORS[idx % SPLIT_AVATAR_COLORS.length]}"></span>
                  ${esc(p)}
                  ${st.participants.length > 2 ? `<button onclick="removeSmartSplitParticipant('${esc(p)}')" class="text-outline hover:text-tertiary ml-0.5">×</button>` : ''}
                </span>
              `).join('')}
            </div>
            <div class="flex gap-1.5">
              <input id="split-new-person" type="text" placeholder="+ Añadir invitado (sin cuenta)" onkeydown="if(event.key==='Enter') addSmartSplitParticipant()" class="flex-1 px-3 py-1.5 rounded-xl bg-surface-container-low border border-outline-variant/35 text-xs font-bold text-on-surface"/>
              <button onclick="addSmartSplitParticipant()" class="px-3 py-1.5 rounded-xl bg-surface-container text-xs font-extrabold text-primary">Añadir</button>
            </div>
          </div>

          ${modeBodyHtml}

          <!-- Live Final Preview per Person -->
          <div class="p-3 rounded-2xl bg-primary/6 border border-primary/20 flex flex-col gap-1">
            <span class="text-[10px] font-extrabold uppercase text-primary">Vista previa por persona (${fmt(Money.fromCents(calc.totalCents))})</span>
            <div class="grid grid-cols-2 gap-1.5 text-xs pt-1">
              ${st.participants.map(p => `
                <div class="flex justify-between bg-surface-container-lowest/80 px-2.5 py-1 rounded-lg">
                  <span class="font-bold text-on-surface truncate">${esc(p)}</span>
                  <strong class="tabular-nums text-primary">${fmt(Money.fromCents(calc.sharesCents[p] || 0))}</strong>
                </div>
              `).join('')}
            </div>
          </div>

          <button onclick="confirmSmartSplit()" ${!calc.valid ? 'disabled' : ''} class="w-full py-3 rounded-2xl bg-primary text-on-primary font-extrabold text-sm shadow-sm active-scale disabled:opacity-45">
            Confirmar reparto ✓
          </button>
        </div>
      `);
    }

    async function confirmSmartSplit() {
      const st = smartSplitState;
      if (!st) return;
      const calc = computeSmartSplitBreakdown(st);
      if (!calc.valid) return;

      const concept = (st.concept || '').trim() || 'Gasto compartido';
      if (st.groupId) {
        const g = (S.groups || []).find(x => x.id === st.groupId);
        if (g) {
          st.participants.forEach(p => { if (!g.members.includes(p)) g.members.push(p); });
          const baseCur = g.currency || S?.settings?.currency || 'EUR';
          const baseCents = Money.convertCents(calc.totalCents, st.currency, baseCur);
          g.items.push({
            id: uid(),
            note: concept,
            amount_cents: calc.totalCents,
            amount_base_cents: baseCents,
            amount: Money.fromCents(baseCents),
            currency: st.currency,
            payer: st.payer,
            for: [...st.participants],
            sharesCents: { ...calc.sharesCents },
            splitMode: st.mode,
            date: todayStr(),
            reactions: {},
            comments: []
          });
          saveLocalState(true);
          closeUniversalModal();
          renderAllViews();
          showToast(`✓ Gasto repartido en «${g.name}»`);
          return;
        }
      }

      // Create P2P debts for everyone except payer
      let count = 0;
      const me = currentLoggedUserName() === 'Modo local' ? 'Yo' : currentLoggedUserName();
      const payerIsMe = (st.payer === me || st.payer === 'Yo');
      Object.entries(calc.sharesCents).forEach(([person, shareC]) => {
        if (person === st.payer || !(shareC > 0)) return;
        if (payerIsMe) {
          upsertPersonalDebt(person, 'owed', Money.fromCents(shareC), concept);
          count++;
        } else if (person === me || person === 'Yo') {
          upsertPersonalDebt(st.payer, 'owe', Money.fromCents(shareC), concept);
          count++;
        }
      });

      saveLocalState(true);
      closeUniversalModal();
      renderAllViews();
      showToast(`✓ Reparto confirmado (${count} deuda(s) P2P creadas)`);
    }

    // ----------------------------------------------------------------------------
    // 3C. POWERFUL GROUPS (Presets, Recurring, Multicurrency, Reactions, Simplify)
    // ----------------------------------------------------------------------------
    let groupSimplifyViewMode = true; // true = Simplified ✨ | false = All raw transfers

    function openEnhancedNewGroupModal() {
      openUniversalModal(`
        <div class="flex flex-col gap-4">
          <div class="flex items-center justify-between pb-2 border-b border-outline-variant/25">
            <div>
              <h3 class="font-headline-sm text-base font-extrabold text-on-surface">Nuevo Grupo Social</h3>
              <p class="text-[11px] text-on-surface-variant">Piso, viaje multidivisa, evento o pareja</p>
            </div>
            <button onclick="closeUniversalModal()" class="p-1 rounded-full text-on-surface-variant hover:bg-surface-container">${ico('close', 'text-[19px]')}</button>
          </div>
          <div class="grid grid-cols-5 gap-1.5">
            ${GROUP_PRESETS.map((pr, idx) => `
              <button type="button" data-gp-type="${pr.id}" onclick="$('#lg-type').value='${pr.id}'; $$('[data-gp-type]').forEach(b=>b.classList.toggle('border-primary', b.dataset.gpType==='${pr.id}'));" class="p-2 rounded-xl border text-center flex flex-col items-center gap-0.5 bg-surface-container-low ${idx === 0 ? 'border-primary' : 'border-outline-variant/35'}">
                <span class="text-lg">${pr.emoji}</span>
                <span class="text-[9px] font-extrabold text-on-surface truncate w-full">${esc(pr.label.split(' ')[0])}</span>
              </button>
            `).join('')}
          </div>
          <input type="hidden" id="lg-type" value="piso"/>
          <input id="lg-name" type="text" placeholder="Nombre del grupo (ej. Piso Madrid, Viaje Roma...)" class="w-full px-3.5 py-2.5 rounded-xl bg-surface-container-low border border-outline-variant/40 text-sm font-bold text-on-surface"/>
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="text-[11px] font-bold text-on-surface-variant block mb-1">Moneda base</label>
              <select id="lg-currency" class="w-full px-3 py-2 rounded-xl bg-surface-container-low border border-outline-variant/40 text-xs font-bold text-on-surface">
                ${CURRENCIES.map(c => `<option value="${c.code}" ${(S?.settings?.currency || 'EUR') === c.code ? 'selected' : ''}>${esc(c.code)} (${esc(c.symbol)})</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="text-[11px] font-bold text-on-surface-variant block mb-1">Participantes (comas)</label>
              <input id="lg-members" type="text" value="Yo, Carlos, Marta" class="w-full px-3 py-2 rounded-xl bg-surface-container-low border border-outline-variant/40 text-xs font-bold text-on-surface"/>
            </div>
          </div>
          <button onclick="saveEnhancedLocalGroup()" class="w-full py-3 rounded-xl bg-primary text-on-primary font-label-lg text-sm font-extrabold active-scale">Crear Grupo</button>
        </div>
      `);
    }

    function saveEnhancedLocalGroup() {
      const name = ($('#lg-name')?.value || '').trim();
      const type = $('#lg-type')?.value || 'otro';
      const currency = $('#lg-currency')?.value || (S?.settings?.currency || 'EUR');
      const members = ($('#lg-members')?.value || '').split(',').map(s => s.trim()).filter(Boolean);
      if (!name || members.length < 2) {
        showToast('Escribe un nombre y al menos 2 participantes');
        return;
      }
      S.groups.push({
        id: uid(),
        name,
        type,
        currency,
        members,
        inviteCode: generateGroupInviteCode(),
        items: [],
        recurring: [],
        settlements: [],
        archived: false,
        createdAt: Date.now()
      });
      saveLocalState(true);
      closeUniversalModal();
      renderAllViews();
      showToast(`Grupo «${name}» creado ✓`);
    }

    function reactToGroupItem(groupId, itemId, emoji) {
      const g = (S.groups || []).find(x => x.id === groupId);
      const it = g?.items?.find(x => x.id === itemId);
      if (!it) return;
      if (!it.reactions || typeof it.reactions !== 'object') it.reactions = {};
      it.reactions[emoji] = (it.reactions[emoji] || 0) + 1;
      saveLocalState(true);
      openEnhancedGroupDetailModal(groupId);
    }

    function addCommentToGroupItem(groupId, itemId) {
      const text = prompt('Escribe un comentario sobre este gasto:');
      if (!text || !text.trim()) return;
      const g = (S.groups || []).find(x => x.id === groupId);
      const it = g?.items?.find(x => x.id === itemId);
      if (!it) return;
      if (!Array.isArray(it.comments)) it.comments = [];
      it.comments.push({ id: uid(), author: currentLoggedUserName(), text: text.trim(), date: todayStr() });
      saveLocalState(true);
      openEnhancedGroupDetailModal(groupId);
    }

    function addGroupRecurringRule(groupId) {
      const g = (S.groups || []).find(x => x.id === groupId);
      if (!g) return;
      const title = prompt('Gasto fijo mensual del grupo (ej. Alquiler, Internet):');
      if (!title || !title.trim()) return;
      const amtStr = prompt('Importe mensual total:');
      const cents = Money.toCents(amtStr || 0);
      if (!(cents > 0)) return;
      if (!Array.isArray(g.recurring)) g.recurring = [];
      g.recurring.push({ id: uid(), note: title.trim(), amount_cents: cents, payer: g.members[0], day: 1 });
      saveLocalState(true);
      openEnhancedGroupDetailModal(groupId);
      showToast('Gasto recurrente de grupo guardado ✓');
    }

    function applyGroupRecurringNow(groupId, recId) {
      const g = (S.groups || []).find(x => x.id === groupId);
      const rec = g?.recurring?.find(r => r.id === recId);
      if (!rec) return;
      g.items.push({
        id: uid(),
        note: `${rec.note} (${monthLabel(monthKey(todayStr()))})`,
        amount_cents: rec.amount_cents,
        amount_base_cents: rec.amount_cents,
        amount: Money.fromCents(rec.amount_cents),
        currency: g.currency || 'EUR',
        payer: rec.payer || g.members[0],
        for: [...g.members],
        date: todayStr(),
        reactions: {},
        comments: []
      });
      saveLocalState(true);
      openEnhancedGroupDetailModal(groupId);
      showToast(`✓ «${rec.note}» añadido al grupo`);
    }

    function recordGroupSettlement(groupId, from, to, cents) {
      const g = (S.groups || []).find(x => x.id === groupId);
      if (!g) return;
      if (!Array.isArray(g.settlements)) g.settlements = [];
      g.settlements.push({ id: uid(), from, to, amount_cents: cents, amount: Money.fromCents(cents), status: 'confirmado', date: todayStr() });
      saveLocalState(true);
      openEnhancedGroupDetailModal(groupId);
      renderAllViews();
      showToast(`✓ Pago de ${from} a ${to} (${fmt(Money.fromCents(cents))}) registrado`);
    }

    function toggleArchiveLocalGroup(groupId) {
      const g = (S.groups || []).find(x => x.id === groupId);
      if (!g) return;
      if (!g.archived) {
        const plan = computeSimplifiedSettlementsCents(computeGroupBalancesCents(g));
        if (plan.length > 0 && !confirm(`Aún quedan ${plan.length} pagos pendientes en este grupo. ¿Marcar como perdonados y archivar?`)) return;
      }
      g.archived = !g.archived;
      saveLocalState(true);
      closeUniversalModal();
      renderAllViews();
      showToast(g.archived ? 'Grupo archivado (historial consultable)' : 'Grupo reactivado ✓');
    }

    function openEnhancedGroupDetailModal(groupId) {
      const g = (S.groups || []).find(x => x.id === groupId);
      if (!g) return;
      if (!g.inviteCode) { g.inviteCode = generateGroupInviteCode(); saveLocalState(false); }
      const preset = GROUP_PRESETS.find(p => p.id === g.type) || GROUP_PRESETS[4];
      const balCents = computeGroupBalancesCents(g);
      const rawPlan = computeRawGroupDebtsCents(g);
      const simpPlan = computeSimplifiedSettlementsCents(balCents);
      const shownPlan = groupSimplifyViewMode ? simpPlan : rawPlan;
      const savedTransfers = Math.max(0, rawPlan.length - simpPlan.length);

      openUniversalModal(`
        <div class="flex flex-col gap-3.5">
          <div class="flex items-center justify-between pb-2 border-b border-outline-variant/25">
            <div>
              <div class="flex items-center gap-1.5">
                <span class="text-lg">${preset.emoji}</span>
                <h3 class="font-headline-sm text-base font-extrabold text-on-surface">${esc(g.name)}</h3>

    // ============================================================================
    // 4. COMPOUND VOICE NLP PARSER & ITEM-LEVEL RECEIPT OCR ENGINE
    // ============================================================================

    const SPANISH_NUM_WORDS = {
      cero: 0, un: 1, uno: 1, una: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5,
      seis: 6, siete: 7, ocho: 8, nueve: 9, diez: 10, once: 11, doce: 12,
      trece: 13, catorce: 14, quince: 15, dieciseis: 16, 'dieciséis': 16,
      diecisiete: 17, dieciocho: 18, diecinueve: 19, veinte: 20,
      veintiuno: 21, veintiun: 21, veintidos: 22, 'veintidós': 22, veintitres: 23, 'veintitrés': 23,
      veinticuatro: 24, veinticinco: 25, veintiseis: 26, 'veintiséis': 26,
      veintisiete: 27, veintiocho: 28, veintinueve: 29,
      treinta: 30, cuarenta: 40, cincuenta: 50, sesenta: 60, setenta: 70, ochenta: 80, noventa: 90,
      cien: 100, ciento: 100, doscientos: 200, trescientos: 300, cuatrocientos: 400,
      quinientos: 500, seiscientos: 600, setecientos: 700, ochocientos: 800, novecientos: 900,
      mil: 1000
    };

    /** Convert Spanish spoken number phrases ("veinticinco con veinte", "sesenta y ocho", "dos mil cien") into numeric strings */
    function normalizeSpokenNumbersES(input) {
      let s = String(input || '');
      // Handle "X con Y" (e.g. "veinticinco con veinte" -> "25.20")
      const wordGroup = Object.keys(SPANISH_NUM_WORDS).join('|');
      const phraseRe = new RegExp(`\\b((?:${wordGroup})(?:\\s+(?:y\\s+)?(?:${wordGroup}))*)\\b`, 'gi');

      const wordsToNum = (phrase) => {
        const toks = phrase.toLowerCase().split(/\s+/).filter(w => w !== 'y');
        let total = 0, cur = 0;
        for (const t of toks) {
          const v = SPANISH_NUM_WORDS[t];
          if (v === undefined) return null;
          if (v === 1000) {
            cur = cur === 0 ? 1000 : cur * 1000;
            total += cur;
            cur = 0;
          } else {
            cur += v;
          }
        }
        return total + cur;
      };

      // Replace "WORD con WORD" first
      const decRe = new RegExp(`\\b((?:${wordGroup})(?:\\s+(?:y\\s+)?(?:${wordGroup}))*)\\s+con\\s+((?:${wordGroup})(?:\\s+(?:y\\s+)?(?:${wordGroup}))*)\\b`, 'gi');
      s = s.replace(decRe, (full, a, b) => {
        const na = wordsToNum(a), nb = wordsToNum(b);
        if (na === null || nb === null || nb >= 100) return full;
        return `${na}.${String(nb).padStart(2, '0')}`;
      });

      // Replace standalone spoken numbers (avoid replacing isolated "un"/"una" articles unless followed by currency/unit)
      s = s.replace(phraseRe, (full) => {
        const low = full.toLowerCase().trim();
        if (low === 'un' || low === 'una') return full;
        const val = wordsToNum(low);
        return val !== null ? String(val) : full;
      });

      return s;
    }

    /** Resolve relative Spanish dates ("ayer", "anteayer", "el martes", "la semana pasada", "el día 3") */
    function parseRelativeDateES(text, baseDate = new Date()) {
      const ql = String(text || '').toLowerCase();
      const dt = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate());

      if (/\banteayer\b/.test(ql)) { dt.setDate(dt.getDate() - 2); return dstr(dt); }
      if (/\bayer\b/.test(ql)) { dt.setDate(dt.getDate() - 1); return dstr(dt); }
      if (/\bsemana pasada\b/.test(ql)) { dt.setDate(dt.getDate() - 7); return dstr(dt); }

      const dayNumM = ql.match(/\bel\s+d[ií]a\s+(\d{1,2})\b/);
      if (dayNumM) {
        const dNum = Math.max(1, Math.min(28, parseInt(dayNumM[1], 10)));
        if (dNum > dt.getDate()) dt.setMonth(dt.getMonth() - 1);
        dt.setDate(dNum);
        return dstr(dt);
      }

      const dowMap = { domingo: 0, lunes: 1, martes: 2, miercoles: 3, 'miércoles': 3, jueves: 4, viernes: 5, sabado: 6, 'sábado': 6 };
      for (const [dName, targetDow] of Object.entries(dowMap)) {
        if (new RegExp(`\\bel\\s+${dName}\\b`).test(ql)) {
          let diff = (dt.getDay() - targetDow + 7) % 7;
          if (diff === 0) diff = 7;
          dt.setDate(dt.getDate() - diff);
          return dstr(dt);
        }
      }
      return dstr(dt);
    }

    function guessVoiceCategory(text) {
      const ql = String(text || '').toLowerCase();
      // Check user's learned personal synonyms first
      const syns = S?.voiceSynonyms || {};
      for (const [kw, catId] of Object.entries(syns)) {
        if (kw && ql.includes(kw.toLowerCase())) return { cat: catId, confidence: 0.96 };
      }
      const ruled = typeof applyRule === 'function' ? applyRule(ql) : null;
      if (ruled) return { cat: ruled, confidence: 0.95 };

      const patterns = [
        { cat: 'ocio',       re: /(cen[aeo]|cenamos|restaur|men[uú]|bar\b|copas?|caf[eé]|birra|cerveza|pizza|sushi|burger|cine|concierto|delivery|glovo|uber eats|tapas|desayun)/ },
        { cat: 'comida',     re: /(s[uú]per|supermercado|mercadona|carrefour|lidl|aldi|dia\b|eroski|consum|fruter|panader|carnicer|compra semanal|mercado)/ },
        { cat: 'transporte', re: /(gasofa|gasolina|di[eé]sel|repsol|cepsa|metro|bus|autob[uú]s|tren|renfe|uber|cabify|taxi|parking|peaje|aparcamiento)/ },
        { cat: 'hogar',      re: /(alquiler|luz|agua|gas\b|internet|fibra|ikea|ferreter|limpieza|detergente)/ },
        { cat: 'susc',       re: /(spotify|netflix|hbo|disney|amazon prime|icloud|chatgpt|suscripci)/ },
        { cat: 'salud',      re: /(farmacia|m[eé]dico|dentista|fisio|gimnasio|gym|deporte|p[aá]del|pastillas)/ },
        { cat: 'compras',    re: /(zara|ropa|zapatos|zapatillas|amazon|mediamarkt|fnac|decathlon|regalo|perfume)/ },
        { cat: 'viajes',     re: /(vuelo|hotel|airbnb|viaje|escapada|billete|maleta)/ }
      ];
      for (const p of patterns) {
        if (p.re.test(ql)) return { cat: p.cat, confidence: 0.9 };
      }
      const fallback = typeof guessCatFromMerchant === 'function' ? guessCatFromMerchant(ql) : 'otros';
      return { cat: fallback || 'otros', confidence: fallback && fallback !== 'otros' ? 0.8 : 0.55 };
    }

    /** Fuzzy match a mentioned person against existing debt contacts and group members */
    function resolveKnownPersonName(rawName) {
      const clean = String(rawName || '').trim().replace(/[.,;:!?]+$/, '');
      if (!clean) return '';
      const low = clean.toLowerCase();
      const known = new Set();
      (S?.debts || []).forEach(d => { if (d.person) known.add(d.person); });
      (S?.groups || []).forEach(g => (g.members || []).forEach(m => { if (m && m !== 'Yo') known.add(m); }));
      (sbGlobalUsers || []).forEach(u => { if (u.nombre) known.add(u.nombre); });

      for (const k of known) {
        if (k.toLowerCase() === low || k.toLowerCase().startsWith(low) || low.startsWith(k.toLowerCase())) {
          return k;
        }
      }
      return clean.charAt(0).toUpperCase() + clean.slice(1);
    }

    /**
     * Compound Spanish NLP Voice Parser:
     * Handles single expenses, multi-expenses ("35 de súper y 12 de gasolina"),
     * incomes ("me han pagado la nómina 2100", "Bizum de mamá 20€"),
     * and compound expense + debt ("Ayer cenamos fuera con Laura y pagué yo, fueron 68 euros, ella me debe la mitad").
     */
    function parseCompoundVoiceUtterance(rawText, baseDate = new Date()) {
      const original = String(rawText || '').trim();
      if (!original) return { original: '', date: dstr(baseDate), expenses: [], incomes: [], debts: [] };

      const norm = normalizeSpokenNumbersES(original);
      const date = parseRelativeDateES(norm, baseDate);
      const ql = norm.toLowerCase();

      const expenses = [];
      const incomes = [];
      const debts = [];

      // Helper to extract first monetary amount in cents from a clause
      const extractAmountCents = (clause) => {
        const m = String(clause).match(/(\d+(?:[.,]\d{1,2})?)\s*(?:€|euros?|pavos?|eur|usd|\$|£)?\b/i);
        if (!m) return 0;
        return Money.toCents(m[1]);
      };

      // 1. Detect INCOME intents first ("me han pagado la nómina 2100", "Bizum de mamá 20€", "ingreso de 300")
      const isIncome = /(me han pagado|he cobrado|me ingresaron|me han ingresado|n[oó]mina|bizum de\s+[a-záéíóúñ]+|me devolvieron|devoluci[oó]n de)/.test(ql)
        && !/(pagu[eé] yo|me debe|le debo|gast[eé])/.test(ql);
      if (isIncome) {
        const cents = extractAmountCents(norm);
        if (cents > 0) {
          const cat = /n[oó]mina/.test(ql) ? 'nomina' : /bizum/.test(ql) ? 'bizum' : /freelance/.test(ql) ? 'freelance' : 'extra';
          const fromM = norm.match(/(?:de|por)\s+([A-ZÁÉÍÓÚÑa-záéíóúñ]{2,20})/i);
          const src = cat === 'nomina' ? 'Nómina mensual' : (fromM ? `Bizum / Ingreso de ${resolveKnownPersonName(fromM[1])}` : original.slice(0, 40));
          incomes.push({
            id: uid(),
            amount_cents: cents,
            cat,
            source: src,
            date,
            note: original,
            confidence: 0.9
          });
          return { original, date, expenses, incomes, debts };
        }
      }

      // 2. Detect COMPOUND EXPENSE + P2P DEBT ("con Laura ... 68 euros ... me debe la mitad / a medias / entre tres")
      const hasSplitCue = /(me debe|le debo|a medias|la mitad|entre\s+(?:dos|tres|cuatro|cinco|\d+)|pagu[eé]\s+yo)/.test(ql);
      if (hasSplitCue) {
        const totalCents = extractAmountCents(norm);
        // Extract person name ("con Laura", "a Carlos", "de Marta", "Laura me debe")
        let personRaw = '';
        const pWith = norm.match(/\bcon\s+([A-ZÁÉÍÓÚÑa-záéíóúñ]{2,20})/i);
        const pBeforeOwe = norm.match(/\b([A-ZÁÉÍÓÚÑa-záéíóúñ]{2,20})\s+me\s+debe\b/i);
        const pAfterOwe = norm.match(/\ble\s+debo\s+(?:a\s+)?([A-ZÁÉÍÓÚÑa-záéíóúñ]{2,20})\b/i);
        const pronouns = new Set(['ella', 'el', 'él', 'ellos', 'ellas', 'nadie', 'alguien', 'esto', 'eso', 'mitad', 'todo']);
        if (pWith && !pronouns.has(pWith[1].toLowerCase())) personRaw = pWith[1];
        else if (pBeforeOwe && !pronouns.has(pBeforeOwe[1].toLowerCase())) personRaw = pBeforeOwe[1];
        else if (pAfterOwe && !pronouns.has(pAfterOwe[1].toLowerCase())) personRaw = pAfterOwe[1];

        const person = resolveKnownPersonName(personRaw || 'Contacto');
        const catGuess = guessVoiceCategory(norm);
        const conceptBase = /cen[aeo]|cenamos/.test(ql) ? `Cena con ${person}` :
          /comi|almuer|men[uú]/.test(ql) ? `Comida con ${person}` :
          /viaje|gasolina/.test(ql) ? `Gasto compartido con ${person}` :
          `${catById(catGuess.cat).name} con ${person}`;

        if (totalCents > 0) {
          const iPaid = /(pagu[eé]\s+yo|me debe|a medias|la mitad)/.test(ql) && !/\ble debo\b/.test(ql);
          // Determine debt share
          let debtCents = 0;
          const explicitDebtM = ql.match(/(?:me debe|le debo)\s+(\d+(?:[.,]\d{1,2})?)/);
          const betweenM = ql.match(/entre\s+(\d+)/);
          if (explicitDebtM) {
            debtCents = Money.toCents(explicitDebtM[1]);
          } else if (/(la mitad|a medias)/.test(ql)) {
            debtCents = Math.round(totalCents / 2);
          } else if (betweenM) {
            const n = Math.max(2, parseInt(betweenM[1], 10));
            debtCents = Math.floor(totalCents / n);
          } else {
            debtCents = Math.round(totalCents / 2);
          }

          if (iPaid) {
            expenses.push({
              id: uid(),
              amount_cents: totalCents,
              cat: catGuess.cat,
              date,
              note: conceptBase,
              confidence: catGuess.confidence
            });
          }

          if (debtCents > 0) {
            debts.push({
              id: uid(),
              person,
              type: iPaid ? 'owed' : 'owe',
              amount_cents: debtCents,
              note: conceptBase,
              confidence: personRaw ? 0.92 : 0.6
            });
          }
          return { original, date, expenses, incomes, debts };
        }
      }

      // 3. Detect MULTI-EXPENSE ("35 de súper y 12 de gasolina", "14€ menú y 3€ café")
      const segments = norm.split(/\s+(?:y|más|mas|,)\s+(?=\d)/i).map(s => s.trim()).filter(Boolean);
      segments.forEach(seg => {
        const cents = extractAmountCents(seg);
        if (!(cents > 0)) return;
        const catGuess = guessVoiceCategory(seg);
        const cleanConcept = seg
          .replace(/\b(ayer|hoy|anteayer|gast[eé]|fueron|pagu[eé]|de|en|el|la|un|una)\b/gi, ' ')
          .replace(/\d+(?:[.,]\d{1,2})?\s*(?:€|euros?|pavos?|eur)?/gi, ' ')
          .replace(/\s+/g, ' ').trim();
        expenses.push({
          id: uid(),
          amount_cents: cents,
          cat: catGuess.cat,
          date,
          note: cleanConcept ? (cleanConcept.charAt(0).toUpperCase() + cleanConcept.slice(1)) : catById(catGuess.cat).name,
          confidence: catGuess.confidence
        });
      });

      return { original, date, expenses, incomes, debts };
    }

    // ----------------------------------------------------------------------------

    let voicePreviewState = null;
    let compoundVoiceRec = null;

    function openCompoundVoiceModal(autoStart = false) {
      voicePreviewState = {
        transcript: '',
        parsed: null,
        handsFree: false,
        listening: false
      };
      renderCompoundVoiceModal();
      if (autoStart) {
        setTimeout(() => toggleCompoundVoiceListen(), 180);
      }
    }

    function stopCompoundVoiceListen() {
      try { if (compoundVoiceRec) compoundVoiceRec.stop(); } catch (e) {}
      compoundVoiceRec = null;
      if (voicePreviewState) voicePreviewState.listening = false;
    }

    function toggleCompoundVoiceListen() {
      if (!voicePreviewState) return;
      if (voicePreviewState.listening) {
        stopCompoundVoiceListen();
        renderCompoundVoiceModal();
        return;
      }
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        showToast('Tu navegador no soporta dictado directo; escribe la frase natural abajo');
        return;
      }
      try {
        compoundVoiceRec = new SR();
        compoundVoiceRec.lang = 'es-ES';
        compoundVoiceRec.interimResults = false;
        compoundVoiceRec.maxAlternatives = 1;
        voicePreviewState.listening = true;
        renderCompoundVoiceModal();

        compoundVoiceRec.onresult = (ev) => {
          const text = ev.results?.[0]?.[0]?.transcript || '';
          voicePreviewState.listening = false;
          if (voicePreviewState.handsFree && voicePreviewState.parsed && /^\s*(guardar|confirmar|listo)\s*$/i.test(text)) {
            confirmCompoundVoicePreview();
            return;
          }
          voicePreviewState.transcript = text;
          voicePreviewState.parsed = parseCompoundVoiceUtterance(text);
          renderCompoundVoiceModal();
        };
        compoundVoiceRec.onerror = () => {
          voicePreviewState.listening = false;
          renderCompoundVoiceModal();
        };
        compoundVoiceRec.onend = () => {
          voicePreviewState.listening = false;
          renderCompoundVoiceModal();
        };
        compoundVoiceRec.start();
      } catch (e) {
        voicePreviewState.listening = false;
        renderCompoundVoiceModal();
      }
    }

    async function confirmCompoundVoicePreview() {
      const p = voicePreviewState?.parsed;
      if (!p) return;
      stopCompoundVoiceListen();

      // Save dictation history & learn personal synonyms from corrections
      if (!Array.isArray(S.voiceHistory)) S.voiceHistory = [];
      S.voiceHistory.unshift({ id: uid(), text: voicePreviewState.transcript, date: todayStr(), ts: Date.now() });
      if (S.voiceHistory.length > 40) S.voiceHistory = S.voiceHistory.slice(0, 40);

      for (const ex of p.expenses) {
        if (!(ex.amount_cents > 0)) continue;
        if (ex._userCorrected && ex.note) {
          if (!S.voiceSynonyms || typeof S.voiceSynonyms !== 'object') S.voiceSynonyms = {};
          const firstWord = ex.note.toLowerCase().split(/\s+/)[0];
          if (firstWord && firstWord.length >= 3) S.voiceSynonyms[firstWord] = ex.cat;
        }
        const obj = enrichTransactionMoney({
          id: uid(),
          amount_cents: ex.amount_cents,
          amount: Money.fromCents(ex.amount_cents),
          cat: ex.cat,
          method: 'tarjeta',
          note: ex.note,
          date: ex.date || todayStr(),
          tripId: '',
          refund: false,
          source: 'voz',
          ts: Date.now()
        }, 'exp');
        S.expenses.push(obj);
        if (loggedUserId) await dbUpsertPersonalExpense(obj);
      }

      for (const inc of p.incomes) {
        if (!(inc.amount_cents > 0)) continue;
        const obj = enrichTransactionMoney({
          id: uid(),
          amount_cents: inc.amount_cents,
          amount: Money.fromCents(inc.amount_cents),
          cat: inc.cat || 'extra',
          source: inc.source || 'Ingreso por voz',
          note: inc.note || '',
          date: inc.date || todayStr(),
          ts: Date.now()
        }, 'inc');
        S.incomes.push(obj);
        if (loggedUserId) await dbUpsertPersonalIncome(obj);
      }

      for (const d of p.debts) {
        if (!(d.amount_cents > 0)) continue;
        upsertPersonalDebt(d.person, d.type, Money.fromCents(d.amount_cents), d.note || 'Dictado por voz');
      }

      saveLocalState(true);
      closeUniversalModal();
      renderAllViews();
      haptic('success');
      showToast(`🎤 Guardado: ${p.expenses.length} gasto(s), ${p.incomes.length} ingreso(s), ${p.debts.length} deuda(s) ✓`);
    }

    // ----------------------------------------------------------------------------
    // 4C. ITEM-LEVEL RECEIPT OCR PARSER, PER-ITEM CATEGORIZATION & RECEIPTS GALLERY
    // ----------------------------------------------------------------------------
    const RECEIPT_ITEM_CAT_RULES = [
      { cat: 'ocio',   re: /(vino|cerveza|birra|copa|gin|ron|whisky|chocolate|bomb[oó]n|helado|patatas fritas|chips|galletas|boller[ií]a|refresco|coca|fanta|postre|tarta|caf[eé]|sushi|pizza)/i, indulgence: true },
      { cat: 'hogar',  re: /(detergente|suavizante|lej[ií]a|papel higi|servilleta|estropajo|fregasuelos|lavavajillas|bolsa basura|pilas|bombilla|limpiador)/i },
      { cat: 'salud',  re: /(gel\b|champ[uú]|pasta dental|cepillo|paracetamol|ibuprofeno|farmacia|crema|desodorante|vitamina|tirita)/i },
      { cat: 'comida', re: /(leche|pan\b|huevo|pollo|ternera|cerdo|pescado|salm[oó]n|at[uú]n|lechuga|tomate|patata|cebolla|manzana|pl[aá]tano|fruta|verdura|arroz|pasta|aceite|queso|yogur|jam[oó]n|agua)/i }
    ];

    function categorizeReceiptItem(itemName, fallbackCat = 'comida') {
      const s = String(itemName || '');
      for (const r of RECEIPT_ITEM_CAT_RULES) {
        if (r.re.test(s)) return { cat: r.cat, indulgence: !!r.indulgence };
      }
      return { cat: fallbackCat, indulgence: false };
    }

    /**
     * Detailed Receipt Layout Parser:
     * Extracts merchant, date, NIF/CIF, payment card last4, tax, total, AND individual item lines
     * with quantity, line price in integer cents, and per-item category!
     */
    function parseReceiptLinesDetailed(rawText, fallbackName = '') {
      const text = String(rawText || '');
      const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);

      const knownStores = [
        'Mercadona', 'Carrefour', 'Lidl', 'Aldi', 'Dia', 'Consum', 'Eroski', 'Alcampo',
        'El Corte Inglés', 'Zara', 'Pull&Bear', 'Bershka', 'Ikea', 'Decathlon',
        'Repsol', 'Cepsa', 'BP', 'MediaMarkt', 'Fnac', 'Amazon', 'McDonald', 'Burger King', 'Starbucks', 'Tagliatella'
      ];
      let storeName = '';
      for (const brand of knownStores) {
        if (text.toLowerCase().includes(brand.toLowerCase())) { storeName = brand; break; }
      }
      if (!storeName) {
        const firstClean = lines.find(l => l.length >= 3 && !/^\d[\d\s\/\-\.:€]*$/.test(l) && !/factura|ticket|nif|cif/i.test(l));
        storeName = firstClean ? firstClean.slice(0, 36) : (fallbackName ? fallbackName.replace(/\.[^.]+$/, '') : 'Ticket escaneado');
      }

      // Date extraction
      let date = todayStr();
      const dm = text.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](20\d{2}|\d{2})/);
      if (dm) {
        let y = parseInt(dm[3], 10);
        if (y < 100) y += 2000;
        date = `${y}-${String(dm[2]).padStart(2, '0')}-${String(dm[1]).padStart(2, '0')}`;
      }

      // NIF / CIF & card last 4
      const nifM = text.match(/\b(?:NIF|CIF)[:\s]*([A-Z0-9\-]{8,12})\b/i);
      const cardM = text.match(/(?:\*{2,4}|XXXX)[\s\-]?(\d{4})\b/);

      // Total & IVA
      let totalCents = 0;
      let taxCents = 0;
      const items = [];
      const fallbackCat = guessCatFromMerchant(storeName) || 'comida';

      const ignoreLineRe = /\b(total|subtotal|importe|a pagar|efectivo|cambio|entregado|tarjeta|visa|mastercard|iva|base imponible|descuento|dto|cuota)\b/i;

      lines.forEach(line => {
        const priceM = line.match(/(-?\d{1,4}[.,]\d{2})\s*€?\s*[A-Z]?\s*$/);
        if (!priceM) return;
        const cents = Money.toCents(priceM[1]);
        const labelPart = line.slice(0, priceM.index).trim();

        if (/\b(total|a pagar|importe total)\b/i.test(line) && !/subtotal/i.test(line)) {
          if (Math.abs(cents) > totalCents) totalCents = Math.abs(cents);
          return;
        }
        if (/\biva\b/i.test(line)) {
          taxCents = Math.abs(cents);
          return;
        }
        if (ignoreLineRe.test(line) || cents <= 0) return;

        // Parse optional leading quantity ("2 x LECHE" or "2 LECHE")
        let qty = 1;
        let name = labelPart;
        const qm = labelPart.match(/^(\d+)\s*(?:x|\*)?\s+(.+)$/i);
        if (qm && parseInt(qm[1], 10) <= 50) {
          qty = parseInt(qm[1], 10);
          name = qm[2].trim();
        }
        name = name.replace(/\s+\d+[.,]\d{2}\s*$/, '').trim();
        if (name.length < 2) return;

        const catRes = categorizeReceiptItem(name, fallbackCat);
        items.push({
          id: uid(),
          name,
          qty,
          priceCents: cents,
          cat: catRes.cat,
          indulgence: catRes.indulgence,
          confidence: 0.85
        });
      });

      const itemsSumCents = items.reduce((a, it) => a + it.priceCents, 0);
      if (totalCents === 0 && itemsSumCents > 0) totalCents = itemsSumCents;
      const mismatchCents = totalCents > 0 && items.length > 0 ? Math.abs(totalCents - itemsSumCents) : 0;

      // Optional witty note when humor tone is active and an indulgence item was detected
      const topIndulgence = items.find(it => it.indulgence);
      const humorNote = (typeof getCoachTone === 'function' && getCoachTone() === 'humor' && topIndulgence)
        ? `Ese «${topIndulgence.name}» de ${fmt(Money.fromCents(topIndulgence.priceCents))} no era estrictamente necesario 😏`
        : '';

      return {
        storeName,
        date,
        nif: nifM ? nifM[1] : '',
        cardLast4: cardM ? cardM[1] : '',
        taxCents,
        totalCents,
        itemsSumCents,
        mismatchWarning: mismatchCents > 5,
        items,
        humorNote,
        defaultCat: fallbackCat
      };
    }

    /** Compress receipt image into a lightweight JPEG/WebP thumbnail dataURL for offline gallery storage */
    function compressReceiptImageToDataUrl(file, maxW = 640, quality = 0.72) {
      return new Promise((resolve) => {
        try {
          const reader = new FileReader();
          reader.onload = () => {
            const img = new Image();
            img.onload = () => {
              const scale = Math.min(1, maxW / Math.max(1, img.width));
              const w = Math.round(img.width * scale);
              const h = Math.round(img.height * scale);
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.onerror = () => resolve(reader.result);
            img.src = reader.result;
          };
          reader.onerror = () => resolve('');
          reader.readAsDataURL(file);

    async function handleEnhancedReceiptFiles(inputEl) {
      const files = Array.from(inputEl.files || []);
      if (!files.length || !receiptScanState) return;
      receiptScanState.scanning = true;
      receiptScanState.status = 'Analizando ticket y extrayendo artículos...';
      renderEnhancedReceiptScannerModal();

      let combinedText = '';
      for (const file of files) {
        const thumb = await compressReceiptImageToDataUrl(file, 720, 0.75);
        if (thumb) receiptScanState.images.push(thumb);

        // 1. Prefer native Apple Vision OCR on iPhone .IPA (instant, 0 MB download, ultra-accurate!)
        let ocrText = '';
        if (typeof window.claridadNativeOCR === 'function' && thumb) {
          try {
            ocrText = await window.claridadNativeOCR(thumb);
          } catch (e) {}
        }
        // 2. Fallback to Tesseract.js on Web
        if (!ocrText) {
          try {
            if (!window.Tesseract) {
              await new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
                s.onload = resolve;
                s.onerror = reject;
                document.head.appendChild(s);
              });
            }
            const res = await window.Tesseract.recognize(file, 'spa');
            ocrText = res?.data?.text || '';
          } catch (e) {}
        }
        if (ocrText) combinedText += '\n' + ocrText;
      }

      const parsed = parseReceiptLinesDetailed(combinedText, files[0]?.name || '');
      receiptScanState.storeName = parsed.storeName;
      receiptScanState.date = parsed.date;
      receiptScanState.totalCents = parsed.totalCents;
      receiptScanState.cat = parsed.defaultCat;
      receiptScanState.nif = parsed.nif;
      receiptScanState.cardLast4 = parsed.cardLast4;
      receiptScanState.items = parsed.items;
      receiptScanState.mismatchWarning = parsed.mismatchWarning;
      receiptScanState.humorNote = parsed.humorNote;
      receiptScanState.trackWarranty = parsed.totalCents >= 10000; // Auto-suggest warranty for >100€
      receiptScanState.scanning = false;
      receiptScanState.status = parsed.items.length > 0
        ? `✓ ${parsed.storeName}: ${parsed.items.length} artículo(s) detectados (${fmt(Money.fromCents(parsed.totalCents))})`
        : (parsed.totalCents > 0 ? `✓ Detectado ${fmt(Money.fromCents(parsed.totalCents))} en ${parsed.storeName}` : 'Foto guardada. Confirma o añade los artículos abajo.');
      renderEnhancedReceiptScannerModal();
    }

    async function saveEnhancedReceiptExpense() {
      const st = receiptScanState;
      if (!st) return;
      const totalCents = st.totalCents || st.items.reduce((a, it) => a + (it.priceCents || 0), 0);
      if (!(totalCents > 0)) {
        showToast('Introduce el importe total del ticket');
        return;
      }

      const receiptId = 'rcp_' + uid();
      const txId = uid();
      const store = (st.storeName || '').trim() || 'Ticket escaneado';
      const warrantyEnds = st.trackWarranty
        ? (parseInt(st.date.slice(0, 4), 10) + 3) + st.date.slice(4)
        : null;

      // Save archived receipt record (with compressed thumbnails & items)
      if (!Array.isArray(S.receipts)) S.receipts = [];
      S.receipts.unshift({
        id: receiptId,
        transaction_id: txId,
        store_name: store,
        date: st.date || todayStr(),
        total_cents: totalCents,
        nif: st.nif || '',
        card_last4: st.cardLast4 || '',
        items: st.items.map(it => ({ name: it.name, qty: it.qty || 1, priceCents: it.priceCents || 0, cat: it.cat || st.cat })),
        images: st.images.slice(0, 3),
        warranty_until: warrantyEnds,
        returned: false,
        created_at: Date.now()
      });

      // Compute per-category internal split summary if multiple item categories exist
      const catBreakdown = {};
      st.items.forEach(it => {
        if (it.priceCents > 0) catBreakdown[it.cat] = (catBreakdown[it.cat] || 0) + it.priceCents;
      });

      const expObj = enrichTransactionMoney({
        id: txId,
        amount_cents: totalCents,
        amount: Money.fromCents(totalCents),
        cat: st.cat || 'comida',
        method: 'tarjeta',
        note: `${store} #ticket`,
        date: st.date || todayStr(),
        receipt_id: receiptId,
        categorySplits: Object.keys(catBreakdown).length > 1 ? catBreakdown : null,
        tripId: '',
        refund: false,
        source: 'ocr',
        ts: Date.now()
      }, 'exp');

      S.expenses.push(expObj);
      saveLocalState(true);
      closeUniversalModal();
      viewMk = monthKey(expObj.date);
      renderAllViews();
      if (loggedUserId) await dbUpsertPersonalExpense(expObj);
      showToast(`📸 Ticket guardado y archivado: ${fmt(Money.fromCents(totalCents))} en ${store} ✓`);
    }

    /** Returns archived receipts whose legal warranty expires within `withinDays` days */
    function getExpiringWarranties(withinDays = 30, baseDate = new Date()) {
      const today = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate());
      return (S?.receipts || []).map(r => {
        if (!r || !r.warranty_until || r.returned) return null;
        const expDt = new Date(r.warranty_until + 'T00:00:00');
        if (isNaN(expDt)) return null;
        const daysLeft = Math.round((expDt - today) / 86400000);
        if (daysLeft >= 0 && daysLeft <= withinDays) {
          return { ...r, daysLeft };
        }
        return null;
      }).filter(Boolean).sort((a, b) => a.daysLeft - b.daysLeft);
    }

    /**
     * Clean raw bank transaction descriptions into normalized merchant name,
     * category, confidence (0..1), and structural flags (transfer / bizum / bankFee / salary).
     */
    function normalizeBankMerchant(rawText, amountCents = 0, isCredit = false) {
      const original = String(rawText || '').trim();
      const low = original.toLowerCase();

      // 1. Detect internal transfers (should NOT inflate expenses or incomes!)
      const isTransfer = /(traspaso\s+interno|transferencia\s+propia|traspaso\s+a\s+cuenta|traspaso\s+entre\s+cuentas|ahorro\s+autom[aá]tico|movimiento\s+interno)/.test(low);
      if (isTransfer) {
        return {
          merchant: 'Transferencia interna',
          cat: 'otros',
          confidence: 0.98,
          isTransfer: true,
          isBizum: false,
          bizumPerson: '',
          isBankFee: false,
          isSalary: false
        };
      }

      // 2. Detect bank fees / commissions
      const isBankFee = /(comisi[oó]n\s+(?:de\s+)?(?:mantenimiento|administraci[oó]n|tarjeta|descubierto|emisi[oó]n|cambio|transferencia)|gastos?\s+de\s+mantenimiento|intereses?\s+descubierto)/.test(low);
      if (isBankFee && !isCredit) {
        return {
          merchant: 'Comisión bancaria',
          cat: 'otros',
          confidence: 0.96,
          isTransfer: false,
          isBizum: false,
          bizumPerson: '',
          isBankFee: true,
          isSalary: false
        };
      }

      // 3. Detect Bizum (sent or received) + extract person name
      if (/\bbizum\b/.test(low)) {
        const pMatch = original.match(/bizum\s+(?:recibido\s+de|enviado\s+a|de|a|para)\s+([A-ZÁÉÍÓÚÑa-záéíóúñ]+(?:\s+[A-ZÁÉÍÓÚÑa-záéíóúñ]+)?)/i);
        const rawPerson = pMatch ? pMatch[1].trim() : '';
        const prettyPerson = rawPerson
          ? rawPerson.split(/\s+/).map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ')
          : '';
        return {
          merchant: prettyPerson ? `Bizum ${isCredit ? 'de' : 'a'} ${prettyPerson}` : 'Bizum',
          cat: isCredit ? 'bizum' : 'otros',
          confidence: isCredit ? 0.94 : 0.72, // Outgoing Bizum goes to Inbox if unsure whether it's food/debt/ocio
          isTransfer: false,
          isBizum: true,
          bizumPerson: prettyPerson,
          isBankFee: false,
          isSalary: false
        };
      }

      // 4. Detect Salary credit
      const isSalary = isCredit && (/(n[oó]mina|salario|haber\s+mensual|payroll|sueldo)/.test(low) || amountCents >= 90000);
      if (isSalary && /(n[oó]mina|salario|haber|payroll|sueldo)/.test(low)) {
        return {
          merchant: 'Nómina mensual',
          cat: 'nomina',
          confidence: 0.98,
          isTransfer: false,
          isBizum: false,
          bizumPerson: '',
          isBankFee: false,
          isSalary: true
        };
      }

      // 5. Check user's custom auto-rules first (highest priority!)
      const userRuleCat = typeof applyRule === 'function' ? applyRule(low) : null;

      // Strip common bank noise prefixes/suffixes ("COMPRA TARJ. 4821 ...", "PAYPAL *", dates, card numbers, "MADRID ES")
      let cleaned = original
        .replace(/^(?:compra\s+(?:en\s+)?(?:tarj(?:eta)?\.?|comercio)|pago\s+(?:con\s+)?(?:movil|m[oó]vil|tarjeta|apple\s*pay)|recibo\s+domiciliado|adeudo\s+sepa|paypal\s*\*|sq\s*\*|sumup\s*\*)\s*/i, '')
        .replace(/\b(?:tarj(?:eta)?\.?\s*\*?\d{4}|\*{2,4}\d{4})\b/gi, ' ')
        .replace(/\b\d{2}[\/\-]\d{2}(?:[\/\-]\d{2,4})?\b/g, ' ')
        .replace(/\b(?:s\.?a\.?|s\.?l\.?u?\.?|ltd|inc|gmbh|b\.?v\.?)\b/gi, ' ')
        .replace(/\b(?:madrid|barcelona|valencia|sevilla|bilbao|malaga|zaragoza|spain|espana|españa|es|ie|nl|lu|gb)\b\s*$/gi, ' ')
        .replace(/\b\d{6,}\b/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();

      if (!cleaned) cleaned = original.slice(0, 32) || 'Movimiento bancario';

      // 6. Match against curated Spanish/European merchant dictionary
      for (const entry of BANK_MERCHANT_DICT) {
        if (entry.re.test(original) || entry.re.test(cleaned)) {
          return {
            merchant: entry.brand,
            cat: userRuleCat || entry.cat,
            confidence: userRuleCat ? 0.97 : entry.conf,
            isTransfer: false,
            isBizum: false,
            bizumPerson: '',
            isBankFee: false,
            isSalary: false
          };
        }
      }

      // Title-case unknown merchant
      const niceName = cleaned
        .split(/\s+/)
        .slice(0, 4)
        .map(w => w.length > 2 ? (w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()) : w.toUpperCase())
        .join(' ');

      if (userRuleCat) {
        return {
          merchant: niceName,
          cat: userRuleCat,
          confidence: 0.95,
          isTransfer: false,
          isBizum: false,
          bizumPerson: '',
          isBankFee: false,
          isSalary: false
        };
      }

      // Low confidence -> routes to "Por clasificar" inbox!
      const fallbackCat = isCredit ? 'extra' : (typeof guessCatFromMerchant === 'function' ? guessCatFromMerchant(low) : 'otros');
      const fallbackConf = (fallbackCat && fallbackCat !== 'otros' && !isCredit) ? 0.78 : 0.45;
      return {
        merchant: niceName,
        cat: fallbackCat || (isCredit ? 'extra' : 'otros'),
        confidence: isCredit ? 0.86 : fallbackConf,
        isTransfer: false,
        isBizum: false,
        bizumPerson: '',
        isBankFee: false,
        isSalary: false
      };
    }

    // ----------------------------------------------------------------------------
    // 5B. BANK PROVIDER ABSTRACTION (Enable Banking Edge Function + Sandbox)
    // ----------------------------------------------------------------------------
    function getOpenBankingEndpoint() {
      return `${SUPABASE_URL}/functions/v1/open-banking`;
    }

    async function callOpenBankingEdge(payload) {
      const res = await fetch(getOpenBankingEndpoint(), {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY
        },
        body: JSON.stringify(payload)
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const err = new Error(data?.error || `HTTP ${res.status}`);
        err.code = data?.error || `HTTP_${res.status}`;
        throw err;
      }
      return data;
    }

    const EnableBankingProvider = {
      id: 'enable_banking',
      label: 'Enable Banking PSD2 (Real)',
      async checkAvailable() {
        try {
          const data = await callOpenBankingEdge({ action: 'health' });
          return !!data.configured;
        } catch (e) {
          return false;
        }
      },
      async startAuth(bankObj) {
        const redirectUrl = window.location.origin + window.location.pathname;
        const state = `claridad_bank_${bankObj.id}_${uid()}`;
        localStorage.setItem('claridad_pending_bank_auth', JSON.stringify({
          state,
          bankId: bankObj.id,
          bankName: bankObj.name,
          aspsp: bankObj.aspsp,
          startedAt: Date.now()
        }));
        const data = await callOpenBankingEdge({
          action: 'start_auth',
          aspsp_name: bankObj.aspsp,
          country: bankObj.country || 'ES',
          redirect_url: redirectUrl,
          state
        });
        if (!data?.url) throw new Error('No se recibió URL de autorización bancaria');
        window.location.href = data.url;
      },
      async completeSession(code) {
        return await callOpenBankingEdge({ action: 'complete_session', code });
      },
      async syncAccount(accountUid, dateFrom) {
        return await callOpenBankingEdge({ action: 'sync_account', account_uid: accountUid, date_from: dateFrom });
      },
      async revokeSession(sessionId) {
        return await callOpenBankingEdge({ action: 'revoke_session', session_id: sessionId });
      }
    };

    /**
     * Ingest raw bank transactions into Claridad state with:
     * - Strict deduplication (external_id + date/cents/merchant fingerprint)
     * - Internal transfer exclusion
     * - Auto-classification (>= 0.85 confidence) vs "Por clasificar" Inbox (< 0.85)
     * - Bizum P2P debt match notification
     */
    function ingestBankTransactions(conn, rawTxs) {
      if (!Array.isArray(S.expenses)) S.expenses = [];
      if (!Array.isArray(S.incomes)) S.incomes = [];
      if (!Array.isArray(S.pendingInbox)) S.pendingInbox = [];

      const existingExternalIds = new Set();
      const existingFingerprints = new Set();

      const addKey = (date, cents, text) => {
        const fp = `${date}|${cents}|${String(text || '').toLowerCase().slice(0, 14)}`;
        existingFingerprints.add(fp);
      };
      S.expenses.forEach(e => {
        if (e.external_id) existingExternalIds.add(e.external_id);
        addKey(e.date, e.amount_cents || Money.toCents(e.amount || 0), e.note);
      });
      S.incomes.forEach(i => {
        if (i.external_id) existingExternalIds.add(i.external_id);
        addKey(i.date, i.amount_cents || Money.toCents(i.amount || 0), i.source || i.note);
      });
      S.pendingInbox.forEach(p => {
        if (p.external_id) existingExternalIds.add(p.external_id);
        addKey(p.date, p.amount_cents, p.merchant);
      });

      let importedAuto = 0, sentToInbox = 0, skippedDuplicates = 0, skippedTransfers = 0;
      const bizumDebtMatches = [];

      (rawTxs || []).forEach(tx => {
        const cents = Math.abs(Math.round(tx.amount_cents || 0));
        if (!(cents > 0)) return;
        const extId = tx.external_id || `${conn.id}_${tx.date}_${cents}_${String(tx.raw || '').slice(0, 12)}`;
        const norm = normalizeBankMerchant(tx.raw, cents, !!tx.isCredit);
        const fp = `${tx.date}|${cents}|${norm.merchant.toLowerCase().slice(0, 14)}`;

        if (existingExternalIds.has(extId) || existingFingerprints.has(fp)) {
          skippedDuplicates++;
          return;
        }
        existingExternalIds.add(extId);
        existingFingerprints.add(fp);

        if (norm.isTransfer) {
          skippedTransfers++;
          return;
        }

        // Check if incoming Bizum matches an open P2P debt owed to the user!
        if (tx.isCredit && norm.isBizum && norm.bizumPerson) {
          const matchDebt = (S.debts || []).find(d =>
            !d.settled && d.type === 'owed' &&
            String(d.person || '').toLowerCase().includes(norm.bizumPerson.toLowerCase().split(' ')[0])
          );
          if (matchDebt) {
            bizumDebtMatches.push({ debtId: matchDebt.id, person: matchDebt.person, amount_cents: cents });
          }
        }

        // Route low-confidence outgoing movements to "Por clasificar" inbox
        if (!tx.isCredit && norm.confidence < 0.85) {
          S.pendingInbox.unshift({
            id: 'ibx_' + uid(),
            external_id: extId,
            bankConnectionId: conn.id,
            accountId: conn.accountId,
            date: tx.date || todayStr(),
            amount_cents: cents,
            raw: tx.raw || '',
            merchant: norm.merchant,
            suggestedCat: norm.cat,
            confidence: norm.confidence,
            isBizum: norm.isBizum,
            createdAt: Date.now()
          });
          sentToInbox++;
          return;
        }

        if (tx.isCredit) {
          const incObj = enrichTransactionMoney({
            id: uid(),
            external_id: extId,
            bankConnectionId: conn.id,
            account_id: conn.accountId,
            amount_cents: cents,
            amount: Money.fromCents(cents),
            cat: norm.cat || 'extra',
            source: norm.merchant,
            note: tx.raw || '',
            date: tx.date || todayStr(),
            source_kind: 'bank',
            ts: Date.now()
          }, 'inc');
          S.incomes.push(incObj);
          importedAuto++;
        } else {
          const expObj = enrichTransactionMoney({
            id: uid(),
            external_id: extId,
            bankConnectionId: conn.id,
            account_id: conn.accountId,
            amount_cents: cents,
            amount: Money.fromCents(cents),
            cat: norm.cat || 'otros',
            method: norm.isBizum ? 'bizum' : 'tarjeta',
            note: norm.merchant,
            rawMerchant: tx.raw || '',
            isBankFee: !!norm.isBankFee,
            date: tx.date || todayStr(),
            tripId: '',
            refund: false,
            source_kind: 'bank',
            ts: Date.now()
          }, 'exp');
          S.expenses.push(expObj);
          importedAuto++;
        }
      });

      return { importedAuto, sentToInbox, skippedDuplicates, skippedTransfers, bizumDebtMatches };
    }

    /** Convert Enable Banking API transaction payload into our canonical format */
    function mapEnableBankingTransactions(txResp) {
      const list = Array.isArray(txResp?.transactions) ? txResp.transactions : [];
      return list.map(t => {
        const amt = parseFloat(t?.transaction_amount?.amount || '0');
        const isCredit = String(t?.credit_debit_indicator || '').toUpperCase() === 'CRDT' || amt > 0 && String(t?.credit_debit_indicator || '').toUpperCase() !== 'DBIT';
        const rawParts = [
          t?.creditor?.name,
          t?.debtor?.name,
          Array.isArray(t?.remittance_information) ? t.remittance_information.join(' ') : t?.remittance_information,
          t?.note
        ].filter(Boolean);
        return {
          external_id: t?.entry_reference || t?.transaction_id || '',
          date: (t?.booking_date || t?.value_date || todayStr()).slice(0, 10),
          amount_cents: Money.toCents(Math.abs(amt)),
          isCredit,
          raw: rawParts.join(' — ') || 'Movimiento bancario'
        };
      });
    }

    function extractEnableBankingBalanceCents(balancesResp) {
      const list = Array.isArray(balancesResp?.balances) ? balancesResp.balances : [];
      const pref = list.find(b => /CLAV|ITAV|XPCD/i.test(String(b?.balance_type || ''))) || list[0];
      if (!pref?.balance_amount?.amount) return null;
      return Money.toCents(parseFloat(pref.balance_amount.amount));
    }

    /** Handle OAuth PSD2 callback when returning from bank authorization */
    async function handleBankOAuthCallback() {
      const params = new URLSearchParams(window.location.search || '');
      const code = params.get('code');
      const state = params.get('state') || '';
      if (!code || !state.startsWith('claridad_bank_')) return false;

      const pendingRaw = localStorage.getItem('claridad_pending_bank_auth');
      localStorage.removeItem('claridad_pending_bank_auth');
      const pending = pendingRaw ? JSON.parse(pendingRaw) : { bankName: 'Banco conectado', aspsp: 'Banco' };

      // Clean URL params immediately
      try {
        window.history.replaceState({}, document.title, window.location.pathname + window.location.hash);
      } catch (e) {}

      try {
        showToast(`Conectando ${pending.bankName} por PSD2...`);
        const session = await EnableBankingProvider.completeSession(code);
        const accounts = Array.isArray(session?.accounts) ? session.accounts : [];
        if (!Array.isArray(S.bankConnections)) S.bankConnections = [];
        if (!Array.isArray(S.accounts)) S.accounts = defaultAccountsList();

        let totalImported = 0;
        for (const bAcc of accounts) {
          const iban = bAcc?.account_id?.iban || bAcc?.uid || '';
          const maskedIban = iban ? `•••• ${iban.slice(-4)}` : 'Cuenta PSD2';
          const accId = 'acc_bank_' + uid();
          const connId = 'bconn_' + uid();

          S.accounts.push({
            id: accId,
            name: `${pending.bankName} (${maskedIban})`,
            type: 'banco',
            currency: bAcc?.currency || 'EUR',
            initial_cents: 0,
            color: '#4f46e5',
            icon: 'account_balance',
            syncedBalanceCents: null,
            bankConnectionId: connId,
            archived: false
          });

          const conn = {
            id: connId,
            provider: 'enable_banking',
            mode: 'live',
            bankId: pending.bankId || 'custom',
            bankName: pending.bankName || 'Banco PSD2',
            accountId: accId,
            accountUid: bAcc.uid,
            sessionId: session.session_id || '',
            ibanMasked: maskedIban,
            connectedAt: Date.now(),
            expiresAt: Date.now() + (90 * 86400 * 1000),
            lastSyncedAt: null,
            status: 'active'
          };
          S.bankConnections.push(conn);

          const syncRes = await syncBankConnection(connId, true);
          totalImported += (syncRes?.importedAuto || 0) + (syncRes?.sentToInbox || 0);
        }

        saveLocalState(true);
        renderAllViews();
        showToast(`🏦 ${pending.bankName} conectado ✓ (${totalImported} movimientos importados)`);
        return true;
      } catch (err) {
        console.error('Bank OAuth callback error:', err);
        showToast(`Error al completar conexión bancaria: ${err.message}`);
        return false;
      }
    }

    async function syncBankConnection(connId, silent = false) {
      const conn = (S.bankConnections || []).find(c => c.id === connId);
      if (!conn) return null;
      const acc = (S.accounts || []).find(a => a.id === conn.accountId);

      try {
        let rawTxs = [];
        let balanceCents = null;

        if (conn.mode === 'sandbox') {
          rawTxs = generateSandboxBankTransactions(conn.bankName);
          balanceCents = 248650; // 2.486,50 € realistic demo balance
        } else {
          const dateFrom = new Date(Date.now() - 45 * 86400 * 1000).toISOString().slice(0, 10);
          const data = await EnableBankingProvider.syncAccount(conn.accountUid, dateFrom);
          rawTxs = mapEnableBankingTransactions(data.transactions);
          balanceCents = extractEnableBankingBalanceCents(data.balances);
        }

        const res = ingestBankTransactions(conn, rawTxs);
        conn.lastSyncedAt = Date.now();
        conn.status = 'active';
        if (acc && typeof balanceCents === 'number') {
          acc.syncedBalanceCents = balanceCents;
          acc.lastSyncedAt = Date.now();
        }
        if (typeof logAuditEvent === 'function') {
          logAuditEvent('bank_sync', `${conn.bankName}: +${res.importedAuto} auto, +${res.sentToInbox} por clasificar`);
        }
        saveLocalState(true);
        renderAllViews();

        if (!silent) {
          const msg = res.importedAuto + res.sentToInbox > 0
            ? `🏦 ${conn.bankName}: ${res.importedAuto} importados${res.sentToInbox ? `, ${res.sentToInbox} por clasificar` : ''} ✓`
            : `🏦 ${conn.bankName} al día (sin movimientos nuevos)`;
          showToast(msg);
        }
        return res;
      } catch (err) {
        conn.status = 'error';
        saveLocalState(false);
        if (!silent) showToast(`Error sincronizando ${conn.bankName}: ${err.message}`);
        return null;
      }
    }

      let totalNew = 0;
      for (const c of conns) {

        if (r) totalNew += r.importedAuto + r.sentToInbox;

      showToast(totalNew > 0 ? `🏦 Bancos sincronizados: ${totalNew} mov. nuevos ✓` : '🏦 Todos tus bancos están al día ✓');

    async function disconnectBankConnection(connId, keepHistory = true) {
      const conn = (S.bankConnections || []).find(c => c.id === connId);
      if (!conn) return;
      if (conn.mode === 'live' && conn.sessionId) {
        try { await EnableBankingProvider.revokeSession(conn.sessionId); } catch (e) {}

      S.bankConnections = (S.bankConnections || []).filter(c => c.id !== connId);
      if (!keepHistory) {
        S.expenses = (S.expenses || []).filter(e => e.bankConnectionId !== connId);
        S.incomes = (S.incomes || []).filter(i => i.bankConnectionId !== connId);
        S.pendingInbox = (S.pendingInbox || []).filter(p => p.bankConnectionId !== connId);
      }
      const acc = (S.accounts || []).find(a => a.id === conn.accountId);
      if (acc) {
        acc.bankConnectionId = null;
        acc.syncedBalanceCents = null;
      }
      if (typeof logAuditEvent === 'function') logAuditEvent('bank_disconnect', conn.bankName);
      saveLocalState(true);

        cat: catId || it.suggestedCat || 'otros',

        tripId: '',
