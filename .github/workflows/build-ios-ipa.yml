name: Build iOS IPA & Publish Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'ClaridadFinanciera.ipa'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Native iOS ARM64 App & Package .IPA
        run: |
          set -e
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using iOS SDK: $SDK_PATH"

          rm -rf build_ipa Payload ClaridadFinanciera.ipa
          mkdir -p Payload/ClaridadFinanciera.app/assets

          # 1. Compile Swift WKWebView iOS executable for ARM64 iOS 15.0+
          xcrun -sdk iphoneos swiftc \
            -parse-as-library \
            -target arm64-apple-ios15.0 \
            -sdk "$SDK_PATH" \
            -O \
            ios/ClaridadApp.swift \
            -o Payload/ClaridadFinanciera.app/ClaridadFinanciera

          # 2. Copy Info.plist, PkgInfo, and Web App Bundle
          cp ios/Info.plist Payload/ClaridadFinanciera.app/Info.plist
          printf "APPL????" > Payload/ClaridadFinanciera.app/PkgInfo
          cp index.html manifest.json sw.js Payload/ClaridadFinanciera.app/
          cp -R assets/* Payload/ClaridadFinanciera.app/assets/

          # 3. Generate iOS SpringBoard App Icons
          sips -z 120 120 assets/icon-1024.png --out Payload/ClaridadFinanciera.app/AppIcon60x60@2x.png >/dev/null
          sips -z 180 180 assets/icon-1024.png --out Payload/ClaridadFinanciera.app/AppIcon60x60@3x.png >/dev/null
          sips -z 152 152 assets/icon-1024.png --out Payload/ClaridadFinanciera.app/AppIcon76x76@2x.png >/dev/null

          # 4. Ad-hoc codesign for Sideloadly / AltStore / SideStore / TrollStore
          codesign --force --sign - --timestamp=none Payload/ClaridadFinanciera.app

          # 5. Zip into ClaridadFinanciera.ipa
          zip -qry ClaridadFinanciera.ipa Payload
          ls -lh ClaridadFinanciera.ipa

      - name: Commit .IPA to repository for direct GitHub Pages download
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ClaridadFinanciera.ipa
          if ! git diff --staged --quiet; then
            git commit -m "build(ios): update compiled ClaridadFinanciera.ipa [skip ci]"
            git push origin main
          fi

      - name: Upload .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaridadFinanciera-iOS-IPA
          path: ClaridadFinanciera.ipa

      - name: Publish / Update GitHub Release with .IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ClaridadFinanciera.ipa --clobber
          else
            gh release create "$TAG" ClaridadFinanciera.ipa \
              --title "Claridad Financiera v2.0 (iOS .IPA & Web)" \
              --notes "Aplicación unificada Claridad Financiera (Control Mensual + Deudas P2P & Grupos Supabase). Descarga **ClaridadFinanciera.ipa** para instalar en iPhone con AltStore, SideStore, Sideloadly o TrollStore."
          fi
