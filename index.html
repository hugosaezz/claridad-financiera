    // ----------------------------------------------------------------------------
    // 5E. 7 SMART FINANCIAL DETECTORS (100% Local, Deterministic & Anti-Fatigue)
    // ----------------------------------------------------------------------------
    function runSmartFinancialDetectors(baseDate = new Date()) {
      const alerts = [];
      const dismissed = new Set(S?.dismissedDetectors || []);
      const expenses = (S?.expenses || []).slice();
      const incomes = (S?.incomes || []).slice();
      const recurring = (S?.recurring || []).slice();

      const normMerchantKey = (e) => cleanNoteText(e.note || '', catById(e.cat).name).toLowerCase().replace(/\s+/g, ' ').trim();
      const getCents = (e) => typeof e.amount_cents === 'number' ? e.amount_cents : Money.toCents(e.amount || 0);

      // Group expenses by normalized merchant
      const byMerchant = {};
      expenses.forEach(e => {
        const k = normMerchantKey(e);
        if (!k || k.length < 2) return;
        if (!byMerchant[k]) byMerchant[k] = [];
        byMerchant[k].push({ ...e, _cents: getCents(e) });
      });

      // --- DETECTOR 1: Duplicate Charges (< 48 hours, same merchant & exact same cents) ---
      Object.entries(byMerchant).forEach(([k, list]) => {
        if (list.length < 2) return;
        const sorted = list.slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
        for (let i = 1; i < sorted.length; i++) {
          const prev = sorted[i - 1], cur = sorted[i];
          if (prev._cents !== cur._cents || prev._cents <= 0) continue;
          const d1 = new Date(prev.date + 'T00:00:00');
          const d2 = new Date(cur.date + 'T00:00:00');
          const diffDays = Math.abs((d2 - d1) / 86400000);
          if (diffDays <= 2) {
            const id = `dup_${k}_${cur._cents}_${cur.date}`;
            if (!dismissed.has(id)) {
              alerts.push({
                id,
                type: 'duplicate_charge',
                severity: 'high',
                icon: 'warning',
                title: `Posible cobro duplicado en ${cleanNoteText(cur.note, k)}`,
                body: `Dos cargos idénticos de ${fmt(Money.fromCents(cur._cents))} en menos de 48h (${fmtDay(prev.date)} y ${fmtDay(cur.date)}).`,
                merchant: cleanNoteText(cur.note, k),
                amount_cents: cur._cents
              });
            }
            break;
          }
        }
      });

      // --- DETECTOR 2 & 3: Unregistered Recurring Subscriptions & Silent Price Hikes ---
      Object.entries(byMerchant).forEach(([k, list]) => {
        const byMonth = {};
        list.forEach(e => {
          const mk = String(e.date || '').slice(0, 7);
          if (!byMonth[mk]) byMonth[mk] = [];
          byMonth[mk].push(e);
        });
        const months = Object.keys(byMonth).sort();
        if (months.length < 2) return;

        const latest = byMonth[months[months.length - 1]][0];
        const prev = byMonth[months[months.length - 2]][0];
        const ratio = prev._cents > 0 ? latest._cents / prev._cents : 1;

        // Price hike detector (>= 5% and <= 60% increase on recurring merchant)
        if (ratio >= 1.05 && ratio <= 1.60) {
          const diffCents = latest._cents - prev._cents;
          const id = `hike_${k}_${latest._cents}`;
          if (!dismissed.has(id)) {
            alerts.push({
              id,
              type: 'price_hike',
              severity: 'medium',
              icon: 'trending_up',
              title: `Subida silenciosa en ${cleanNoteText(latest.note, k)}`,
              body: `Pasó de ${fmt(Money.fromCents(prev._cents))} a ${fmt(Money.fromCents(latest._cents))}/mes (+${fmt(Money.fromCents(diffCents))}/mes · +${fmt0(Money.fromCents(diffCents * 12))}/año).`,
              merchant: cleanNoteText(latest.note, k),
              diff_cents: diffCents,
              annual_diff_cents: diffCents * 12
            });
          }
        }

        // Unregistered subscription candidate (similar price ±10% across >= 2 months)
        const alreadyTracked = recurring.some(r => String(r.name || '').toLowerCase().includes(k) || k.includes(String(r.name || '').toLowerCase()));
        if (!alreadyTracked && ratio >= 0.90 && ratio <= 1.10) {
          const day = Math.min(28, Math.max(1, parseInt(String(latest.date || '').slice(8, 10), 10) || 1));
          const id = `subcand_${k}`;
          if (!dismissed.has(id)) {
            alerts.push({
              id,
              type: 'recurring_candidate',
              severity: 'info',
              icon: 'autorenew',
              title: `Suscripción detectada: ${cleanNoteText(latest.note, k)}`,
              body: `Se repite en ${months.length} meses (~${fmt(Money.fromCents(latest._cents))} sobre el día ${day}). ¿La añadimos a tus gastos fijos?`,
              merchant: cleanNoteText(latest.note, k),
              amount_cents: latest._cents,
              cat: latest.cat || 'susc',
              day
            });
          }
        }
      });

      // --- DETECTOR 4: Unusual Spend by Category (z-score > 2.0 or >= 2.5x category mean) ---
      const byCatMap = {};
      expenses.forEach(e => {
        if (!byCatMap[e.cat]) byCatMap[e.cat] = [];
        byCatMap[e.cat].push({ ...e, _cents: getCents(e) });
      });
      Object.entries(byCatMap).forEach(([catId, list]) => {
        if (list.length < 4) return;
        const vals = list.map(x => x._cents);
        const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
        const variance = vals.reduce((a, v) => a + Math.pow(v - mean, 2), 0) / vals.length;
        const std = Math.sqrt(variance);
        const recent = list.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)))[0];
        if (!recent) return;
        const z = std > 0 ? (recent._cents - mean) / std : 0;
        if ((z >= 2.0 && recent._cents >= mean * 2.0) || recent._cents >= mean * 2.8) {
          const id = `unusual_${recent.id}`;
          if (!dismissed.has(id)) {
            alerts.push({
              id,
              type: 'unusual_spend',
              severity: 'info',
              icon: 'insights',
              title: `Gasto inusual en ${catById(catId).name}`,
              body: `${cleanNoteText(recent.note, catById(catId).name)} (${fmt(Money.fromCents(recent._cents))}) es ${(recent._cents / Math.max(1, mean)).toFixed(1)}× tu media habitual (${fmt0(Money.fromCents(Math.round(mean)))}).`,
              expenseId: recent.id,
              amount_cents: recent._cents
            });
          }
        }
      });

      // --- DETECTOR 5: Bank Fees Detected ---
      const feeRows = expenses.filter(e => e.isBankFee || /comisi[oó]n|mantenimiento\s+cuenta/i.test(String(e.note || '') + ' ' + String(e.rawMerchant || '')));
      if (feeRows.length > 0) {
        const feeSumCents = feeRows.reduce((a, e) => a + getCents(e), 0);
        const id = `fees_${feeRows.length}_${feeSumCents}`;
        if (!dismissed.has(id)) {
          alerts.push({
            id,
            type: 'bank_fees',
            severity: 'medium',
            icon: 'account_balance',
            title: `Comisiones bancarias detectadas (${fmt(Money.fromCents(feeSumCents))})`,
            body: `Hemos detectado ${feeRows.length} cargo(s) de comisiones bancarias. A este ritmo pueden suponer ~${fmt0(Money.fromCents(feeSumCents * 12))}/año.`,
            amount_cents: feeSumCents
          });
        }
      }

      // --- DETECTOR 6: Salary Detected -> 50/30/20 Distribution Assistant ---
      const curMk = monthKey(dstr(baseDate));
      const salaryInc = incomes.find(i => (i.cat === 'nomina' || /n[oó]mina|salario/i.test(String(i.source || ''))) && monthKey(i.date) === curMk);
      if (salaryInc) {
        const salCents = getCents(salaryInc);
        const id = `sal503020_${curMk}_${salCents}`;
        if (salCents >= 50000 && !dismissed.has(id)) {
          alerts.push({
            id,
            type: 'salary_503020',
            severity: 'positive',
            icon: 'payments',
            title: `Nómina de ${fmt0(Money.fromCents(salCents))} detectada`,
            body: `Sugerencia 50/30/20: ${fmt0(Money.fromCents(Math.round(salCents * 0.5)))} necesidades · ${fmt0(Money.fromCents(Math.round(salCents * 0.3)))} ocio · ${fmt0(Money.fromCents(Math.round(salCents * 0.2)))} ahorro.`,
            salary_cents: salCents
          });
        }
      }

      // --- DETECTOR 7: Projected Overdraft Warning (Next 7 Days vs Upcoming Recurring) ---
      const todayDay = baseDate.getDate();
      const upcoming7 = recurring.filter(r => {
        const d = Number(r.day || 1);
        const delta = d >= todayDay ? (d - todayDay) : (d + 30 - todayDay);
        return delta >= 0 && delta <= 7 && !recPaidThisMonth(r, curMk);
      });
      const upcoming7Cents = upcoming7.reduce((a, r) => a + Money.toCents(r.amount || 0), 0);
      if (upcoming7Cents > 0) {
        // Use synced bank balance if available, else month balance
        const syncedAccs = (S?.accounts || []).filter(a => !a.archived && typeof a.syncedBalanceCents === 'number');
        const availCents = syncedAccs.length > 0
          ? syncedAccs.reduce((a, x) => a + x.syncedBalanceCents, 0)
          : Money.toCents(monthBalance(curMk));
        if (availCents < upcoming7Cents) {
          const id = `overdraft_${curMk}_${upcoming7Cents}`;
          if (!dismissed.has(id)) {
            alerts.push({
              id,
              type: 'overdraft_risk',
              severity: 'high',
              icon: 'warning',
              title: 'Riesgo de descubierto en los próximos 7 días',
              body: `Llegan ${upcoming7.length} recibo(s) por ${fmt(Money.fromCents(upcoming7Cents))} y tu saldo disponible estimado es ${fmt(Money.fromCents(availCents))}.`,
              upcoming_cents: upcoming7Cents,
              available_cents: availCents
            });
          }
        }
      }

      const order = { high: 0, medium: 1, positive: 2, info: 3 };
      return alerts.sort((a, b) => (order[a.severity] ?? 9) - (order[b.severity] ?? 9));
    }

    /**
     * Compute exact goal projection, milestones (25/50/75/100%), and ETA date.
     * Supports 3 goal kinds: 'savings' (default), 'reduction', 'debt_zero'.
     */
    function computeGoalProjection(goal, overrideMonthlyCents = null, baseDate = new Date()) {
      const kind = goal?.kind || 'savings';
      const curMk = monthKey(dstr(baseDate));

      if (kind === 'reduction') {
        const catId = goal.cat || 'ocio';
        const baselineCents = Math.max(100, Money.toCents(goal.baselineAmount || goal.target || 200));
        const reductionPct = Math.max(5, Math.min(80, Number(goal.reductionPct || 20)));
        const maxAllowedCents = Math.round(baselineCents * (1 - reductionPct / 100));
        const spentThisMonthCents = Money.toCents(
          sumExp(monthExpenses(curMk).filter(e => e.cat === catId))
        );
        const savedVsBaselineCents = Math.max(0, baselineCents - spentThisMonthCents);
        const onTrack = spentThisMonthCents <= maxAllowedCents;
        const pct = maxAllowedCents > 0
          ? (onTrack ? Math.min(100, Math.round((1 - (spentThisMonthCents / Math.max(1, baselineCents))) / (reductionPct / 100) * 100)) : Math.max(0, Math.round((maxAllowedCents / Math.max(1, spentThisMonthCents)) * 60)))
          : 100;
        return {
          kind: 'reduction',
          pct: Math.max(0, Math.min(100, pct)),
          targetCents: maxAllowedCents,
          currentCents: spentThisMonthCents,
          baselineCents,
          savedVsBaselineCents,
          onTrack,
          milestones: [25, 50, 75, 100].map(m => ({ pct: m, reached: pct >= m })),
          etaLabel: onTrack ? 'En objetivo este mes ✓' : 'Ritmo algo alto (ajustable)'
        };
      }

      if (kind === 'debt_zero') {
        const p2p = typeof computeP2PMetrics === 'function' ? computeP2PMetrics() : { totalQueDebo: 0 };
        const currentDebtCents = Money.toCents(p2p.totalQueDebo || 0);
        const initialDebtCents = Math.max(currentDebtCents, Money.toCents(goal.initialDebt || goal.target || currentDebtCents || 100));
        const paidCents = Math.max(0, initialDebtCents - currentDebtCents);
        const pct = currentDebtCents <= 0 ? 100 : (initialDebtCents > 0 ? Math.min(99, Math.round((paidCents / initialDebtCents) * 100)) : 0);
        const monthlyCents = overrideMonthlyCents !== null
          ? Math.max(0, Math.round(overrideMonthlyCents))
          : Math.max(1000, Money.toCents(goal.monthlyPlan || 100));
        const monthsNeeded = currentDebtCents <= 0 ? 0 : (monthlyCents > 0 ? Math.ceil(currentDebtCents / monthlyCents) : null);
        let etaDate = null, etaLabel = '¡Libre de deudas! 🎉';
        if (monthsNeeded && monthsNeeded > 0) {
          const dt = new Date(baseDate.getFullYear(), baseDate.getMonth() + monthsNeeded, 1);
          etaDate = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0');
          etaLabel = dt.toLocaleString('es-ES', { month: 'long', year: 'numeric' });
        }
        return {
          kind: 'debt_zero',
          pct,
          targetCents: initialDebtCents,
          currentCents: paidCents,
          remainingCents: currentDebtCents,
          monthlyRateCents: monthlyCents,
          monthsNeeded,
          etaDate,
          etaLabel,
          milestones: [25, 50, 75, 100].map(m => ({ pct: m, reached: pct >= m }))
        };
      }

      // Default: 'savings' goal
      const targetCents = Math.max(0, Money.toCents(goal.target || 0));
      const savedCents = Math.max(0, Money.toCents(goal.saved || 0));
      const remainingCents = Math.max(0, targetCents - savedCents);
      const pct = targetCents > 0 ? Math.min(100, Math.round((savedCents / targetCents) * 100)) : 0;

      // Determine baseline monthly savings rate
      let monthlyRateCents = overrideMonthlyCents !== null ? Math.max(0, Math.round(overrideMonthlyCents)) : Money.toCents(goal.monthlyPlan || 0);
      if (!(monthlyRateCents > 0)) {
        const net = monthBalance(curMk);
        const autoRate = net > 0 ? Math.max(2500, Math.round(Money.toCents(net) * 0.4)) : 10000;
        monthlyRateCents = autoRate;
      }

      let monthsNeeded = 0;
      let etaDate = null;
      let etaLabel = '¡Meta alcanzada! 🎉';
      if (remainingCents > 0) {
        if (monthlyRateCents > 0) {
          monthsNeeded = Math.ceil(remainingCents / monthlyRateCents);
          const dt = new Date(baseDate.getFullYear(), baseDate.getMonth() + monthsNeeded, 1);
          etaDate = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0');
          etaLabel = dt.toLocaleString('es-ES', { month: 'long', year: 'numeric' });
        } else {
          monthsNeeded = null;
          etaLabel = 'Define aportación mensual';
        }
      }

      return {
        kind: 'savings',
        pct,
        targetCents,
        currentCents: savedCents,
        remainingCents,
        monthlyRateCents,
        monthsNeeded,
        etaDate,
        etaLabel,
        milestones: [25, 50, 75, 100].map(m => ({ pct: m, reached: pct >= m }))
      };
    }

    /** Record a goal contribution with milestone detection (25/50/75/100%) and gentle celebration */
    function applyGoalContribution(goalId, amountCents) {
      const g = (S.goals || []).find(x => x.id === goalId);
      if (!g || !amountCents) return null;
      const prevPct = g.target > 0 ? Math.floor((g.saved / g.target) * 100) : 0;
      const newSavedCents = Math.max(0, Money.toCents(g.saved || 0) + amountCents);
      g.saved = Money.fromCents(newSavedCents);
      if (amountCents > 0) {
        if (!Array.isArray(g.contributions)) g.contributions = [];
        g.contributions.push({ date: todayStr(), amount_cents: amountCents });
      }
      const nextPct = g.target > 0 ? Math.min(100, Math.floor((g.saved / g.target) * 100)) : 0;

      const crossed = [25, 50, 75, 100].filter(m => prevPct < m && nextPct >= m);
      saveLocalState(true);
      renderAllViews();

      if (crossed.includes(100)) {
        triggerGentleCelebration(`🏆 ¡Meta «${g.name}» completada al 100%!`);
      } else if (crossed.length > 0) {
        const topM = crossed[crossed.length - 1];
        triggerGentleCelebration(`✨ ¡Hito ${topM}% alcanzado en «${g.name}»!`);
      } else {
        showToast(`Meta «${g.name}» actualizada ✓`);
      }
      return { prevPct, nextPct, crossed };
    }

    // ----------------------------------------------------------------------------
    // 6C. OPTIONAL SELF-ONLY CHALLENGES ENGINE (Zero Rankings, Zero Guilt)
    // ----------------------------------------------------------------------------
    function evaluateChallengeProgress(ch, baseDate = new Date()) {
      const mk = ch.monthKey || monthKey(dstr(baseDate));
      const exps = monthExpenses(mk);
      const incTotal = monthIncomeTotal(mk);
      const expTotal = sumExp(exps);

      if (ch.kind === 'no_spend_days') {
        const [Y, M] = mk.split('-').map(Number);
        const dim = new Date(Y, M, 0).getDate();
        const isCur = mk === monthKey(dstr(baseDate));
        const maxDay = isCur ? baseDate.getDate() : dim;
        const spendDays = new Set(exps.filter(e => e.cat !== 'susc' && e.cat !== 'hogar').map(e => e.date));
        let noSpend = 0;
        for (let d = 1; d <= maxDay; d++) {
          const ds = `${mk}-${String(d).padStart(2, '0')}`;
          if (!spendDays.has(ds)) noSpend++;
        }
        const target = Math.max(1, Number(ch.targetValue || 7));
        const pct = Math.min(100, Math.round((noSpend / target) * 100));
        const completed = noSpend >= target;
        return {
          currentLabel: `${noSpend} de ${target} días sin gasto`,
          pct,
          completed,
          statusTone: completed ? 'completed' : 'active',
          gentleNote: completed ? '¡Reto conseguido a tu ritmo! ✨' : `Te faltan ${target - noSpend} día(s) tranquilo(s) este mes.`
        };
      }

      if (ch.kind === 'keyword_cap' || ch.kind === 'category_cap') {
        const kws = (ch.keywords || []).map(k => k.toLowerCase());
        const matched = exps.filter(e => {
          if (ch.kind === 'category_cap') return e.cat === ch.cat;
          const txt = `${e.note || ''} ${catById(e.cat).name}`.toLowerCase();
          return kws.some(k => txt.includes(k));
        });
        const spentCents = Money.toCents(sumExp(matched));
        const maxCents = Math.max(100, Number(ch.maxCents || 3000));
        const underCap = spentCents <= maxCents;
        const pct = underCap ? Math.min(100, Math.round(((maxCents - spentCents) / maxCents) * 100)) : 0;
        const isMonthEnded = mk < monthKey(dstr(baseDate));
        return {
          currentLabel: `${fmt(Money.fromCents(spentCents))} de máx. ${fmt(Money.fromCents(maxCents))}`,
          pct: underCap ? Math.max(15, 100 - Math.round((spentCents / maxCents) * 100)) : 100,
          completed: underCap && (isMonthEnded || spentCents === 0),
          overLimit: !underCap,
          statusTone: underCap ? 'active' : 'gentle',
          gentleNote: underCap
            ? `Margen disponible: ${fmt(Money.fromCents(maxCents - spentCents))}. ¡Vas genial!`
            : `¡Casi! Llevas ${fmt(Money.fromCents(spentCents))}. Sin estrés: siempre puedes reintentarlo el mes que viene.`
        };
      }

      if (ch.kind === 'savings_rate') {
        const targetPct = Math.max(5, Number(ch.targetPct || 20));
        const rate = incTotal > 0 ? Math.round(((incTotal - expTotal) / incTotal) * 100) : 0;
        const completed = rate >= targetPct;
        return {
          currentLabel: `Tasa actual: ${rate}% (meta ${targetPct}%)`,
          pct: Math.max(0, Math.min(100, Math.round((Math.max(0, rate) / targetPct) * 100))),
          completed,
          statusTone: completed ? 'completed' : 'active',
          gentleNote: completed ? `¡Superaste el ${targetPct}% de ahorro! 💎` : `Cada pequeño ajuste te acerca al ${targetPct}%.`
        };
      }

      if (ch.kind === 'goal_contributions') {
        const target = Math.max(1, Number(ch.targetValue || 3));
        let count = 0;
        (S.goals || []).forEach(g => {
          (g.contributions || []).forEach(c => {
            if (monthKey(c.date) === mk) count++;
          });
        });
        const completed = count >= target;
        return {
          currentLabel: `${count} de ${target} aportaciones este mes`,
          pct: Math.min(100, Math.round((count / target) * 100)),
          completed,
          statusTone: completed ? 'completed' : 'active',
          gentleNote: completed ? '¡Constancia conseguida! 🚀' : `Aporta cualquier cantidad a una meta para sumar.`
        };
      }

      return { currentLabel: 'En marcha', pct: 0, completed: false, statusTone: 'active', gentleNote: '' };
    }

    // ----------------------------------------------------------------------------
    // 6D. SILENT ACHIEVEMENTS / BADGES SHOWCASE
    // ----------------------------------------------------------------------------
    function computeUnlockedBadges(baseDate = new Date()) {
      const curMk = monthKey(dstr(baseDate));
      const expsAll = S?.expenses || [];
      const incsAll = S?.incomes || [];
      const goals = S?.goals || [];
      const challenges = S?.challenges || [];
      const streakDays = Math.max(S?.streak?.best || 0, typeof computeControlStreak === 'function' ? computeControlStreak().days : 0);
      const curInc = monthIncomeTotal(curMk);
      const curExp = sumExp(monthExpenses(curMk));
      const curBudget = totalMonthlyBudget();
      const savingsRate = curInc > 0 ? ((curInc - curExp) / curInc) * 100 : 0;
      const p2p = typeof computeP2PMetrics === 'function' ? computeP2PMetrics() : { totalQueDebo: 0 };
      const hadSettledDebt = (S?.debts || []).some(d => d.settled);

      const goalProjs = goals.map(g => computeGoalProjection(g, null, baseDate));
      const anyChallengeDone = challenges.some(c => evaluateChallengeProgress(c, baseDate).completed);

      const checks = {
        first_tx:          (expsAll.length + incsAll.length) >= 1,
        budget_keeper:     curBudget > 0 && curExp > 0 && curExp <= curBudget,
        streak_7:          streakDays >= 7,
        streak_30:         streakDays >= 30,
        debt_free:         (p2p.totalQueDebo <= 0.005) && hadSettledDebt,
        savings_rate_20:   curInc > 0 && savingsRate >= 20,
        goal_milestone_50: goalProjs.some(p => p.pct >= 50),
        goal_completed:    goalProjs.some(p => p.pct >= 100),
        smart_scanner:     (S?.receipts || []).length >= 1,
        challenge_winner:  anyChallengeDone
      };

      return BADGE_CATALOG.map(b => ({ ...b, unlocked: !!checks[b.id] }));
    }

            ${challenges.length > 0 ? `

          <!-- 3. SILENT ACHIEVEMENTS / BADGES SHOWCASE -->

    }

    // ============================================================================
    // 7. SMART NOTIFICATIONS ENGINE (Dedupe, Cooldowns, Grouping, Quiet Hours & Push)
    // ============================================================================

    const NOTIF_CATEGORIES = [
      { id: 'security_critical', label: 'Seguridad y alertas críticas', desc: 'Cobros duplicados, posible descubierto y caducidad PSD2', defaultInApp: true, defaultPush: true,  cooldownHours: 12 },
      { id: 'debts_social',      label: 'Deudas y pagos sociales',      desc: 'Pagos pendientes de confirmar y préstamos vencidos',       defaultInApp: true, defaultPush: true,  cooldownHours: 24 },
      { id: 'bills_budgets',     label: 'Recibos y presupuesto',        desc: 'Suscripciones en ≤3 días, subidas de precio y límite 85%', defaultInApp: true, defaultPush: true,  cooldownHours: 24 },
      { id: 'warranties_refunds',label: 'Garantías, devoluc. y backup', desc: 'Garantías por vencer, devoluciones y copia local',         defaultInApp: true, defaultPush: false, cooldownHours: 72 },
      { id: 'digest_coach',      label: 'Resumen semanal (Digest)',     desc: 'Resumen tranquilo de tu semana financiera',                defaultInApp: true, defaultPush: false, cooldownHours: 168 }
    ];

    let activeNotifTab = 'new'; // 'new' | 'past' | 'prefs'

    function defaultNotifPrefs() {
      const channels = {};
      NOTIF_CATEGORIES.forEach(c => {
        channels[c.id] = { inApp: c.defaultInApp, push: c.defaultPush };
      });
      return {
        quietEnabled: true,
        quietStart: 22,
        quietEnd: 8,
        digestEnabled: true,
        channels
      };
    }

    function getNotifPrefs() {
      const base = defaultNotifPrefs();
      const saved = S?.settings?.notifPrefs;
      if (!saved || typeof saved !== 'object') return base;
      const mergedChannels = { ...base.channels };
      if (saved.channels && typeof saved.channels === 'object') {
        Object.keys(mergedChannels).forEach(k => {
          if (saved.channels[k]) {
            mergedChannels[k] = {
              inApp: saved.channels[k].inApp !== false,
              push: !!saved.channels[k].push
            };
          }
        });
      }
      return {
        quietEnabled: saved.quietEnabled !== false,
        quietStart: Number.isFinite(Number(saved.quietStart)) ? Number(saved.quietStart) : 22,
        quietEnd: Number.isFinite(Number(saved.quietEnd)) ? Number(saved.quietEnd) : 8,
        digestEnabled: saved.digestEnabled !== false,
        channels: mergedChannels
      };
    }

    function ensureNotifState() {
      if (!S) return { readKeys: [], dismissedKeys: [], lastPushByKey: {} };
      if (!S.notifState || typeof S.notifState !== 'object') {
        S.notifState = { readKeys: [], dismissedKeys: [], lastPushByKey: {} };
      }
      if (!Array.isArray(S.notifState.readKeys)) S.notifState.readKeys = [];
      if (!Array.isArray(S.notifState.dismissedKeys)) S.notifState.dismissedKeys = [];
      if (!S.notifState.lastPushByKey || typeof S.notifState.lastPushByKey !== 'object') S.notifState.lastPushByKey = {};
      return S.notifState;
    }

    /** Check whether a given Date falls inside user's Quiet Hours (e.g. 22:00 - 08:00) */
    function isWithinQuietHours(now = new Date(), prefs = null) {
      const p = prefs || getNotifPrefs();
      if (!p.quietEnabled) return false;
      const h = now.getHours();
      const start = ((p.quietStart % 24) + 24) % 24;
      const end = ((p.quietEnd % 24) + 24) % 24;
      if (start === end) return false;
      if (start > end) {
        // Crosses midnight (e.g. 22 -> 8)
        return h >= start || h < end;
      }
      return h >= start && h < end;
    }

    /**
     * Evaluate all notification rules with:
     * - Deterministic `dedupe_key`
     * - Channel preference filtering
     * - Automatic grouping when >= 3 items share a groupable category
     * - Expiration filtering (`expiresAt`)
     */
    function evaluateNotificationsEngine(now = new Date()) {
      const prefs = getNotifPrefs();
      const nState = ensureNotifState();
      const readSet = new Set(nState.readKeys);
      const dismissedSet = new Set(nState.dismissedKeys);
      const nowMs = now.getTime();
      const today = dstr(now);
      const curMk = monthKey(today);
      const candidates = [];

      const pushCandidate = (item) => {
        const chPref = prefs.channels[item.category];
        if (chPref && !chPref.inApp) return;
        if (item.expiresAt && item.expiresAt < nowMs) return;
        if (dismissedSet.has(item.dedupe_key)) return;
        candidates.push({
          ...item,
          isRead: readSet.has(item.dedupe_key),
          createdAt: item.createdAt || nowMs
        });
      };

      // 1. Admin pending cloud payments
      if (isAdmin) {
        const pendingPayments = (sbMovimientos || []).filter(m => m.tipo === 'pago' && m.estado === 'pendiente');
        pendingPayments.forEach(p => {
          const u = (sbGlobalUsers || []).find(x => Number(x.id) === Number(p.usuario_id));
          const uName = u ? u.nombre : 'Miembro';
          pushCandidate({
            dedupe_key: `cloud_pay_${p.id}`,
            category: 'debts_social',
            severity: 'high',
            icon: 'payments',
            title: `${uName} notificó un pago (+${fmt(p.monto)})`,
            body: `Pendiente de confirmar en tu grupo cloud.`,
            actionLabel: 'Confirmar',
            actionCode: `aprobarPagoSupabase(${p.id}, ${p.usuario_id}, ${p.monto})`,
            secondaryLabel: 'Rechazar',
            secondaryCode: `rechazarPagoSupabase(${p.id})`
          });
        });
      }

      // 2. Overdue P2P debts (grouped automatically if >= 3!)
      const overdueP2P = (S?.debts || []).filter(d => !d.settled && d.type === 'owed' && d.due && d.due < today);
      if (overdueP2P.length >= 3) {
        const sumOverdue = overdueP2P.reduce((a, d) => a + Number(d.amount || 0), 0);
        pushCandidate({
          dedupe_key: `overdue_group_${curMk}_${overdueP2P.length}`,
          category: 'debts_social',
          severity: 'high',
          icon: 'groups',
          groupedCount: overdueP2P.length,
          title: `${overdueP2P.length} cobros P2P con plazo vencido (${fmt(sumOverdue)})`,
          body: overdueP2P.slice(0, 3).map(d => `${d.person} (${fmt0(d.amount)})`).join(' · '),
          actionLabel: 'Ver en Social',
          actionCode: `toggleNotificationsDrawer(); switchMainView('cuentas', 'owed')`
        });
      } else {
        overdueP2P.forEach(d => {
          pushCandidate({
            dedupe_key: `overdue_p2p_${d.id}_${d.due}`,
            category: 'debts_social',
            severity: 'high',
            icon: 'schedule',
            title: `Cobro vencido: ${d.person} (${fmt(d.amount)})`,
            body: `${d.note || 'Préstamo P2P'} · Venció ${fmtDay(d.due)}`,
            actionLabel: 'Recordar',
            actionCode: `sendIndividualWhatsAppClaim('${esc(d.person)}', ${d.amount}, '${esc(d.note || '')}')`
          });
        });
      }

      // 3. Smart Financial Detectors (high + medium)
      if (typeof runSmartFinancialDetectors === 'function') {
        runSmartFinancialDetectors(now).forEach(a => {
          if (a.severity === 'high') {
            pushCandidate({
              dedupe_key: `det_${a.id}`,
              category: 'security_critical',
              severity: 'high',
              icon: a.icon || 'warning',
              title: a.title,
              body: a.body,
              actionLabel: 'Revisar',
              actionCode: `toggleNotificationsDrawer(); switchMainView('ajustes', 'bancos')`
            });
          } else if (a.type === 'price_hike' || a.type === 'bank_fees') {
            pushCandidate({
              dedupe_key: `det_${a.id}`,
              category: 'bills_budgets',
              severity: 'medium',
              icon: a.icon || 'trending_up',
              title: a.title,
              body: a.body,
              actionLabel: 'Ver detalle',
              actionCode: `toggleNotificationsDrawer(); switchMainView('ajustes', 'bancos')`
            });
          }
        });
      }

      // 4. Expiring PSD2 bank connections (<= 7 days)
      if (typeof getExpiringBankConnections === 'function') {
        getExpiringBankConnections(7, nowMs).forEach(b => {
          pushCandidate({
            dedupe_key: `bank_sca_${b.id}_${Math.max(0, b.daysLeft)}`,
            category: 'security_critical',
            severity: 'high',
            icon: 'account_balance',
            title: `Renovar acceso PSD2: ${b.bankName}`,
            body: b.daysLeft <= 0 ? 'Consentimiento de 90 días caducado.' : `Caduca en ${b.daysLeft} día(s).`,
            actionLabel: 'Renovar',
            actionCode: `toggleNotificationsDrawer(); openConnectBankModal()`
          });
        });
      }

      // 5. Upcoming recurring bills in the next 3 days (grouped if >= 3)
      const dayNow = now.getDate();
      const soonBills = (S?.recurring || []).filter(r => {
        const d = Number(r.day || 1);
        const delta = d >= dayNow ? (d - dayNow) : (d + 30 - dayNow);
        return delta >= 0 && delta <= 3 && !recPaidThisMonth(r, curMk);
      });
      if (soonBills.length >= 3) {
        const sumBills = soonBills.reduce((a, r) => a + Number(r.amount || 0), 0);
        pushCandidate({
          dedupe_key: `bills_soon_grp_${curMk}_${dayNow}`,
          category: 'bills_budgets',
          severity: 'medium',
          icon: 'autorenew',
          groupedCount: soonBills.length,
          title: `${soonBills.length} recibos próximos (${fmt(sumBills)})`,
          body: soonBills.slice(0, 3).map(r => `${r.name} día ${r.day}`).join(' · '),
          actionLabel: 'Ver fijos',
          actionCode: `toggleNotificationsDrawer(); switchMainView('ajustes', 'rec')`,
          expiresAt: nowMs + 4 * 86400000
        });
      } else {
        soonBills.forEach(r => {
          pushCandidate({
            dedupe_key: `bill_soon_${r.id}_${curMk}`,
            category: 'bills_budgets',
            severity: 'medium',
            icon: 'autorenew',
            title: `Próximo cargo: ${r.name} (${fmt(r.amount)})`,
            body: `Previsto para el día ${r.day} de este mes.`,
            actionLabel: 'Ver fijos',
            actionCode: `toggleNotificationsDrawer(); switchMainView('ajustes', 'rec')`,
            expiresAt: nowMs + 4 * 86400000
          });
        });
      }

      // 6. Monthly budget threshold (>= 85%)
      const totalBud = totalMonthlyBudget();
      const spentMonth = sumExp(monthExpenses(curMk));
      if (totalBud > 0 && spentMonth >= totalBud * 0.85) {
        const pct = Math.round((spentMonth / totalBud) * 100);
        pushCandidate({
          dedupe_key: `budget_warn_${curMk}_${pct >= 100 ? '100' : '85'}`,
          category: 'bills_budgets',
          severity: pct >= 100 ? 'high' : 'medium',
          icon: 'speed',
          title: pct >= 100 ? `Presupuesto mensual alcanzado (${pct}%)` : `Llevas el ${pct}% de tu presupuesto mensual`,
          body: `Gastado ${fmt0(spentMonth)} de ${fmt0(totalBud)}. Puedes ajustar tu ritmo desde Inicio o el Plan de Rescate.`,
          actionLabel: 'Ver límites',
          actionCode: `toggleNotificationsDrawer(); switchMainView('ajustes', 'pres')`
        });
      }

      // 7. Pending refunds
      const refunds = (S?.expenses || []).filter(e => e.refund);
      refunds.forEach(e => {
        pushCandidate({
          dedupe_key: `refund_${e.id}`,
          category: 'warranties_refunds',
          severity: 'info',
          icon: 'assignment_return',
          title: `Devolución pendiente: ${cleanNoteText(e.note, 'Compra')}`,
          body: `${fmtDay(e.date)} · ${fmt(e.amount)} por recuperar.`,
          actionLabel: '✓ Cobrado',
          actionCode: `markExpenseRefunded('${e.id}'); renderNotificationsDrawerContent()`
        });
      });

      // 8. Expiring warranties (<= 30 days)
      if (typeof getExpiringWarranties === 'function') {
        getExpiringWarranties(30, now).forEach(w => {
          pushCandidate({
            dedupe_key: `warranty_${w.id}_${w.warranty_until}`,
            category: 'warranties_refunds',
            severity: 'info',
            icon: 'shield',
            title: `Garantía próxima a vencer: ${w.store_name}`,
            body: `Vence el ${w.warranty_until} (quedan ${w.daysLeft} días) · ${fmt(Money.fromCents(w.total_cents))}`,
            actionLabel: 'Ver ticket',
            actionCode: `toggleNotificationsDrawer(); openReceiptDetailModal('${w.id}')`
          });
        });
      }

      // 9. Local backup reminder (every 30 days)
      if (typeof needsLocalBackupReminder === 'function' && needsLocalBackupReminder()) {
        pushCandidate({
          dedupe_key: `local_backup_${curMk}`,
          category: 'warranties_refunds',
          severity: 'medium',
          icon: 'download',
          title: 'Hace 30 días que no haces copia local',
          body: 'Exporta un JSON en 1 toque para tener tus datos locales siempre a salvo.',
          actionLabel: 'Exportar',
          actionCode: `exportBackupJSON(); renderNotificationsDrawerContent()`
        });
      }

      // 10. Optional Weekly Digest (calm summary)
      if (prefs.digestEnabled && (S?.expenses || []).length > 0) {
        const weekNum = Math.ceil(now.getDate() / 7);
        pushCandidate({
          dedupe_key: `digest_${curMk}_w${weekNum}`,
          category: 'digest_coach',
          severity: 'info',
          icon: 'auto_awesome',
          title: `Resumen semana ${weekNum}: ${fmt0(spentMonth)} gastados este mes`,
          body: `Margen neto actual: ${fmtSigned(monthBalance(curMk))}. Todo organizado en Stats.`,
          actionLabel: 'Ver Stats',
          actionCode: `toggleNotificationsDrawer(); switchMainView('analitica')`
        });
      }

      // Deduplicate by dedupe_key preserving highest severity
      const seen = new Map();
      const sevOrder = { high: 0, medium: 1, info: 2 };
      candidates.forEach(c => {
        if (!seen.has(c.dedupe_key)) seen.set(c.dedupe_key, c);
      });

      const all = Array.from(seen.values()).sort((a, b) => (sevOrder[a.severity] ?? 9) - (sevOrder[b.severity] ?? 9));
      const unread = all.filter(x => !x.isRead);
      const read = all.filter(x => x.isRead);
      return { all, unread, read };
    }

    /** Check if a notification may dispatch a local push right now (respecting Quiet Hours & cooldowns) */
    function canDispatchLocalPush(notif, now = new Date()) {
      const prefs = getNotifPrefs();
      const ch = prefs.channels[notif.category];
      if (!ch || !ch.push) return { allowed: false, reason: 'channel_push_disabled' };

      // Respect Quiet Hours (only critical security alerts may optionally break quiet hours? No, keep peaceful by default!)
      if (isWithinQuietHours(now, prefs)) {
        return { allowed: false, reason: 'quiet_hours' };
      }

      const catMeta = NOTIF_CATEGORIES.find(c => c.id === notif.category);
      const cooldownMs = ((catMeta?.cooldownHours || 24) * 3600 * 1000);
      const nState = ensureNotifState();
      const lastSent = Number(nState.lastPushByKey[notif.dedupe_key] || 0);
      if (lastSent > 0 && (now.getTime() - lastSent) < cooldownMs) {
        return { allowed: false, reason: 'cooldown' };
      }
      return { allowed: true, reason: 'ok' };
    }

    async function dispatchEligibleLocalPushes(now = new Date()) {
      const { unread } = evaluateNotificationsEngine(now);
      const nState = ensureNotifState();
      let sent = 0;

      for (const n of unread) {
        const check = canDispatchLocalPush(n, now);
        if (!check.allowed) continue;

        let delivered = false;
        if (typeof window.claridadScheduleLocalNotif === 'function') {
          try {
            window.claridadScheduleLocalNotif(n.dedupe_key, n.title, n.body, 1);
            delivered = true;
          } catch (e) {}
        } else if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
          try {
            new Notification(n.title, { body: n.body, tag: n.dedupe_key });
            delivered = true;
          } catch (e) {}
        }

        if (delivered) {
          nState.lastPushByKey[n.dedupe_key] = now.getTime();
          sent++;
        }
      }
      if (sent > 0) saveLocalState(false);
      return sent;
    }

    async function requestLocalPushPermission() {
      if (typeof window.claridadRequestNotifPermission === 'function') {
        const ok = await window.claridadRequestNotifPermission();
        showToast(ok ? '🔔 Notificaciones nativas iOS activadas ✓' : 'Permiso de notificaciones no concedido');
        renderSmartNotificationsDrawer();
        return ok;
      }
      if (typeof Notification === 'undefined') {
        showToast('Este navegador no soporta notificaciones locales');
        return false;
      }
      const res = await Notification.requestPermission();
      showToast(res === 'granted' ? '🔔 Notificaciones locales activadas ✓' : 'Permiso de notificaciones denegado');
      renderSmartNotificationsDrawer();
      return res === 'granted';
    }

    function markNotificationRead(dedupeKey) {
      const nState = ensureNotifState();
      if (!nState.readKeys.includes(dedupeKey)) nState.readKeys.push(dedupeKey);
      saveLocalState(false);
      updateCloudHeaderUI();
      renderSmartNotificationsDrawer();

    function markAllNotificationsRead() {

    // ============================================================================

    const E2E_WORDLIST_ES = [
      'abril', 'acero', 'agua', 'aire', 'alamo', 'alba', 'aldea', 'alga',
      'alma', 'alto', 'ambar', 'amigo', 'ancla', 'arena', 'aroma', 'arte',

      'cumbre', 'danza', 'delta', 'duna', 'eco', 'encina', 'enigma', 'epoca',
      'esfera', 'espiga', 'faro', 'fauna', 'fibra', 'finca', 'flora', 'fuego',
      'gala', 'gema', 'globo', 'grano', 'gruta', 'hacha', 'hebra', 'hielo',
      'hoja', 'huerto', 'isla', 'jade', 'jardin', 'junta', 'lago', 'lanza',
      'laurel', 'letra', 'lino', 'llama', 'llave', 'loma', 'luna', 'luz',
      'madera', 'marea', 'marfil', 'mate', 'meta', 'miel', 'mirlo', 'monte',
      'musgo', 'nacar', 'nave', 'niebla', 'nieve', 'nube', 'nuez', 'oasis',
      'olivo', 'onda', 'opalo', 'orbe', 'palma', 'pampa', 'paso', 'perla',
      'piedra', 'pino', 'plata', 'pluma', 'polen', 'prado', 'puente', 'pulso',
      'quarz', 'rama', 'rayo', 'ribera', 'roble', 'roca', 'rosa', 'ruta',
      'salvia', 'selva', 'senda', 'sierra', 'silbo', 'sol', 'sombra', 'tallo'
    ];

    function generateRecoveryPhrase12() {
      const words = [];
      const len = E2E_WORDLIST_ES.length;
      if (typeof crypto !== 'undefined' && typeof crypto.getRandomValues === 'function') {
        const buf = new Uint32Array(12);
        crypto.getRandomValues(buf);
        for (let i = 0; i < 12; i++) words.push(E2E_WORDLIST_ES[buf[i] % len]);
      } else {
        for (let i = 0; i < 12; i++) words.push(E2E_WORDLIST_ES[Math.floor(Math.random() * len)]);
      }
      return words.join(' ');
    }

    function normalizeRecoveryPhrase(phrase) {
      return String(phrase || '').trim().toLowerCase().replace(/\s+/g, ' ');
    }

    function bytesToBase64(bytes) {
      let bin = '';
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin);
    }

    function base64ToBytes(b64) {
      const bin = atob(String(b64 || ''));
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    function isWebCryptoAESAvailable() {
      return typeof crypto !== 'undefined' && !!(crypto.subtle && typeof crypto.subtle.encrypt === 'function');
    }

    async function deriveE2EKeyFromPhrase(phrase, saltBytes) {
      const norm = normalizeRecoveryPhrase(phrase);
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey('raw', enc.encode(norm), 'PBKDF2', false, ['deriveKey']);
      return await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: saltBytes, iterations: 150000, hash: 'SHA-256' },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    }

    /**
     * Encrypt any JSON-serializable personal dataset with AES-256-GCM + PBKDF2-SHA256.
     */
    async function encryptPersonalPayloadE2E(plainObj, phrase) {
      const norm = normalizeRecoveryPhrase(phrase);
      if (norm.split(' ').length < 6) throw new Error('La frase de recuperación debe tener al menos 6 palabras');
      if (!isWebCryptoAESAvailable()) throw new Error('Web Crypto AES-GCM requiere HTTPS o localhost');

      const salt = new Uint8Array(16);
      const iv = new Uint8Array(12);
      crypto.getRandomValues(salt);
      crypto.getRandomValues(iv);

      const key = await deriveE2EKeyFromPhrase(norm, salt);
      const plaintextBytes = new TextEncoder().encode(JSON.stringify(plainObj));
      const cipherBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plaintextBytes);

      return {
        claridad_e2e: true,
        v: 1,
        alg: 'AES-256-GCM',
        kdf: 'PBKDF2-SHA256',
        iter: 150000,
        salt: bytesToBase64(salt),
        iv: bytesToBase64(iv),
        ciphertext: bytesToBase64(new Uint8Array(cipherBuf)),
        createdAt: new Date().toISOString()
      };
    }

    async function decryptPersonalPayloadE2E(envelope, phrase) {
      if (!envelope || !envelope.claridad_e2e || !envelope.ciphertext) {
        throw new Error('Archivo cifrado no válido');
      }
      if (!isWebCryptoAESAvailable()) throw new Error('Web Crypto AES-GCM requiere HTTPS o localhost');
      const salt = base64ToBytes(envelope.salt);
      const iv = base64ToBytes(envelope.iv);
      const cipherBytes = base64ToBytes(envelope.ciphertext);
      const key = await deriveE2EKeyFromPhrase(phrase, salt);
      const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, cipherBytes);
      return JSON.parse(new TextDecoder().decode(plainBuf));
    }

    /** Deterministic non-crypto checksum for verifying phrase entry without storing the raw phrase */
    function computePhraseFingerprint(phrase) {
      const norm = normalizeRecoveryPhrase(phrase);
      let h1 = 0x811c9dc5, h2 = 0x9e3779b9;
      for (let i = 0; i < norm.length; i++) {
        const ch = norm.charCodeAt(i);
        h1 ^= ch; h1 = Math.imul(h1, 0x01000193);
        h2 ^= ch; h2 = Math.imul(h2, 0x85ebca6b);
      }
      return ((h1 >>> 0).toString(16).padStart(8, '0') + (h2 >>> 0).toString(16).padStart(8, '0'));
    }

    function getE2EConfig() {
      try {
        const raw = localStorage.getItem('claridad_e2e_cfg_v1');
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return { enabled: false, fingerprint: null, enabledAt: null };
    }

    function saveE2EConfig(cfg) {
      try { localStorage.setItem('claridad_e2e_cfg_v1', JSON.stringify(cfg)); } catch (e) {}

    // 7E. DEEP LINKS ROUTER (#/inicio, #/social/grupos, #/stats, #/yo, #/add/voz)
    // ============================================================================
    let isHandlingHashRoute = false;

    function syncRouteHash() {
      if (isHandlingHashRoute) return;
      let route = '#/inicio';
      if (activeMainView === 'cuentas') {
        route = `#/social/${activeP2PTab || 'balance'}`;
      } else if (activeMainView === 'analitica') {
        route = '#/stats';
      } else if (activeMainView === 'ajustes') {
        route = activeAjustesSub ? `#/yo/${activeAjustesSub}` : '#/yo';
      } else if (activeMainView === 'gastos') {
        route = '#/movimientos';
      }
      if (window.location.hash !== route) {
        try {
          history.replaceState(null, '', route);
        } catch (e) {}
      }
    }

    function navigateFromHash() {
      const raw = (window.location.hash || '').replace(/^#\/?/, '').trim().toLowerCase();
      if (!raw) return false;
      const parts = raw.split('/').filter(Boolean);
      const head = parts[0];
      const sub = parts[1] || null;

      isHandlingHashRoute = true;
      try {
        if (head === 'inicio' || head === 'home') {
          switchMainView('inicio');
        } else if (head === 'social' || head === 'deudas' || head === 'cuentas') {
          const validSub = ['balance', 'grupos', 'historial'].includes(sub) ? sub : 'balance';
          switchMainView('cuentas', validSub);
        } else if (head === 'stats' || head === 'analitica') {
          switchMainView('analitica');
        } else if (head === 'yo' || head === 'ajustes') {
          switchMainView('ajustes', sub || 'perfil');
        } else if (head === 'movimientos' || head === 'gastos') {
          switchMainView('gastos');
        } else if (head === 'add') {
          switchMainView('inicio');
          if (sub === 'voz') openCompoundVoiceModal(true);
          else if (sub === 'ticket') openEnhancedReceiptScannerModal();
          else if (sub === 'ingreso') openTxModal('inc');
          else if (sub === 'gasto') openTxModal('exp');
          else openQuickActionSheet();
        } else {
          return false;
        }
        return true;
      } finally {
        isHandlingHashRoute = false;
      }
    }

    async function applyBulkCategory(catId) {
      const expIds = Array.from(bulkSelectedIds).filter(k => k.startsWith('exp:')).map(k => k.slice(4));
      let changed = 0;
      for (const id of expIds) {
        const exp = (S.expenses || []).find(e => e.id === id);
        if (exp) {
          exp.cat = catId;
          changed++;
          if (loggedUserId) await dbUpsertPersonalExpense(exp);
        }
      }
      saveLocalState(true);
      closeUniversalModal();
      exitBulkSelectMode();
      showToast(`✓ ${changed} gasto(s) movidos a ${catById(catId).name}`);
    }

    async function deleteSelectedTransactions() {
      const keys = Array.from(bulkSelectedIds);
      if (keys.length === 0) return;
      const trashEntries = [];
      for (const k of keys) {
        const [kind, id] = k.split(':');
        if (kind === 'exp') {
          const item = (S.expenses || []).find(e => e.id === id);
          if (item) {
            const entry = { trashId: uid(), kind: 'exp', item: { ...item }, deletedAt: Date.now() };
            S.trash.unshift(entry);
            trashEntries.push(entry);
            S.expenses = S.expenses.filter(e => e.id !== id);
            if (loggedUserId) await dbDeletePersonalExpense(id);
          }
        } else if (kind === 'inc') {
          const item = (S.incomes || []).find(i => i.id === id);
          if (item) {
            const entry = { trashId: uid(), kind: 'inc', item: { ...item }, deletedAt: Date.now() };
            S.trash.unshift(entry);
            trashEntries.push(entry);
            S.incomes = S.incomes.filter(i => i.id !== id);
            if (loggedUserId) await dbDeletePersonalIncome(id);
          }
        }
      }
      saveLocalState(true);
      exitBulkSelectMode();
      showToast(`🗑️ ${trashEntries.length} movimiento(s) enviados a papelera`, 'Deshacer', async () => {
        for (const entry of trashEntries) {
          await restoreFromTrash(entry.trashId);
        }
      }, 5000);
    }

    function initGesturesAndInteractions() {
      // 1. Central '+' FAB: Tap = Quick Action Sheet | Long-Press = Direct Voice Dictation
      const fab = $('#fab-add-btn');
      if (fab && !fab.dataset.bound) {
        fab.dataset.bound = 'true';
        let lpTimer = null;
        let didLongPress = false;

        const startPress = () => {
          didLongPress = false;
          fab.classList.add('is-longpressing');
          lpTimer = setTimeout(() => {
            didLongPress = true;
            fab.classList.remove('is-longpressing');
            haptic('heavy');
            openCompoundVoiceModal(true);
          }, 480);
        };
        const cancelPress = () => {
          clearTimeout(lpTimer);
          fab.classList.remove('is-longpressing');
        };

        fab.addEventListener('pointerdown', startPress);
        fab.addEventListener('pointerup', () => {
          cancelPress();
          if (!didLongPress) {
            haptic('medium');
            openQuickActionSheet();
          }
        });
        fab.addEventListener('pointerleave', cancelPress);
        fab.addEventListener('pointercancel', cancelPress);
        fab.addEventListener('contextmenu', (e) => e.preventDefault());
      }

      // 2. Horizontal Swipe on Home (#view-inicio) changes month
      const mainCanvas = $('#app-main-canvas');
      if (mainCanvas && !mainCanvas.dataset.swipeBound) {
        mainCanvas.dataset.swipeBound = 'true';
        let homeStartX = 0, homeStartY = 0, homeEligible = false;

        mainCanvas.addEventListener('touchstart', (e) => {
          if (activeMainView !== 'inicio' || e.touches.length !== 1) { homeEligible = false; return; }
          const target = e.target;
          if (target.closest('.custom-scroll') || target.closest('.tx-swipe-wrap') || target.closest('input, select, textarea')) {
            homeEligible = false;
            return;
          }
          homeStartX = e.touches[0].clientX;
          homeStartY = e.touches[0].clientY;
          homeEligible = true;
        }, { passive: true });

        mainCanvas.addEventListener('touchend', (e) => {
          if (!homeEligible || e.changedTouches.length !== 1) return;
          const dx = e.changedTouches[0].clientX - homeStartX;
          const dy = e.changedTouches[0].clientY - homeStartY;
          homeEligible = false;
          if (Math.abs(dx) > 72 && Math.abs(dx) > Math.abs(dy) * 1.6) {
            haptic('selection');
            shiftMonth(dx < 0 ? 1 : -1);
          }
        }, { passive: true });
      }

      // 3. Web Pull-to-Refresh (when not inside iOS native wrapper which already has UIRefreshControl)
      if (!window.__CLARIDAD_IOS_NATIVE__ && !document.body.dataset.ptrBound) {
        document.body.dataset.ptrBound = 'true';
        let ptrStartY = 0, ptrPulling = false, ptrDist = 0;
        const ptrEl = $('#ptr-indicator');
        const ptrText = $('#ptr-text');

        window.addEventListener('touchstart', (e) => {
          if (window.scrollY <= 2 && e.touches.length === 1 && !$('#universal-modal')?.classList.contains('flex')) {
            ptrStartY = e.touches[0].clientY;
            ptrPulling = true;
            ptrDist = 0;
          }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
          if (!ptrPulling) return;
          const dy = e.touches[0].clientY - ptrStartY;
          if (dy > 16 && window.scrollY <= 2) {
            ptrDist = Math.min(96, dy);
            if (ptrEl) ptrEl.style.transform = `translateY(${Math.min(64, ptrDist - 36)}px)`;
            if (ptrText) ptrText.textContent = ptrDist > 70 ? 'Suelta para sincronizar' : 'Desliza para actualizar';
          } else {
            ptrPulling = false;
          }
        }, { passive: true });

        window.addEventListener('touchend', () => {
          if (!ptrPulling) return;
          ptrPulling = false;
          if (ptrEl) ptrEl.style.transform = '';
          if (ptrDist > 70) {
            haptic('medium');
            if (loggedUserId) cargarDatosSupabase(true);
            else { renderAllViews(); showToast('Datos actualizados ✓'); }
          }
          ptrDist = 0;
        }, { passive: true });
      }

      // 4. Delegated Swipe (Left = Edit, Right = Delete+Undo) & Long-Press (Multi-Select) on .tx-swipe-wrap
      if (!document.body.dataset.txGestureBound) {
        document.body.dataset.txGestureBound = 'true';
        let activeWrap = null;
        let contentEl = null;
        let startX = 0, startY = 0, currentDx = 0;
        let isHorizontal = false;
        let rowLpTimer = null;
        let rowLongPressed = false;

        document.addEventListener('touchstart', (e) => {
          const wrap = e.target.closest('.tx-swipe-wrap');
          if (!wrap || e.touches.length !== 1) return;
          activeWrap = wrap;
          contentEl = wrap.querySelector('.tx-swipe-content');
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          currentDx = 0;
          isHorizontal = false;
          rowLongPressed = false;

          const txKey = wrap.dataset.txKey;
          if (txKey && !bulkSelectMode) {
            rowLpTimer = setTimeout(() => {
              rowLongPressed = true;
              enterBulkSelectMode(txKey);
            }, 500);
          }
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
          if (!activeWrap || !contentEl) return;
          const dx = e.touches[0].clientX - startX;
          const dy = e.touches[0].clientY - startY;
          if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
            clearTimeout(rowLpTimer);
          }
          if (bulkSelectMode) return;
          if (!isHorizontal && Math.abs(dx) > 14 && Math.abs(dx) > Math.abs(dy) * 1.4) {
            isHorizontal = true;
            activeWrap.classList.add('is-swiping');
          }
          if (isHorizontal) {
            currentDx = Math.max(-110, Math.min(110, dx));
            contentEl.style.transform = `translateX(${currentDx}px)`;
          }
        }, { passive: true });

        document.addEventListener('touchend', () => {
          clearTimeout(rowLpTimer);
          if (!activeWrap || !contentEl) return;
          const wrap = activeWrap;
          const dx = currentDx;
          const wasHorizontal = isHorizontal;
          wrap.classList.remove('is-swiping');
          contentEl.style.transform = '';
          activeWrap = null;
          contentEl = null;
          isHorizontal = false;
          currentDx = 0;

          if (rowLongPressed || !wasHorizontal) return;
          const kind = wrap.dataset.txKind;
          const id = wrap.dataset.txId;
          if (!kind || !id) return;

          if (dx <= -68) {
            // Swipe LEFT -> Edit
            haptic('light');
            openTxModal(kind, id);
          } else if (dx >= 68) {
            // Swipe RIGHT -> Delete with 5s Undo Toast
            haptic('medium');
            deleteTx(kind, id);
          }
        }, { passive: true });
      }
    }

    function switchMainView(viewName, subTab = null) {
      if (bulkSelectMode) {
        bulkSelectMode = false;
        bulkSelectedIds.clear();
        updateBulkSelectBarUI();
      }
      activeMainView = viewName;

      if (viewName === 'cuentas' && subTab) {
        if (subTab === 'owed' || subTab === 'owe') {
          activeP2PTab = 'balance';
          activeBalanceFilter = subTab;
        } else if (subTab === 'cloud' || subTab === 'split') {
          activeP2PTab = 'grupos';
        } else {
          activeP2PTab = subTab;
        }
      }
      if (viewName === 'ajustes' && subTab !== null) {
        activeAjustesSub = subTab;
      }

      renderAllViews();
      syncRouteHash();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function shiftMonth(delta) {
      const p = String(viewMk || monthKey(todayStr())).split('-');
      const dt = new Date(+p[0], +p[1] - 1 + delta, 1);
      viewMk = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0');
      renderAllViews();
    }

    function resetToCurrentMonth() {
      viewMk = monthKey(todayStr());
      renderAllViews();
    }

    function renderPeriodBar() {
      const lbl = $('#period-label');
      if (lbl) lbl.textContent = monthLabel(viewMk);

      const switcher = $('#header-month-switcher');
      if (switcher) {
        const showMonth = activeMainView === 'inicio' || activeMainView === 'gastos' || activeMainView === 'analitica';
        switcher.classList.toggle('hidden', !showMonth);
        switcher.classList.toggle('flex', showMonth);
      }

      const stInfo = computeControlStreak();
      if (stInfo.days > (S?.streak?.best || 0)) {
        S.streak.best = stInfo.days;
        saveLocalState(false);
      }
    }

    function updateBottomNavUI() {
      const activeNavKey = (activeMainView === 'gastos') ? 'inicio' : activeMainView;
      const mapIcons = {
        inicio: 'home',
        cuentas: 'groups',
        analitica: 'insights',
        ajustes: 'person'
      };
      ['inicio', 'cuentas', 'analitica', 'ajustes'].forEach(k => {
        const navBtn = $('#nav-' + k);
        if (!navBtn) return;
        const isActive = (k === activeNavKey);

          : "nav-tab flex flex-col items-center justify-center text-on-surface-variant font-bold gap-0.5 py-1.5 rounded-2xl hover:text-primary transition-all active-scale relative";
        navBtn.setAttribute('aria-current', isActive ? 'page' : 'false');

            : "nav-pill px-3 py-1 rounded-full flex items-center justify-center transition-all";
        }
        if (icoWrap && mapIcons[k]) {
          icoWrap.innerHTML = ico(mapIcons[k], 'text-[22px]', isActive);

    function renderAllViews() {
      ['inicio', 'gastos', 'cuentas', 'analitica', 'ajustes'].forEach(v => {
        const container = $('#view-' + v);
        if (container) {
          if (v === activeMainView) {
            container.classList.remove('hidden');
            container.classList.add('flex');
          } else {
            container.classList.add('hidden');
            container.classList.remove('flex');
          }
        }
      });

      updateBottomNavUI();
      ensureCarried();
      renderPeriodBar();
      updateCloudHeaderUI();
      applyPrivacyModeUI();

      if (activeMainView === 'inicio') renderInicioView();
      if (activeMainView === 'cuentas') renderCuentasView();
      if (activeMainView === 'gastos') renderGastosView();
      if (activeMainView === 'analitica') renderAnaliticaView();
      if (activeMainView === 'ajustes') renderAjustesView();
    }

    function renderCategoryDonutSVG(cats, totalExp) {
      const R = 36, C = 2 * Math.PI * R;
      if (!(totalExp > 0) || !cats || cats.length === 0) {
        return `
          <svg width="96" height="96" viewBox="0 0 96 96" class="flex-shrink-0" aria-label="Sin gastos este mes">
            <circle cx="48" cy="48" r="${R}" fill="none" stroke="currentColor" class="text-surface-container-high" stroke-width="11"/>
            <text x="48" y="46" text-anchor="middle" font-size="11" font-weight="800" fill="currentColor" class="text-on-surface">${esc(fmt0(0))}</text>
            <text x="48" y="59" text-anchor="middle" font-size="8" font-weight="700" fill="currentColor" class="text-outline">MES LIMPIO</text>
          </svg>`;
      }
      let offset = 0;
      const circles = cats.slice(0, 6).map(d => {
        const c = catById(d.cat);
        const len = Math.max(2, (d.total / totalExp) * C);
        const seg = `<circle cx="48" cy="48" r="${R}" fill="none" stroke="${c.c}" stroke-width="11" stroke-dasharray="${len.toFixed(1)} ${C.toFixed(1)}" stroke-dashoffset="${(-offset).toFixed(1)}" transform="rotate(-90 48 48)"/>`;
        offset += (d.total / totalExp) * C;
        return seg;
      }).join('');
      const topCat = catById(cats[0].cat);
      const topPct = Math.round((cats[0].total / totalExp) * 100);
      return `
        <svg width="96" height="96" viewBox="0 0 96 96" class="flex-shrink-0" aria-label="Distribución de gastos, mayor categoría ${esc(topCat.name)} con ${topPct}%">
          <circle cx="48" cy="48" r="${R}" fill="none" stroke="currentColor" class="text-surface-container-high" stroke-width="11"/>
          ${circles}
          <text x="48" y="46" text-anchor="middle" font-size="13" font-weight="800" fill="currentColor" class="text-on-surface">${topPct}%</text>
          <text x="48" y="59" text-anchor="middle" font-size="8" font-weight="700" fill="currentColor" class="text-on-surface-variant">${esc(topCat.name.slice(0, 9))}</text>
        </svg>`;
    }

    function renderDateGroupedTransactionsHtml(mixedRows) {
      if (!mixedRows || mixedRows.length === 0) return '';
      const groups = [];
      const map = {};
      mixedRows.forEach(item => {
        const d = item.date || todayStr();
        if (!map[d]) {
          map[d] = { date: d, items: [], expSum: 0, incSum: 0 };
          groups.push(map[d]);
        }
        map[d].items.push(item);
        if (item._k === 'exp') map[d].expSum += Number(item.amount || 0);
        else map[d].incSum += Number(item.amount || 0);
      });

      return groups.map(g => {
        const netDay = g.incSum - g.expSum;
        const dayHeaderRight = g.expSum > 0 && g.incSum === 0
          ? `−${fmt(g.expSum)}`
          : g.incSum > 0 && g.expSum === 0
            ? `+${fmt(g.incSum)}`
            : fmtSigned(netDay);

        const rows = g.items.map(x => x._k === 'exp' ? renderExpenseRow(x) : renderIncomeRow(x)).join('');

        return `
          <div class="flex flex-col">
            <div class="px-4 py-2 bg-surface-container-low/90 border-y border-outline-variant/25 flex items-center justify-between">
              <span class="font-label-sm text-[10px] font-extrabold tracking-wider text-on-surface-variant uppercase">${esc(fmtRelativeDateHeader(g.date))}</span>
              <span class="font-label-sm text-[11px] font-extrabold tabular-nums privacy-val ${g.expSum > g.incSum ? 'text-on-surface-variant' : 'text-secondary'}">${dayHeaderRight}</span>
            </div>
            <div class="divide-y divide-outline-variant/20">
              ${rows}
            </div>
          </div>`;
      }).join('');
    }

    function computeLocalGroupBalances(g) {
      const bal = {};
      (g.members || []).forEach(m => bal[m] = 0);
      (g.items || []).forEach(it => {
        const who = (it.for || []).filter(m => g.members.includes(m));
        if (!who.length) return;
        const share = it.amount / who.length;
        bal[it.payer] = (bal[it.payer] || 0) + it.amount;
        who.forEach(m => bal[m] = (bal[m] || 0) - share);
      });
      return bal;
    }

    function computeMinimumSettlementPlan(bal) {
      const cred = Object.entries(bal).filter(([_, v]) => v > 0.005).map(([n, v]) => ({ n, v })).sort((a, b) => b.v - a.v);
      const debt = Object.entries(bal).filter(([_, v]) => v < -0.005).map(([n, v]) => ({ n, v: -v })).sort((a, b) => b.v - a.v);
      const out = [];
      let i = 0, j = 0, guard = 0;
      while (i < cred.length && j < debt.length && guard < 50) {
        guard++;
        const a = Math.min(cred[i].v, debt[j].v);
        out.push({ from: debt[j].n, to: cred[i].n, amount: Math.round(a * 100) / 100 });
        cred[i].v -= a;
        debt[j].v -= a;
        if (cred[i].v < 0.005) i++;
        if (debt[j].v < 0.005) j++;
      }
      return out;
    }

    /** Daily cumulative spending line vs previous month dashed ghost line */
    function renderGhostCumulativeSVG(mk) {
      const [Y, M] = mk.split('-').map(Number);
      const dim = new Date(Y, M, 0).getDate();
      const pMk = prevMonthKey(mk);
      const [pY, pM] = pMk.split('-').map(Number);
      const pDim = new Date(pY, pM, 0).getDate();
      const isCur = mk === monthKey(todayStr());
      const curLimitDay = isCur ? Math.min(dim, new Date().getDate()) : dim;

      const curDaily = new Array(dim).fill(0);
      monthExpenses(mk).forEach(e => {
        const d = Math.max(1, Math.min(dim, parseInt(String(e.date || '').slice(8, 10), 10) || 1));
        curDaily[d - 1] += (typeof e.amount_base_cents === 'number' ? e.amount_base_cents : Money.toCents(e.amount)) / 100;
      });
      const prevDaily = new Array(pDim).fill(0);
      monthExpenses(pMk).forEach(e => {
        const d = Math.max(1, Math.min(pDim, parseInt(String(e.date || '').slice(8, 10), 10) || 1));
        prevDaily[d - 1] += (typeof e.amount_base_cents === 'number' ? e.amount_base_cents : Money.toCents(e.amount)) / 100;
      });

      const curCum = [], prevCum = [];
      let acc = 0;
      for (let i = 0; i < curLimitDay; i++) { acc += curDaily[i]; curCum.push(acc); }
      acc = 0;
      for (let i = 0; i < pDim; i++) { acc += prevDaily[i]; prevCum.push(acc); }

      const maxVal = Math.max(...curCum, ...prevCum, 10);
      const W = 320, H = 110;
      const toPts = (arr, totalDays) => arr.map((v, i) => {
        const x = 6 + (i / Math.max(1, totalDays - 1)) * (W - 12);
        const y = H - 12 - (v / maxVal) * (H - 22);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');

      return `
        <svg viewBox="0 0 ${W} ${H}" class="w-full h-28" aria-label="Gasto acumulado diario comparado con el mes anterior">
          <line x1="6" y1="${H - 12}" x2="${W - 6}" y2="${H - 12}" stroke="currentColor" class="text-outline-variant/40" stroke-width="1"/>
          ${prevCum.length > 1 ? `<polyline fill="none" stroke="currentColor" class="text-outline" stroke-width="1.8" stroke-dasharray="4 3" points="${toPts(prevCum, pDim)}"/>` : ''}
          ${curCum.length > 1 ? `<polyline fill="none" stroke="#4f46e5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" points="${toPts(curCum, dim)}"/>` : ''}
        </svg>`;
    }

    /** 12-Month Stacked Income vs Expense + Savings Rate % Trend */
    function renderAnnual12MonthsSVG(mk) {
      const [Y, M] = mk.split('-').map(Number);
      const mks = [];
      for (let i = 11; i >= 0; i--) {
        const d = new Date(Y, M - 1 - i, 1);
        mks.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
      }
      const incs = mks.map(m => monthIncomeTotal(m));
      const exps = mks.map(m => sumExp(monthExpenses(m)));
      const rates = mks.map((m, i) => incs[i] > 0 ? Math.max(-50, Math.min(100, Math.round(((incs[i] - exps[i]) / incs[i]) * 100))) : 0);
      const labels = mks.map(m => new Date(+m.slice(0, 4), +m.slice(5) - 1, 1).toLocaleString('es-ES', { month: 'narrow' }).toUpperCase());

      const maxV = Math.max(...incs, ...exps, 1);
      const W = 360, H = 138, slot = W / 12, bw = Math.max(6, (slot - 8) / 2);
      let bars = '';
      const ratePts = [];
      labels.forEach((lb, i) => {
        const hI = Math.max(2, (incs[i] / maxV) * (H - 36));
        const hE = Math.max(2, (exps[i] / maxV) * (H - 36));
        const x = i * slot + 4;
        bars += `<rect x="${x.toFixed(1)}" y="${(H - 22 - hI).toFixed(1)}" width="${bw.toFixed(1)}" height="${hI.toFixed(1)}" rx="2" fill="#059669" fill-opacity="0.85"/>`;
        bars += `<rect x="${(x + bw + 1.5).toFixed(1)}" y="${(H - 22 - hE).toFixed(1)}" width="${bw.toFixed(1)}" height="${hE.toFixed(1)}" rx="2" fill="#e11d48" fill-opacity="0.85"/>`;
        bars += `<text x="${(x + bw).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="9" font-weight="700" fill="currentColor" class="text-on-surface-variant">${lb}</text>`;
        const ry = (H - 26) - ((rates[i] + 50) / 150) * (H - 42);
        ratePts.push(`${(x + bw).toFixed(1)},${ry.toFixed(1)}`);
      });

      const avgRate = Math.round(rates.reduce((a, b) => a + b, 0) / 12);
      return {
        avgRate,
        svg: `
          <svg viewBox="0 0 ${W} ${H}" class="w-full h-36" aria-label="Evolución anual de ingresos, gastos y tasa de ahorro">
            ${bars}
            <polyline fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="${ratePts.join(' ')}"/>
          </svg>`
      };
    }

    // ============================================================================
    // 12. VIEW 4: STATS (PREDICTIVE + RETROSPECTIVE ANALYTICS + UNIVERSAL SEARCH)
    // ============================================================================
    function renderAnaliticaView() {
      const el = $('#view-analitica');
      if (!el) return;

      const mk = viewMk;
      const [Y, M] = mk.split('-').map(Number);
      const exps = monthExpenses(mk);
      const totalExp = sumExp(exps);
      const totalInc = monthIncomeTotal(mk);
      const safe = safeToSpend(mk);
      const scoreObj = finScore(mk);
      const proj = computeEndOfMonthProjection(mk);
      const catProjs = computeCategoryProjections(mk).slice(0, 6);
      const horizon = computeExtendedHorizon();
      const annual = renderAnnual12MonthsSVG(mk);

      // 3-Way Semantic Comparisons: vs Prev Month, vs 6-Month Avg, vs Same Month Last Year
      const prevMk = prevMonthKey(mk);
      const prevExp = sumExp(monthExpenses(prevMk));
      const lastYearMk = `${Y - 1}-${String(M).padStart(2, '0')}`;
      const lastYearExp = sumExp(monthExpenses(lastYearMk));
      let sum6Exp = 0, cnt6 = 0;

                  Entre ${fmtSigned(Money.fromCents(proj.projectedEndLowCents))} y ${fmtSigned(Money.fromCents(proj.projectedEndHighCents))}

              <button onclick="openWhatIfSimulatorModal('${mk}')" class="px-3 py-1.5 rounded-xl bg-primary text-on-primary text-xs font-extrabold active-scale flex-shrink-0">What-If</button>

    function runAffordabilitySimulator() {
      const price = parseAmount($('#sim-input-price')?.value);
      const out = $('#sim-output-box');
      if (!out || !(price > 0)) return;
      const safe = safeToSpend(viewMk);
      const rest = safe - price;
      out.innerHTML = rest >= 0
        ? `<div class="p-3 rounded-xl bg-secondary/10 text-secondary flex items-center gap-2">
             ${ico('check_circle', 'text-[18px]')}
             <span>¡Sí puedes! Te quedarían <strong>${fmt(rest)}</strong> de margen seguro este mes.</span>
           </div>`
        : `<div class="p-3 rounded-xl bg-tertiary/10 text-tertiary flex items-center gap-2">
             ${ico('warning', 'text-[18px]')}
             <span>Mejor esperar: superarías tu margen seguro por <strong>${fmt(-rest)}</strong>.</span>
           </div>`;
    }

    function renderScoreRingSVG(score) {
      const R = 34, C = 2 * Math.PI * R;
      const col = score >= 70 ? "#006c4a" : score >= 45 ? "#d97706" : "#e11d48";
      return `
        <svg width="88" height="88" viewBox="0 0 92 92">
          <circle cx="46" cy="46" r="${R}" fill="none" stroke="currentColor" class="text-surface-container-high" stroke-width="9"/>
          <circle cx="46" cy="46" r="${R}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(score / 100 * C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 46 46)"/>
          <text x="46" y="52" text-anchor="middle" font-size="21" font-weight="800" fill="currentColor" class="text-on-surface">${score}</text>
        </svg>`;
    }

    function renderDualBarsSVG(labels, vInc, vExp) {
      const max = Math.max(...vInc, ...vExp, 1), W = 320, H = 135, bw = W / labels.length, w = (bw - 14) / 2;
      let s = "";
      labels.forEach((lb, i) => {
        const h1 = Math.max(4, (vInc[i] / max) * (H - 28));
        const h2 = Math.max(4, (vExp[i] / max) * (H - 28));
        const x = i * bw + 7;
        s += `<rect x="${x.toFixed(1)}" y="${(H - 18 - h1).toFixed(1)}" width="${w.toFixed(1)}" height="${h1.toFixed(1)}" rx="3" fill="#006c4a"/>
              <rect x="${(x + w + 2).toFixed(1)}" y="${(H - 18 - h2).toFixed(1)}" width="${w.toFixed(1)}" height="${h2.toFixed(1)}" rx="3" fill="#e11d48"/>
              <text x="${(x + bw / 2 - 6).toFixed(1)}" y="${H - 3}" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor" class="text-outline">${lb}</text>`;
      });
      return `
        <svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${s}</svg>
        <div class="flex justify-between text-xs font-bold text-on-surface-variant pt-1">
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-xs bg-secondary"></span>Ingresos</span>
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-xs bg-tertiary"></span>Gastos</span>
        </div>`;
    }

    function renderSparklineSVG(values, color) {
      const W = 280, H = 70, max = Math.max(...values, 1), min = Math.min(...values, 0);
      const rng = (max - min) || 1, n = values.length;
      const pts = values.map((v, i) => `${(i / (n - 1 || 1) * W).toFixed(1)},${(H - 8 - ((v - min) / rng) * (H - 16)).toFixed(1)}`).join(" ");
      return `
        <svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="h-16">
          <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round"/>
          <polygon points="0,${H} ${pts} ${W},${H}" fill="${color}" opacity="0.14"/>
        </svg>`;
    }

    function generateSmartAdvisorTipsHtml() {
      const mk = viewMk;
      const list = monthExpenses(mk), total = sumExp(list), inc = monthIncomeTotal(mk);
      const tips = [];
      const p2p = computeP2PMetrics();

      if (p2p.totalMeDeben > 0) {
        tips.push({
          type: "good",
          icon: "payments",
          text: `En el apartado <strong>Deudas</strong> te deben un total de <strong>${fmt(p2p.totalMeDeben)}</strong>. Reclamarlo por Bizum es tu liquidez más rápida.`
        });
      }

      (S.recurring || []).forEach(r => {
        const cands = list.filter(e => String(e.note || "").toLowerCase().includes(r.name.toLowerCase()) && Math.abs(e.amount - r.amount) > 0.01);
        if (cands.length) {
          tips.push({
            type: "warn",
            icon: "trending_up",
            text: `<strong>${esc(r.name)}</strong> ha cambiado de importe: tenías ${fmt(r.amount)} y este mes aparece por ${fmt(cands[0].amount)}.`
          });
        }
      });

      Object.entries(S.budgets || {}).forEach(([c, b]) => {
        const spent = sumExp(list.filter(e => e.cat === c));
        const eb = effBudget(c);
        if (b > 0 && spent > eb) {
          tips.push({
            type: "warn",
            icon: "warning",
            text: `Has superado el presupuesto de <strong>${esc(catById(c).name)}</strong> (${fmt0(spent)} de ${fmt0(eb)}).`
          });
        }
      });

      const refunds = (S.expenses || []).filter(e => e.refund);
      if (refunds.length > 0) {
        tips.push({
          type: "info",
          icon: "assignment_return",
          text: `Tienes <strong>${fmt(sumExp(refunds))}</strong> en ${refunds.length} compra(s) pendiente(s) de devolución.`
        });
      }

      const recTotal = (S.recurring || []).reduce((a, r) => a + Number(r.amount || 0), 0);
      if (recTotal > 0) {
        tips.push({
          type: "info",
          icon: "autorenew",
          text: `Tus suscripciones fijas suman <strong>${fmt(recTotal)}/mes</strong> (${fmt0(recTotal * 12)} al año).`
        });
      }

      if (inc > 0 && (inc - total) / inc >= 0.2) {
        tips.push({
          type: "good",
          icon: "verified",
          text: `Tu tasa de ahorro este mes es del <strong>${Math.round(((inc - total) / inc) * 100)}%</strong> (${fmt(inc - total)} ahorrados).`
        });
      }

      if (tips.length === 0) {
        tips.push({
          type: "good",
          icon: "check_circle",
          text: `Todo tu control mensual está en orden y sin alertas.`
        });
      }

      return tips.map(t => `
        <div class="p-3 rounded-xl border flex items-start gap-2.5 text-xs ${t.type === 'warn' ? 'bg-amber-500/10 border-amber-500/25 text-on-surface' : t.type === 'good' ? 'bg-secondary/10 border-secondary/25 text-on-surface' : 'bg-surface-container-low border-outline-variant/40 text-on-surface'}">
          ${ico(t.icon, `text-[18px] mt-0.5 ${t.type === 'warn' ? 'text-amber-600' : t.type === 'good' ? 'text-secondary' : 'text-primary'}`)}
          <div class="leading-relaxed">${t.text}</div>
        </div>
      `).join('');
    }
